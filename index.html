<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sleeper Helper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Designregeln "Flutlicht" (immer dunkel) =====
   1. Eine Akzentfarbe bedeutet: Du und klickbar. Flächen und Linien nutzen --accent (kräftig), Text und Links --accent-t (heller, bleibt lesbar). Sonst nichts ist blau.
   2. Flächen in drei Stufen: Grund (--bg), Karte (--surface), vertieft (--sunken). Abgrenzung nur durch 1px-Linien (--line), keine Schatten.
   3. Gut / Schlecht / Achtung sind reserviert für Bewertungen und stehen immer mit Symbol (▲ ▼ !) und Text, nie nur als Farbe.
   4. Positionen haben eigene kräftige Farben (Pink, Cyan, Violett, Orange, Lime), getönter Chip mit farbigem Rand und Punkt. Sie liegen bewusst abseits von Akzentblau, Gut-Grün und Schlecht-Rot. Fremde Teams in Diagrammen sind grau, nur Du bist farbig.
   5. Kopfzeile, Leisten und Tooltips gehören zur selben Flächenfamilie wie der Rest. Keine invertierten Balken.
   6. Eine Schrift (Barlow). Überschriften in normaler Schreibweise. Versalien nur für kleine Beschriftungen (Eyebrow, Tabellenkopf). Zahlen tabellarisch.
   7. Radien: 8px Karten, 6px Bedienelemente, rund für Pillen und Avatare. Abstände im 4px-Raster.
   8. Hover und Fokus: Rahmen in --accent. Aktiver Zustand: Akzentfläche mit weißem Text (Menü) oder gefüllte helle Pille (Filter). Kopfzeile trägt eine 2px-Akzentlinie. */
:root{
  --bg:#0D121C; --surface:#141B28; --raised:#1C2536; --sunken:#0A0E16; --line:#25304A;
  --ink:#E7ECF4; --muted:#8E9BB4; --faint:#66738F; --other-line:#3A4560;
  --accent:#2B77F5; --accent-t:#6FA9FF; --accent-ink:#FFFFFF; --accent-soft:#14306A;
  --mine:#2B77F5; --mine-soft:#14306A; --focus:#E7ECF4;
  --good:#46C28B; --bad:#F06F5E; --warn:#E6A93B;
  --good-soft:#17322F; --bad-soft:#372831; --warn-soft:#3A3326;
  --pos-qb:#FF5FA2; --pos-rb:#22D3EE; --pos-wr:#A78BFA; --pos-te:#FF9F43; --pos-k:#D4E157; --pos-def:#9AA7BD; --pos-idp:#D2A679;
  --src-draft:#2B77F5; --src-waiver:#F5C542; --src-trade:#D946EF; --src-bestand:#2EC4A0;
  --f-display:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:8px; --r-s:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(2.2rem,6vw,3.4rem);letter-spacing:-.02em}
h2{font-size:1.9rem;letter-spacing:-.015em}
h3{font-size:1.1rem;font-weight:600}
.panel>h3,.panel-head h3,summary>h3{font-size:1.12rem;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink)}
.panel>h3{padding-bottom:12px;border-bottom:1px solid var(--line)}
p{margin:0}
a{color:var(--accent-t)}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- Start ---------- */
.start{max-width:760px;margin:0 auto;padding-block:clamp(40px,10vh,110px) 48px;display:grid;gap:28px}
.start .yard{display:flex;gap:6px;align-items:flex-end;height:22px}
.start .yard i{display:block;width:2px;background:var(--line);height:10px}
.start .yard i:nth-child(5n+1){height:22px;background:var(--faint)}
.start-lead{font-size:1.1rem;color:var(--muted);max-width:56ch}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 260px;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);font-size:1.05rem}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:var(--r-s);border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:600;font-size:.95rem;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:6px 10px;font-size:.88rem}
.btn.ghost:hover{border-color:var(--accent)}
.hint{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted)}
.hint code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;background:var(--sunken);padding:1px 5px;border-radius:4px}
.err{padding:12px 14px;border-radius:var(--r);background:var(--bad-soft);color:var(--ink);border-left:3px solid var(--bad)}
.note{padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);border-left:3px solid var(--warn)}
.league-list{display:grid;gap:8px}
.league-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.league-item:hover{border-color:var(--accent)}
.league-item .meta{font-size:.85rem;color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;flex:none;background:var(--sunken);display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--muted);overflow:hidden;font-size:.95rem}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:56px;height:56px;font-size:1.3rem}
.av.sm{width:24px;height:24px;font-size:.7rem}

/* ---------- Team-Auswahl ---------- */
.pick{max-width:980px;margin:0 auto;padding-block:40px 60px;display:grid;gap:22px}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.team-card{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.team-card:hover{border-color:var(--mine);box-shadow:0 0 0 1px var(--mine)}
.team-card .tn{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.1;overflow-wrap:anywhere}
.team-card .mn{font-size:.86rem;color:var(--muted)}
.team-card .rec{margin-left:auto;font-family:var(--f-display);font-weight:600;font-size:1.05rem;color:var(--muted);white-space:nowrap}
.progress{display:grid;gap:6px;font-size:.88rem;color:var(--muted)}
.progress .track{height:4px;border-radius:2px;background:var(--sunken);overflow:hidden}
.progress .track span{display:block;height:100%;background:var(--accent);transition:width .3s}

/* ---------- App-Rahmen ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);color:var(--ink);border-bottom:2px solid var(--accent)}
.topbar-in{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.brand b{color:var(--accent-t)}
.lg-name{font-size:.92rem;opacity:.75;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 120px}
.switcher{display:flex;align-items:center;gap:6px;font-size:.82rem;opacity:.85}
.switcher select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:var(--r-s);padding:4px 8px;font-size:.84rem;max-width:180px}
.switcher select option{color:var(--ink);background:var(--surface)}
.linkbtn{background:none;border:0;padding:0;color:inherit;opacity:.75;text-decoration:underline;cursor:pointer;font-size:.84rem}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;max-width:1600px;margin:0 auto;padding-block:24px 60px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;display:grid;gap:18px}
.rail-group{display:grid;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 8px}
.rail-group .eyebrow{padding:0 10px 6px}
.nav-btn{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;border-radius:var(--r);background:none;border:0;cursor:pointer;font-weight:500;color:var(--muted)}
.nav-btn:hover{background:var(--sunken);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.content{min-width:0;display:grid;gap:22px;align-content:start}
.page-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.page-head .sub{color:var(--muted)}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:14px;padding-top:10px}
  .rail{position:static;display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
  .rail-group{display:flex;gap:4px;align-items:center;padding:4px 8px;flex:0 0 auto}
  .rail-group .eyebrow{padding:0 4px 0 2px;white-space:nowrap}
  .nav-btn{white-space:nowrap;padding:7px 10px}
}

/* ---------- Bausteine ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0;align-content:start}
.panel-head{display:grid;gap:4px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.panel-head:has(.filters){display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head p{color:var(--muted);font-size:.9rem;max-width:75ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:22px}
.grid2.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,600px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:2px}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:2.2rem;line-height:1;letter-spacing:-.01em}
.v.good,.grade.good,.delta.good,.t-good{color:var(--good)}
.v.bad,.grade.bad,.delta.bad,.t-bad{color:var(--bad)}
.v.warn,.grade.warn,.t-warn{color:var(--warn)}
.pick-card{display:grid;gap:10px;align-content:start}
.pick-card .pn{font-size:1.3rem;font-weight:700;line-height:1.15}
.pick-card .big{color:var(--muted);font-size:.95rem}
.pick-card .big b{font-size:1.7rem;color:var(--ink);font-weight:700;margin-right:2px}
.pick-card .delta{font-weight:700}
.kpi .l{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .s{font-size:.82rem;color:var(--muted)}
.scale-key{display:flex;align-items:center;gap:8px;margin:8px 0 0}
.scale-key i{width:84px;height:10px;border-radius:3px;border:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--bad) 22%,var(--surface)) 0 33%,var(--surface) 33% 67%,color-mix(in srgb,var(--good) 22%,var(--surface)) 67% 100%)}
.tinted{padding:2px 8px;border-radius:var(--r-s)}
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-weight:600;font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}td.n{white-space:nowrap}
tr.is-mine td{background:transparent}
tr.is-mine td:first-child,tr.is-mine td.rank,tr.is-mine td:has(>.team-cell),tr.is-mine td.tot{background:var(--mine-soft)}
tr.is-mine td:first-child{box-shadow:inset 3px 0 0 var(--mine)}
.rank{font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--muted);width:2.2em}
.team-cell{display:flex;align-items:center;gap:8px;min-width:150px}
.team-cell .t{font-weight:600;line-height:1.15}
.team-cell .m{font-size:.8rem;color:var(--muted)}
.pos{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:2px 7px 2px 6px;border-radius:4px;background:color-mix(in srgb,var(--pc,var(--pos-def)) 22%,transparent);border:1px solid color-mix(in srgb,var(--pc,var(--pos-def)) 55%,transparent);color:var(--ink);white-space:nowrap}
.pos::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc,var(--pos-def))}
.pos.QB{--pc:var(--pos-qb)} .pos.RB{--pc:var(--pos-rb)} .pos.WR{--pc:var(--pos-wr)} .pos.TE{--pc:var(--pos-te)} .pos.K{--pc:var(--pos-k)} .pos.DEF{--pc:var(--pos-def)}
.pos.DL,.pos.LB,.pos.DB{--pc:var(--pos-idp)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap;background:var(--raised);color:var(--ink)}
.chip.good{background:var(--good-soft)} .chip.good::before{content:"▲";font-size:.6rem;color:var(--good)}
.chip.bad{background:var(--bad-soft)} .chip.bad::before{content:"▼";font-size:.6rem;color:var(--bad)}
.chip.warn{background:var(--warn-soft)} .chip.warn::before{content:"!";font-weight:800;color:var(--warn)}
.chip.plain::before{content:none}
.chip.mine{background:var(--mine-soft)}
.pname{font-weight:600}
.pmeta{font-size:.78rem;color:var(--muted)}
.bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 64px;align-items:center;gap:10px;font-size:.88rem}
.bar-row .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bt{height:10px;background:var(--sunken);border-radius:0 4px 4px 0;position:relative}
.bar-row .bf{position:absolute;inset:0 auto 0 0;background:var(--faint);border-radius:0 4px 4px 0}
.bar-row .bm{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.bar-row .bv{text-align:right;font-weight:600}
.bar-row.is-mine .bf{background:var(--mine)}
.bar-row.is-mine .bl{font-weight:700}
.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.82rem;background:var(--sunken);padding:10px 12px;border-radius:var(--r-s);overflow-x:auto;white-space:normal;line-height:1.5}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.86rem;font-weight:600}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg:hover{border-color:var(--accent)}
select.sel{padding:6px 8px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.legend button i{width:14px;height:2px;background:var(--other-line);display:block}
.legend button.mine i{background:var(--mine);height:3px}
.legend button.focus{border-color:var(--focus)} .legend button.focus i{background:var(--focus);height:3px}
.legend .dash i{background:none;border-top:2px dashed var(--muted);height:0}
.chart{position:relative;width:100%;min-height:260px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.tip{position:absolute;pointer-events:none;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:.8rem;min-width:170px;z-index:5}
.tip .tr{display:flex;justify-content:space-between;gap:12px}
.tip .tr.me{color:var(--accent-t);font-weight:700}
.tip .tr.fo{color:var(--focus);font-weight:700}
.board{display:grid;gap:3px;min-width:0}
.board .cell{width:auto;min-width:0;min-height:58px;padding:5px 6px;border-radius:4px;background:var(--sunken);font-size:.76rem;line-height:1.2;display:grid;align-content:start;gap:2px;position:relative}
.board .cell.hd{background:none;font-weight:700;min-height:0;padding-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .cell.hd.is-mine{color:var(--accent-t)}
.board .cell .pn{font-weight:700;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .cell .pv{font-weight:700;font-size:.82rem;color:var(--ink)}
.vsep{width:1px;height:22px;background:var(--line);margin:0 4px;align-self:center}
#ftip{position:fixed;z-index:60;max-width:340px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font-size:.82rem;line-height:1.4;box-shadow:0 8px 24px #0009;pointer-events:none;display:none}
.board .cell .no{font-size:.68rem;color:var(--muted)}
.board .cell.steal{box-shadow:inset 0 0 0 2px var(--good)}
.board .cell.bust{box-shadow:inset 0 0 0 2px var(--bad)}
.board .cell.mine-col{background:color-mix(in srgb,var(--accent) 24%,var(--sunken))}
.board .cell .vd{position:absolute;right:5px;top:4px;font-size:.66rem;font-weight:800}
.board .cell.steal .vd{color:var(--good)} .board .cell.bust .vd{color:var(--bad)}
.board .cell.dim{opacity:.35}
.hintline.byewarn{color:var(--warn)}
.calc-res{display:grid;gap:4px;margin-top:10px}
.calc-row{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;background:var(--sunken);border-radius:var(--r-s)}
.calc-warn,.calc-sugg{margin-top:10px}
.calc-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.calc-sugg{padding:10px 12px;background:var(--sunken);border-radius:var(--r-s)}
.need-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:4px;vertical-align:middle}
.chips-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
th{white-space:normal;vertical-align:bottom}
.heat td.h{text-align:center;font-weight:600}
.heat td.h small{display:block;font-weight:500;font-size:.72rem;color:var(--muted)}
.spark{display:inline-flex;gap:2px;align-items:flex-end;height:26px;vertical-align:middle}
.spark i{display:block;width:5px;background:var(--faint);border-radius:2px 2px 0 0}
.spark i.b{background:var(--good)} .spark i.x{background:var(--bad)}
.stack{display:flex;height:22px;border-radius:4px;overflow:hidden;gap:2px;background:var(--surface)}
.stack span{display:block;height:100%}
.src-draft{background:var(--src-draft)} .src-waiver{background:var(--src-waiver)} .src-trade{background:var(--src-trade)} .src-bestand{background:var(--src-bestand)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.swap-list{display:grid;gap:8px}
.swap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r);background:var(--sunken)}
.swap .arrow{font-family:var(--f-display);font-weight:700;color:var(--muted)}
.swap .in{color:var(--good);font-weight:700}
.swap .out{color:var(--bad);font-weight:700}
.add-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.add-card:last-child{border-bottom:0}
.add-card .score{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1;text-align:right}
.add-card .parts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.add-card .hintline{grid-column:1/-1;font-size:.84rem;color:var(--ink)}
.add-card .hintline b{color:var(--good)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Optimale Aufstellung: Slots mit der kleinsten Auswahl zuerst, jeweils bester freier Spieler */
function optimalLineup(cands){
  const used = new Set(); let total = 0;
  const sorted = [...cands].filter(c => c.pid && c.pid !== '0').sort((a,b) => b.pts - a.pts);
  const order = S.slots.map((s,i) => ({s,i,n:elig(s).length})).sort((a,b) => a.n - b.n || a.i - b.i);
  const lineup = new Array(S.slots.length);
  for (const o of order){
    const c = sorted.find(c => !used.has(c.pid) && canPlay(c.pid, o.s));
    if (c){ used.add(c.pid); lineup[o.i] = {slot:o.s, pid:c.pid, pts:c.pts}; total += c.pts; }
    else lineup[o.i] = {slot:o.s, pid:null, pts:0};
  }
  return {total, lineup, set:used};
}

const normPos = p => (p === 'DE' || p === 'DT') ? 'DL' : (p === 'CB' || p === 'S') ? 'DB' : p;

/* Bye-Erkennung: Ein NFL-Team ohne einen einzigen Stat-Eintrag in einer Woche (bzw. ohne Projektion) hatte frei. */
function buildBye(){
  const nfl = new Set();
  for (const p of Object.values(S.players || {})) if (p.t && ['QB','RB','WR','TE'].includes(p.pos)) nfl.add(p.t);
  const need = Math.max(4, Math.floor(.7 * nfl.size));
  const teamOf = pid => S.players?.[pid]?.t || (isTeamCode(pid) ? pid : null);
  const played = {};
  for (const w of Object.keys(S.sPts || {})){
    const set = new Set(); for (const pid of Object.keys(S.sPts[w])){ const t = teamOf(pid); if (t) set.add(t); }
    if (set.size >= need) played[w] = set;
  }
  let proj = null;
  if (S.projOK){ const set = new Set(); for (const [pid,v] of Object.entries(S.proj)) if (v > 0){ const t = teamOf(pid); if (t) set.add(t); } if (set.size >= need) proj = set; }
  S.bye = {played, proj, teamOf};
}
/* Bye-Woche eines Spielers: aus dem Spielplan, sonst aus bereits gespielten Wochen und der aktuellen Projektion (künftige Byes dann unbekannt) */
function byeWeekOf(pid){
  const t = S.bye?.teamOf(pid); if (!t) return null;
  if (S.sched?.teamBye?.[t]) return S.sched.teamBye[t];
  if (!S._byeFb){
    const fb = {}, nfl = new Set(); for (const p of Object.values(S.players || {})) if (p.t && ['QB','RB','WR','TE'].includes(p.pos)) nfl.add(p.t);
    for (const [w, set] of Object.entries(S.bye.played || {})) for (const tm of nfl) if (!set.has(tm)) fb[tm] = +w;
    if (S.bye.proj && S.projWeek) for (const tm of nfl) if (!S.bye.proj.has(tm)) fb[tm] = S.projWeek;
    S._byeFb = fb;
  }
  return S._byeFb[t] ?? null;
}
/* Wie viel Punkte pro Woche fehlen in welcher kommenden Bye-Woche? (komplette Aufstellung wird je Woche neu berechnet) */
function byeProfile(pids, valOf, onlyPos){
  if (!S.isLive) return {weeks:[], worst:null};
  const cur = S.projWeek || S.currentWeek || 1, end = S.cfg && S.cfg.playoffStart ? S.cfg.playoffStart - 1 : 18;
  const items = pids.filter(p => p && p !== '0').map(pid => ({pid, v:valOf(pid), w:byeWeekOf(pid), pos:normPos(pos1(pid))}));
  const base = optimalLineup(items.map(x => ({pid:x.pid, pts:x.v}))).total;
  const weeks = [...new Set(items.map(x => x.w).filter(w => w && w >= cur && w <= end))].sort((a,b) => a - b);
  const out = weeks.map(w => {
    const gone = items.filter(x => x.w === w && (!onlyPos || x.pos === onlyPos)), rest = items.filter(x => !gone.includes(x));
    return {w, loss: base - optimalLineup(rest.map(x => ({pid:x.pid, pts:x.v}))).total, gone: gone.map(x => x.pid)};
  });
  return {weeks: out, worst: out.reduce((a,b) => !a || b.loss > a.loss ? b : a, null)};
}
function isBye(pid, w){

  const t = b.teamOf(pid); if (!t) return false;
  if (w == null || w === S.projWeek) return !!b.proj && !b.proj.has(t);
  return !!b.played[w] && !b.played[w].has(t);

/* Hat der Spieler in der Woche gespielt? Ohne Stat-Eintrag und mit 0 Punkten gilt: Bye, inaktiv oder verletzt. */
function didPlay(w, pid, v){

  return m[pid] != null;
}
function gamesPts(pid){

/* Erwartete Wochenpunkte: Form (60 % letzte 3, 40 % Saison, nur Einsatzwochen), mit Projektion gemischt */
/* Kleine Stichproben zählen weniger: Wer nur 1–2 Einsätze hatte, wird zum Positions-Niveau (55 % des Ø aller Spieler mit ≥ 3 Einsätzen) hingezogen.
   Beispiel: ein Einsatz mit 15,5 Punkten ergibt bei einem TE etwa 7 statt 15,5. */
const SHRINK_K = 2.5;
function posPrior(pos){
  if (!S._prior){
    const by = {}, seen = new Set();
    for (const w of Object.keys(S.sPts || {})) for (const pid of Object.keys(S.sPts[w])) seen.add(pid);
    for (const pid of seen){ const v = gamesPts(pid); if (v.length < 3) continue; const p = normPos(pos1(pid)); (by[p] = by[p] || []).push(avg(v)); }
    S._prior = {}; for (const p of Object.keys(by)) S._prior[p] = .55 * avg(by[p]);

}
function shrunk(vals, pos){ return vals.length ? (sum(vals) + SHRINK_K * posPrior(pos)) / (vals.length + SHRINK_K) : null; }
function formAdj(pid){ return shrunk(gamesPts(pid).slice(-3), normPos(pos1(pid))); }

  const v = gamesPts(pid), ps = normPos(pos1(pid)); const l3 = v.length ? shrunk(v.slice(-3), ps) : null, sa = v.length ? shrunk(v, ps) : null;
  const base = l3 != null ? .6 * l3 + .4 * sa : null; const pj = S.projOK ? S.proj[pid] : null;
  return c[pid] = (pj > 0) ? (base != null ? .5 * pj + .5 * base : pj) : (base ?? 0);

const ST_LABEL = {ir:'IR-Slot', taxi:'Taxi', out:'Out/IR', bye:'Bye'};
function playerState(pid, rr){

function computeDepth(){
  const C = S.C, D = {team:{}}, rids = S.teams.map(t => t.rid);
  const cands = arr => arr.map(x => ({pid:x.pid, pts:x.v}));
  for (const rid of rids){
    const rr = S.teamByRid[rid].roster;
    const info = (rr.players || []).filter(Boolean).map(pid => ({pid, pos: normPos(pos1(pid)), st: playerState(pid, rr), v: expVal(pid)}));
    const ok = info.filter(x => x.st === 'ok');
    const opt = optimalLineup(cands(ok));
    const per = {};
    for (const p of S.leaguePos){
      const mine = info.filter(x => x.pos === p);
      const okp = mine.filter(x => x.st === 'ok').sort((a,b) => b.v - a.v);
      const starters = okp.filter(x => opt.set.has(x.pid)), bench = okp.filter(x => !opt.set.has(x.pid));
      /* Ausfall des besten Starters: die GANZE Aufstellung wird neu berechnet. Ein zweiter TE im FLEX-Slot macht den TE-Platz
         nicht dünn, wenn ein RB/WR den FLEX übernehmen kann. cover = Wert dessen, der am Ende der Kette einspringt. */
      let loss = 0, topV = 0, bk = null, chain = [], topPid = null;
      if (starters.length){
        const top = starters[0]; topV = top.v;
        const o2 = optimalLineup(cands(ok.filter(x => x.pid !== top.pid)));
        loss = opt.total - o2.total;
        topPid = top.pid;
        const lab = slotLabels(), where = {}; opt.lineup.forEach((l,i) => { if (l.pid) where[l.pid] = i; });
        let idx = where[top.pid];
        while (idx != null && chain.length < 6){
          const np = o2.lineup[idx]?.pid; if (!np) break;
          const from = where[np];
          chain.push({pid:np, to:lab[idx], from: from == null ? null : lab[from], fromFlex: from != null && isFlexSlot(S.slots[from])});
          idx = from;
        }
        bk = [...o2.set].filter(pid => !opt.set.has(pid)).map(pid => ok.find(x => x.pid === pid)).sort((a,b) => b.v - a.v)[0] || null;
      }
      const cover = Math.max(0, topV - loss);
      const bye1 = top => top && bk ? (byeWeekOf(top.pid) != null && byeWeekOf(top.pid) === byeWeekOf(bk.pid) && byeWeekOf(top.pid) >= (S.projWeek || S.currentWeek || 1)) : false;
      const clash = S.isLive && starters.length ? bye1(starters[0]) : false;
      const o = per[p] = {clash, clashWeek: clash ? byeWeekOf(starters[0].pid) : null, all:mine.length, ok:okp.length, ir:mine.filter(x => x.st === 'ir').length, out:mine.filter(x => x.st === 'out').length, bye:mine.filter(x => x.st === 'bye').length, taxi:mine.filter(x => x.st === 'taxi').length,
        starters:starters.length, bench:bench.length, backup: cover, backupPid: bk ? bk.pid : null, chain, topPid, loss, str: C.posStr[rid][p], items:mine};
      o.miss = o.all - o.ok - o.taxi; o.bonus = depthW(p) * o.backup * (clash ? .5 : 1); o.val = o.str + o.bonus;
    }
    const vOf = Object.fromEntries(ok.map(x => [x.pid, x.v]));
    D.team[rid] = {per, bye: byeProfile(ok.map(x => x.pid), pid => vOf[pid]), total:opt.total, info, bonus: sum(S.leaguePos.map(p => per[p].bonus))};
  }
  for (const p of S.leaguePos){
    for (const key of ['val','loss','backup']){
      const m = rankTie(rids, rid => D.team[rid].per[p][key], key === 'loss');
      rids.forEach(rid => { D.team[rid].per[p][key + 'Rank'] = m[rid]; });
    }
  }
  const bm = rankTie(rids, rid => D.team[rid].bonus);
  rids.forEach(rid => { D.team[rid].bonusRank = bm[rid]; });

}
/* Rang mit Gleichstand; null, wenn alle gleich sind (dann keine Färbung) */
/* Als „springt ein“ zählt nur, wer von der Bank oder aus einem FLEX-Slot kommt. Wer schon auf einem Slot derselben Position steht (RB 2, WR 2), rückt nur intern auf. */
function entrant(o){
  const c = o.chain || [], i = c.findIndex(x => x.from == null || x.fromFlex);
  return i < 0 ? null : {step:c[i], next:c[i + 1] || null};
}
function chainShort(o){
  const e = entrant(o); if (!e) return '';
  return e.step.from ? `steht jetzt in ${esc(e.step.from)}${e.next ? ` · dort rückt ${esc(pname(e.next.pid))} nach` : ''}` : 'von der Bank';
}
function chainText(o){
  const c = o.chain, t = [`${pname(o.topPid)} fällt aus (${c[0].to}).`];
  c.forEach(x => t.push(`${pname(x.pid)} (${normPos(pos1(x.pid))}) spielt ${x.to}${x.from ? ', verlässt dafür ' + x.from : ', kommt von der Bank'}.`));

}
function rankTie(ids, f, asc){
  const vals = ids.map(f); if (Math.max(...vals) - Math.min(...vals) < 1e-9) return Object.fromEntries(ids.map(r => [r, null]));
  const m = {}; for (const r of ids) m[r] = 1 + ids.filter(o => asc ? f(o) < f(r) - 1e-9 : f(o) > f(r) + 1e-9).length; return m;
}
function teamSurplus(rid){
  const n = S.teams.length, th = Math.ceil(n/3), per = S.C.depth.team[rid].per, nm = rosterNorm();
  return S.leaguePos.filter(p => isCore(p) && per[p].bench >= 1 && per[p].backupRank <= th && per[p].backup > 0 && (p !== 'QB' && p !== 'TE' || per[p].ok > nm.min[p]));
}
const isCore = p => !['K','DEF'].includes(p);
function teamNeeds(rid){ const n = S.teams.length, th = Math.ceil(n/3), per = S.C.depth.team[rid].per; return S.leaguePos.filter(p => isCore(p) && per[p].valRank > n - th); }

/* ---------- Trade-Engine ---------- */
function tAvail(pid){
  const inj = S.players?.[pid]?.inj;
  return S.irSet && S.irSet.has(pid) ? .25 : UNAVAIL.has(inj) ? .4 : inj === 'Doubtful' ? .8 : inj === 'Questionable' ? .95 : 1;
}
const tVal = pid => expVal(pid) * tAvail(pid);
function replLevel(){
  if (S._repl) return S._repl;
  const rostered = new Set(S.rosters.flatMap(x => [...(x.players || []), ...(x.reserve || []), ...(x.taxi || [])]));
  const by = {};
  for (const [pid,p] of Object.entries(S.players || {})){
    if (rostered.has(pid) || p.act === false) continue;
    const pp = normPos(pos1(pid)); if (!S.leaguePos.includes(pp) || (!p.t && pp !== 'DEF')) continue;
    const v = UNAVAIL.has(p.inj) ? 0 : expVal(pid); if (v > 0) (by[pp] = by[pp] || []).push(v);
  }
  const out = {}; for (const p of S.leaguePos){ const a = (by[p] || []).sort((x,y) => y - x).slice(0, 3); out[p] = a.length ? avg(a) : 0; }
  return S._repl = out;
}
const vor = pid => Math.max(0, tVal(pid) - (replLevel()[normPos(pos1(pid))] || 0));

function teamValue(ids){
  const o = optimalLineup(ids.map(pid => ({pid, pts:tVal(pid)})));
  const rest = ids.filter(pid => !o.set.has(pid) && !['K','DEF'].includes(normPos(pos1(pid)))).map(vor).sort((a,b) => b - a).slice(0, 3);
  return {opt:o.total, total:o.total + .12 * sum(rest), set:o.set};
}
function baseValue(rid){ const c = S._tvb || (S._tvb = {}); return c[rid] || (c[rid] = teamValue(rosterIds(rid))); }
function evalTrade(them, give, get){
  const me = S.myRid, A = rosterIds(me), B = rosterIds(them);
  const A2 = A.filter(x => !give.includes(x)).concat(get), B2 = B.filter(x => !get.includes(x)).concat(give);
  const dMe = teamValue(A2).total - baseValue(me).total, dThem = teamValue(B2).total - baseValue(them).total;
  const mg = sum(give.map(vor)), mt = sum(get.map(vor));
  const balance = 1 - Math.abs(mg - mt) / Math.max(mg, mt, 1);
  const fitMe = clamp01(dMe / 4), fitThem = clamp01(dThem / 4);
  const score = Math.round(100 * (.4 * fitMe + .3 * fitThem + .3 * balance));
  const win = dMe > .3 && dThem > .1;
  const verdict = win && balance >= .6 ? {t:'Fair für beide', c:'good'}
    : dThem <= 0 ? {t:'Er hat keinen Anreiz', c:'warn'}
    : dMe <= 0 ? {t:'Bringt dir nichts', c:'bad'}
    : balance < .6 ? {t: mg > mt ? 'Du gibst mehr Wert ab' : 'Er gibt mehr Wert ab', c:'warn'}
    : {t:'Ausgeglichen', c:'plain'};
  return {rid:them, give, get, dMe, dThem, mg, mt, balance, fitMe, fitThem, score, verdict};
}
function tradeSuggestions(){
  const me = S.myRid; if (S._trades && S._trades.rid === me) return S._trades.list;
  const top = ids => ids.map(pid => ({pid, v:vor(pid)})).filter(x => x.v > .3).sort((a,b) => b.v - a.v).slice(0, 9).map(x => x.pid);

async function loadDetails(){
  const L = S.league, nfl = S.nfl, season = String(L.season);
  const st = L.settings || {};
  const sameSeason = String(nfl.season) === season;
  S.isLive = sameSeason && nfl.season_type === 'regular';
  let currentWeek;
  if (sameSeason){
    currentWeek = nfl.season_type === 'pre' ? 0 : nfl.season_type === 'regular' ? (nfl.week || 1) : 18;
  } else currentWeek = 18;
  const lastScored = (typeof st.last_scored_leg === 'number' && st.last_scored_leg > 0) ? st.last_scored_leg
                     : (S.isLive ? currentWeek - 1 : currentWeek);
  const maxW = Math.min(18, Math.max(currentWeek, lastScored));
  const weeks = Array.from({length:maxW}, (_,i) => i+1);
  S.currentWeek = currentWeek; S.lastScored = lastScored;
  const playoffStart = st.playoff_week_start || 99;

  const jobs = [];
  // Matchups pro Woche
  S.matchups = {};
  jobs.push(pool(weeks, 6, async w => { S.matchups[w] = await api(`/league/${L.league_id}/matchups/${w}`) || []; }).then(() => progress('Matchups geladen')));
  // Spielerdatenbank (gecacht in IndexedDB, 12 h)
  jobs.push(loadPlayers().then(p => { S.players = p; progress('Spielerdatenbank geladen'); }));
  // Draft
  S.picks = []; S.draft = null;
  if (L.draft_id){
    jobs.push(Promise.all([api('/draft/' + L.draft_id), api(`/draft/${L.draft_id}/picks`)])
      .then(([d,p]) => { S.draft = d; S.picks = p || []; progress('Draft geladen'); })
      .catch(() => progress('Draft nicht verfügbar')));
  } else S.prog.total--;
  // Transaktionen
  S.tx = [];
  jobs.push(pool(weeks.length ? weeks : [1], 6, async w => (await api(`/league/${L.league_id}/transactions/${w}`)) || [])
    .then(r => { S.tx = r.flat().filter(Boolean); progress('Transaktionen geladen'); }));
  // Inoffizielle Daten: Wochen-Stats, Projektionen, Trends
  S.sPts = {}; S.statsOK = false;
  const statWeeks = weeks.filter(w => w <= lastScored);
  jobs.push(pool(statWeeks, 4, async w => {
    const m = await fetchStatLike('stats', season, w);
    if (!m) return;
    const out = {};
    for (const [pid, s] of Object.entries(m)){ const p = scorePts(s); if (p || (s.gp > 0)) out[pid] = p || 0; }
    S.sPts[w] = out; S.statsOK = true;

    }).catch(() => progress('Projektionen nicht erreichbar')));
    jobs.push(api('/players/nfl/trending/add?lookback_hours=48&limit=200').then(t => { S.trending = t || []; progress('Trends geladen'); })
      .catch(() => { S.trending = []; progress('Trends nicht erreichbar'); }));
  } else { S.trending = []; }
  S.sched = null;
  if (S.isLive) jobs.push(fetchSchedule(season).then(m => { S.sched = m; progress(m ? 'Spielplan geladen' : 'Spielplan nicht erreichbar, Bye-Wochen nur aus Stats'); }));
  S.prog.total = jobs.length;
  S.prog.done = 0;
  await Promise.all(jobs);

  // Spielerpunkte aus den Matchups (offizielles Liga-Scoring)
  S.mPts = {};
  for (const w of weeks){ const o = {}; for (const m of S.matchups[w] || []) for (const [pid,v] of Object.entries(m.players_points || {})) o[pid] = v; S.mPts[w] = o; }

  S.completed = weeks.filter(w => w <= lastScored && hasScores(w));
  S.regWeeks = S.completed.filter(w => w < playoffStart);
  S._ev = {}; S._byeFb = null; S._prior = null; S._tr = null; S._tvb = {}; S._repl = null; S._trades = null; S._faTop = null; S._tx = {}; S.irSet = new Set(S.rosters.flatMap(r => r.reserve || []));

  S.C = compute();

}

/* NFL-Spielplan (inoffizieller Sleeper-Endpunkt): daraus ergibt sich die Bye-Woche jedes Teams, auch für künftige Wochen */
async function fetchSchedule(season){
  try {
    const d = await api(`${API_X}/schedule/nfl/regular/${season}`);
    if (!Array.isArray(d) || !d.length) return null;
    const weeks = new Set(), by = {};
    for (const g of d){ const w = +g.week; if (!w || !g.home || !g.away) continue; weeks.add(w); for (const t of [g.home, g.away]) (by[t] = by[t] || new Set()).add(w); }
    const all = [...weeks].filter(w => w <= 18);
    if (all.length < 14) return null;
    const teamBye = {};
    for (const [t, ws] of Object.entries(by)){ const miss = all.filter(w => !ws.has(w)); if (miss.length === 1) teamBye[t] = miss[0]; }
    return Object.keys(teamBye).length >= 20 ? {teamBye} : null;
  } catch(e){ return null; }
}

  for (const u of urls){
    try {
      const d = await api(u); const map = {};
      if (Array.isArray(d)){ for (const it of d) if (it && it.player_id && it.stats) map[it.player_id] = it.stats; }
      else if (d && typeof d === 'object'){ for (const [k,v] of Object.entries(d)) if (v && typeof v === 'object') map[k] = v; }
      if (Object.keys(map).length) return map;
    } catch(e){ /* nächster Versuch */ }
  }
  return null;
}

/* ============================================================
   Berechnungen
   ============================================================ */
function compute(){
  const C = {weeks:S.regWeeks};
  const rids = S.teams.map(t => t.rid);
  const reserve = new Set(S.rosters.flatMap(r => [...(r.reserve||[]), ...(r.taxi||[])]));
  C.scores = {}; C.opp = {};
  for (const w of S.allWeeks){
    const sc = {}, byM = {}, opp = {};
    for (const m of S.matchups[w] || []){
      sc[m.roster_id] = +(m.custom_points ?? m.points ?? 0);
      if (m.matchup_id != null) (byM[m.matchup_id] = byM[m.matchup_id] || []).push(m.roster_id);
    }
    for (const g of Object.values(byM)) if (g.length === 2){ opp[g[0]] = g[1]; opp[g[1]] = g[0]; }
    C.scores[w] = sc; C.opp[w] = opp;
  }
  // Pro Team
  C.team = {};
  for (const rid of rids){
    const pts = C.weeks.map(w => C.scores[w][rid]).filter(v => v != null);
    const a = avg(pts) ?? 0, s = sd(pts), l3 = avg(pts.slice(-3)) ?? 0;
    let w_ = 0, l_ = 0, t_ = 0, apW = 0, apL = 0, apT = 0, exp = 0, act = 0, opt = 0;
    const effW = {};
    for (const w of C.weeks){
      const me = C.scores[w][rid]; if (me == null) continue;
      const o = C.opp[w][rid];
      if (o != null){ const op = C.scores[w][o]; if (me > op) w_++; else if (me < op) l_++; else t_++; }
      let ww = 0, ll = 0, tt = 0;
      for (const r2 of rids){ if (r2 === rid) continue; const v = C.scores[w][r2]; if (v == null) continue; if (me > v) ww++; else if (me < v) ll++; else tt++; }
      apW += ww; apL += ll; apT += tt;
      const n = ww + ll + tt; if (n && o != null) exp += (ww + tt/2) / n;
      // Coaching-Effizienz
      const m = (S.matchups[w] || []).find(x => x.roster_id === rid);
      if (m){
        const pp = m.players_points || {};
        const cands = (m.players || []).filter(p => !reserve.has(p) || (m.starters||[]).includes(p)).map(pid => ({pid, pts: pp[pid] || 0}));
        const o2 = optimalLineup(cands);
        const actual = (m.starters_points && m.starters_points.length) ? sum(m.starters_points) : me;
        const optimal = Math.max(o2.total, actual);
        act += actual; opt += optimal;
        const startSet = new Set((m.starters || []).filter(p => p && p !== '0'));
        const benchIn = o2.lineup.filter(x => x.pid && !startSet.has(x.pid)).sort((a,b) => b.pts - a.pts);
        const startOut = (m.starters || []).map((pid,i) => ({pid, pts:(m.starters_points||[])[i] || 0})).filter(x => x.pid && x.pid !== '0' && !o2.set.has(x.pid)).sort((a,b) => a.pts - b.pts);
        effW[w] = {actual, optimal, left: optimal - actual, benchIn, startOut};
      }
    }
    const games = w_ + l_ + t_;
    C.team[rid] = {
      avg:a, sd:s, l3, pr: 0.4*a + 0.4*l3 + 0.2*(a - s), pts,
      w:w_, l:l_, t:t_, games, apW, apL, apT, apPct: (apW + apL + apT) ? (apW + apT/2)/(apW+apL+apT) : null,
      expW: exp, luck: (w_ + t_/2) - exp,
      eff: opt ? act/opt : null, left: opt - act, effW
    };
  }
  const prSorted = [...rids].sort((a,b) => C.team[b].pr - C.team[a].pr);
  prSorted.forEach((rid,i) => C.team[rid].prRank = i+1);
  // Tabelle
  C.standings = [...S.teams].sort((a,b) => (b.wins + b.ties/2) - (a.wins + a.ties/2) || b.pf - a.pf);
  C.standings.forEach((t,i) => C.team[t.rid].place = i+1);
  [...S.teams].sort((a,b) => b.pf - a.pf).forEach((t,i) => C.team[t.rid].pfRank = i+1);
  [...rids].sort((a,b) => (C.team[b].eff ?? 0) - (C.team[a].eff ?? 0)).forEach((rid,i) => C.team[rid].effRank = i+1);
  [...rids].sort((a,b) => C.team[b].luck - C.team[a].luck).forEach((rid,i) => C.team[rid].luckRank = i+1);
  [...rids].sort((a,b) => (C.team[b].apPct ?? 0) - (C.team[a].apPct ?? 0)).forEach((rid,i) => C.team[rid].apRank = i+1);
  const rk = (key, asc) => [...rids].sort((a,b) => asc ? C.team[a][key] - C.team[b][key] : C.team[b][key] - C.team[a][key]).forEach((rid,i) => C.team[rid][key + 'Rank'] = i+1);
  rk('avg'); rk('l3'); rk('sd', true); rk('left', true);

  // Positionsstärke: Ø Starterpunkte pro Woche. Wochen, in denen ein Starter nicht gespielt hat (Bye, inaktiv, verletzt),
  // zählen mit dem Positionsschnitt des Teams statt mit 0, damit die Stärke nicht durch Ausfälle verzerrt wird.
  C.posStr = {}; C.dnp = {};
  for (const rid of rids){
    const sumP = {}, cnt = {}, dn = {}; S.leaguePos.forEach(p => { sumP[p] = 0; cnt[p] = 0; dn[p] = 0; });
    for (const w of C.weeks){
      const m = (S.matchups[w] || []).find(x => x.roster_id === rid); if (!m) continue;
      (m.starters || []).forEach((pid,i) => { if (!pid || pid === '0') return; const p = normPos(pos1(pid)); if (sumP[p] == null) return; const v = (m.starters_points || [])[i] || 0; if (didPlay(w, pid, v)){ sumP[p] += v; cnt[p]++; } else dn[p]++; });
    }
    const n = C.weeks.length || 1; let cost = 0, slotWeeks = 0;
    C.posStr[rid] = Object.fromEntries(S.leaguePos.map(p => { const mean = cnt[p] ? sumP[p] / cnt[p] : 0; cost += dn[p] * mean / n; slotWeeks += dn[p]; return [p, (sumP[p] + dn[p] * mean) / n]; }));
    C.dnp[rid] = {slotWeeks, cost};
  }
  C.posRank = {};
  for (const p of S.leaguePos){
    const sorted = [...rids].sort((a,b) => C.posStr[b][p] - C.posStr[a][p]);
    sorted.forEach((rid,i) => { (C.posRank[rid] = C.posRank[rid] || {})[p] = i+1; });
  }

  // Draft-Bewertung
  C.draft = computeDraft();
  // Erwerbsquelle pro Spieler
  C.acq = {};
  const push = (rid, pid, w, type) => { const k = rid + '|' + pid; (C.acq[k] = C.acq[k] || []).push({w, type}); };
  if (S.draft && String(S.draft.season) === String(S.league.season)) for (const pk of S.picks) if (pk.player_id) push(pk.roster_id, pk.player_id, 0, 'draft');
  const txs = S.tx.filter(t => t && t.status === 'complete').sort((a,b) => (a.leg||0) - (b.leg||0) || (a.created||0) - (b.created||0));
  for (const t of txs) for (const [pid, rid] of Object.entries(t.adds || {})) push(rid, pid, t.leg || 0, t.type === 'trade' ? 'trade' : 'waiver');
  return C;
}
function acqType(rid, pid, w){
  const ev = (S.C.acq[rid + '|' + pid] || []).filter(e => e.w <= w);
  return ev.length ? ev[ev.length-1].type : 'bestand';
}

function seasonPts(pid){
  let t = 0, g = 0;
  for (const w of S.C ? S.C.weeks : S.regWeeks){ const v = weekPts(pid, w); if (v != null && didPlay(w, pid, v)){ t += v; g++; } }
  return {t, g};
}
const ppg = r => r.g ? `Ø <b>${f1(r.pts / r.g)}</b> Punkte pro gespieltem Spiel (${r.g} von ${S.C.weeks.length} Wochen, ohne Bye und Verletzung)` : 'Noch kein Einsatz in der Wertung';
function computeDraft(){
  const picks = (S.picks || []).filter(p => p.player_id);
  if (!picks.length) return null;
  const rows = picks.map(pk => {
    const md = pk.metadata || {};
    const pos = md.position || pos1(pk.player_id);
    const sp = seasonPts(pk.player_id);
    return {pk, pid:pk.player_id, rid:pk.roster_id, round:pk.round, no:pk.pick_no, slot:pk.draft_slot, pos,
      name: (md.first_name ? `${md.first_name} ${md.last_name}` : pname(pk.player_id)), team: md.team || nflTeam(pk.player_id), pts: sp.t, g: sp.g};
  });
  const hasData = S.regWeeks.length > 0;
  for (const r of rows){
    let peers = [];
    for (const span of [2, 4, 99]){
      peers = rows.filter(o => o !== r && o.pos === r.pos && Math.abs(o.round - r.round) <= span);
      if (peers.length >= 2) break;
    }
    r.exp = peers.length ? avg(peers.map(o => o.pts)) : r.pts;
    r.delta = r.pts - r.exp;
    r.rel = r.delta / Math.max(r.exp, 10);
    /* Ø pro gespieltem Spiel gegen den Schnitt der Vergleichspicks (nur Spieler mit Einsatz) */
    const pp = peers.filter(o => o.g > 0);
    r.ppg = r.g ? r.pts / r.g : null;
    r.expPpg = pp.length ? avg(pp.map(o => o.pts / o.g)) : r.ppg;
    r.dPpg = r.ppg != null && r.expPpg != null ? r.ppg - r.expPpg : null;
    r.relPpg = r.dPpg != null ? r.dPpg / Math.max(r.expPpg, 5) : null;
  }
  /* Fairer Pick: Innerhalb seiner Position wird jeder Spieler nach Leistung eingeordnet, einmal nach Gesamtpunkten, einmal nach Ø pro Spiel (ab 2 Einsätzen).
     Der k-beste Spieler einer Position bekommt den Pick, den die Liga für den k-ten Spieler dieser Position tatsächlich vergeben hat. */
  const nTm = S.teams.length, pickLbl = no => { const rd = Math.ceil(no / nTm); return `${rd}.${String(no - (rd - 1) * nTm).padStart(2, '0')}`; };
  for (const pos of new Set(rows.map(r => r.pos))){
    const grp = rows.filter(r => r.pos === pos), byNo = [...grp].sort((a,b) => a.no - b.no);
    const rk = f => new Map([...grp].sort((a,b) => f(b) - f(a)).map((r,i) => [r, i]));
    const rp = rk(r => r.pts), rg = rk(r => r.g >= 2 ? r.ppg : -1);
    for (const r of grp){ r.fairPts = byNo[rp.get(r)].no; r.fairPpg = byNo[rg.get(r)].no; }
    [...grp].sort((a,b) => (rp.get(a) + rg.get(a)) - (rp.get(b) + rg.get(b)) || b.pts - a.pts).forEach((r,k) => { r.fairNo = byNo[k].no; r.fairLbl = pickLbl(byNo[k].no); });
  }
  /* Steal/Bust: Beide Maßstäbe (Gesamtpunkte UND Ø pro Spiel) müssen einen Pick mindestens eine halbe Runde früher (Steal) bzw. später (Bust) rechtfertigen.
     So ist 1.01 nie ein Steal, ein Verletzter mit wenigen Einsätzen kein Bust, und wer nur wenige Spiele hatte, kein Steal. K und DEF werden nicht gewertet. */
  const gapS = no => Math.max(Math.round(.7 * nTm), Math.round(.35 * no)), gapB = no => Math.max(Math.round(.7 * nTm), Math.round(.45 * no));
  rows.forEach(r => {
    r.pickLbl = pickLbl(r.no); r.note = '';
    const eligible = hasData && r.g >= 2 && !['K','DEF'].includes(r.pos);
    r.verdict = !eligible ? '' : (Math.max(r.fairPts, r.fairPpg) <= r.no - gapS(r.no)) ? 'steal' : (Math.min(r.fairPts, r.fairPpg) >= r.no + gapB(r.no)) ? 'bust' : '';
    r.fairTxt = r.verdict ? `Gewählt bei ${r.pickLbl}, Leistung wie ein Pick ${r.verdict === 'steal' ? 'ab' : 'um'} ${r.fairLbl}.` : '';
  });
  /* Nur die jeweils 20 deutlichsten Steals und Busts bleiben (Abstand zwischen echtem und fairem Pick) */
  for (const [v, f] of [['steal', r => r.no - Math.max(r.fairPts, r.fairPpg)], ['bust', r => Math.min(r.fairPts, r.fairPpg) - r.no]]){
    rows.filter(r => r.verdict === v).sort((a,b) => f(b) - f(a)).slice(20).forEach(r => { r.verdict = ''; r.fairTxt = ''; });
  }
  const by = {};
  for (const r of rows) (by[r.rid] = by[r.rid] || []).push(r);
  const grades = {};
  for (const [rid, rs] of Object.entries(by)){
    let ws = 0, s = 0;
    for (const r of rs){ const w = 1/Math.sqrt(r.round || 1); ws += w; s += w * r.delta; }
    grades[rid] = {score: ws ? s/ws : 0, picks: rs, steals: rs.filter(r => r.verdict === 'steal').length, busts: rs.filter(r => r.verdict === 'bust').length, total: sum(rs.map(r => r.pts))};
  }
  const sc = Object.values(grades).map(g => g.score), m = avg(sc) ?? 0, s = sd(sc) || 1;
  for (const g of Object.values(grades)){
    g.z = (g.score - m) / s;
    g.grade = !hasData ? '–' : g.z >= 1.25 ? 'A+' : g.z >= .75 ? 'A' : g.z >= .4 ? 'B+' : g.z >= .1 ? 'B' : g.z >= -.2 ? 'C+' : g.z >= -.5 ? 'C' : g.z >= -.85 ? 'D' : 'F';
  }
  Object.entries(grades).sort((a,b) => b[1].score - a[1].score).forEach(([rid,g],i) => g.rank = i+1);
  return {rows, grades, rounds: Math.max(...rows.map(r => r.round)), hasData};
}

/* ---------- Liniendiagramm (eigene SVG-Umsetzung) ---------- */
function lineChart(id, {labels, series, avgLine}){
  const compact = isM();
  const draw = () => {
    const host = document.getElementById(id); if (!host) return;
    const W = Math.max(compact ? 260 : 300, host.clientWidth || 700), H = compact ? 220 : 280, ml = compact ? 30 : 40, mr = compact ? 46 : 70, mt = 12, mb = 28;
    const all = series.flatMap(s => s.values).concat(avgLine || []).filter(v => v != null);
    if (!all.length || !labels.length){ host.innerHTML = noWeeks(); return; }
    const step = 25;
    let lo = Math.floor(Math.min(...all) / step) * step, hi = Math.ceil(Math.max(...all) / step) * step;
    if (hi === lo) hi = lo + step;
    const tickStep = (hi - lo) / step > 6 ? step * 2 : step;
    const x = i => ml + (labels.length === 1 ? (W-ml-mr)/2 : i * (W - ml - mr) / (labels.length - 1));
    const y = v => mt + (hi - v) * (H - mt - mb) / (hi - lo);
    const path = vals => vals.map((v,i) => v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).map((p,i) => (i ? 'L' : 'M') + p).join('');
    let g = '';
    for (let v = lo; v <= hi + 1e-9; v += tickStep) g += `<line x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${ml-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
    labels.forEach((l,i) => { if (labels.length <= (compact ? 7 : 12) || i % 2 === 0 || i === labels.length - 1) g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(l)}</text>`; });
    const ord = [...series].sort((a,b) => (a.role ? 1 : 0) - (b.role ? 1 : 0));
    for (const s of ord){
      const col = s.role === 'mine' ? 'var(--mine)' : s.role === 'focus' ? (s.col || 'var(--focus)') : 'var(--other-line)';
      g += `<path d="${path(s.values)}" fill="none" stroke="${col}" stroke-width="${s.role ? 2.5 : 1.5}" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (s.role){
        s.values.forEach((v,i) => { if (v != null) g += `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>`; });
        const li = s.values.map((v,i) => v != null ? i : -1).filter(i => i >= 0).pop();
        if (li != null) g += `<text x="${x(li)+8}" y="${y(s.values[li])+4}" style="fill:var(--ink);font-weight:600">${esc(s.role === 'mine' ? 'Du' : (s.short || s.label).slice(0, compact ? 6 : 12))}</text>`;
      }
    }
    if (avgLine){
      g += `<path d="${path(avgLine)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
      const li = avgLine.length - 1;
      if (avgLine[li] != null){
        let ly = y(avgLine[li]) + 4;
        for (const s of series.filter(s => s.role)){ const v = s.values[li]; if (v != null && Math.abs(y(v) + 4 - ly) < 13) ly = y(v) + 4 + (y(v) <= y(avgLine[li]) ? 13 : -13); }
        g += `<text x="${x(li)+8}" y="${ly}">Ø Liga</text>`;
      }
    }
    g += `<line id="${id}-cx" x1="0" x2="0" y1="${mt}" y2="${H-mb}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;
    g += `<rect x="${ml}" y="${mt}" width="${W-ml-mr}" height="${H-mt-mb}" fill="transparent" id="${id}-hit"/>`;
    host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Wochenpunkte">${g}</svg><div class="tip" hidden></div>`;
    const hit = document.getElementById(id + '-hit'), cx = document.getElementById(id + '-cx'), tip = host.querySelector('.tip'), svg = host.querySelector('svg');
    const move = ev => {
      const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * W / r.width;
      let i = Math.round((px - ml) / ((W - ml - mr) / Math.max(1, labels.length - 1))); i = Math.max(0, Math.min(labels.length - 1, i));
      cx.setAttribute('x1', x(i)); cx.setAttribute('x2', x(i)); cx.setAttribute('visibility', 'visible');
      let rows = series.map(s => ({s, v:s.values[i]})).filter(o => o.v != null).sort((a,b) => b.v - a.v);
      rows.forEach((o,k) => o.rank = k + 1);
      if (compact) rows = rows.filter(o => o.rank <= 3 || o.s.role);
      tip.innerHTML = `<div style="font-weight:700;margin-bottom:4px">${esc(labels[i])}</div>` + rows.map(o => `<div class="tr ${o.s.role === 'mine' ? 'me' : o.s.role === 'focus' ? 'fo' : ''}"><span>${compact ? o.rank + '. ' : ''}${esc(compact ? o.s.label.slice(0,18) : o.s.label)}</span><span>${f1(o.v)}</span></div>`).join('') + (avgLine && avgLine[i] != null ? `<div class="tr" style="opacity:.7;margin-top:3px"><span>Ø Liga</span><span>${f1(avgLine[i])}</span></div>` : '');
      tip.hidden = false;
      const left = (x(i) * r.width / W); const tw = tip.offsetWidth;
      tip.style.left = (left + 14 + tw > r.width ? left - tw - 14 : left + 14) + 'px'; tip.style.top = '8px';
    };
    hit.addEventListener('mousemove', move);
    hit.addEventListener('touchstart', e => move(e.touches[0]), {passive:true});
    hit.addEventListener('touchmove', e => move(e.touches[0]), {passive:true});
    hit.addEventListener('click', move);
    svg.addEventListener('click', ev => { if (ev.target !== hit) move(ev); });
    hit.addEventListener('pointerleave', e => { if (e.pointerType !== 'mouse') return; tip.hidden = true; cx.setAttribute('visibility','hidden'); });
  };
  S.after.push(draw); S.charts.push(draw);
}

function tintF(f){

function lineupData(){
  const rid = S.myRid, r = S.teamByRid[rid].roster;
  const starters = (r.starters || []).slice(0, S.slots.length);
  const hidden = new Set([...(r.reserve||[]), ...(r.taxi||[])]);
  const bench = (r.players || []).filter(p => !starters.includes(p) && !hidden.has(p));
  /* Erwartung für diese Woche: Sleeper-Projektion (50 %) gemischt mit Form (Ø letzte 3 Einsätze) und Saisonschnitt, nur Einsatzwochen. Bye = 0, Verletzung nach Status gewichtet. */
  const val = pid => isBye(pid) ? 0 : expVal(pid) * availF(pid);
  const cands = [...starters, ...bench].filter(p => p && p !== '0').map(pid => ({pid, pts: val(pid)}));
  const opt = optimalLineup(cands);
  const curTot = sum(starters.map(p => p && p !== '0' ? val(p) : 0));
  const gain = opt.total - curTot;
  const live = (S.matchups[S.currentWeek] || []).find(m => m.roster_id === rid);
  const livePts = live && live.players_points || {};
  const anyLive = Object.values(livePts).some(v => v !== 0);
  const outs = starters.filter(p => p && p !== '0' && !opt.set.has(p)).sort((a,b) => val(a) - val(b));
  const ins = [...opt.set].filter(p => !starters.includes(p)).sort((a,b) => val(b) - val(a));
  const warns = [];
  starters.forEach((p,i) => {
    if (!p || p === '0') warns.push(`Slot ${slotLabel(S.slots[i])} ist leer.`);
    else {
      const inj = S.players?.[p]?.inj;
      if (inj && ['Out','IR','PUP','Sus','Doubtful'].includes(inj)) warns.push(`${pname(p)} steht auf „${inj}“.`);
      if (S.projOK && S.proj[p] == null) warns.push(`${pname(p)} hat keine Projektion – vermutlich Bye-Week oder nicht im Kader.`);
    }
  });
  const reason = pid => { const l3 = lastN(pid); const parts = [`Erw. ${f1(val(pid))}`]; if (S.projOK && S.proj[pid] != null) parts.push(`Proj. ${f1(S.proj[pid])}`); if (l3 != null) parts.push(`Ø3 ${f1(l3)}`); if (isBye(pid)) parts.push('Bye'); const inj = S.players?.[pid]?.inj; if (inj) parts.push(inj); return parts.join(' · '); };
  const rest = [...outs];
  const pairs = ins.map(pin => { let k = rest.findIndex(o => pos1(o) === pos1(pin)); if (k < 0) k = rest.findIndex(o => starters.some((sp,i) => sp === o && canPlay(pin, S.slots[i]))); if (k < 0) k = 0; return {pin, pout: rest.splice(k,1)[0]}; });
  return {starters, bench, val, opt, curTot, gain, livePts, anyLive, outs, ins, warns, reason, pairs};
}

    <section class="panel"><div class="panel-head"><h3>Deine Startelf diese Woche</h3></div>
      <div class="tbl-wrap"><table><thead><tr><th>Slot</th><th>Spieler</th><th class="n">Erwartung</th>${S.projOK ? '<th class="n">Proj.</th>' : ''}<th class="n">Ø 3 W.</th>${anyLive ? '<th class="n">Live</th>' : ''}<th>Status</th></tr></thead><tbody>
      ${starters.map((p,i) => `<tr><td><span class="slot">${esc(slotLabel(S.slots[i]))}</span></td><td>${p && p !== '0' ? playerCell(p) : '<span class="muted">leer</span>'}</td><td class="n" style="font-weight:700">${p && p !== '0' ? f1(val(p)) : '–'}</td>${S.projOK ? `<td class="n">${p && S.proj[p] != null ? f1(S.proj[p]) : '–'}</td>` : ''}<td class="n">${f1(lastN(p))}</td>${anyLive ? `<td class="n">${f1(livePts[p])}</td>` : ''}<td>${p && p !== '0' && !opt.set.has(p) ? '<span class="chip bad">raus</span>' : p && p !== '0' ? '<span class="chip good">passt</span>' : ''}</td></tr>`).join('')}
      </tbody></table></div>
      <h3 style="margin-top:6px">Bank</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Spieler</th><th class="n">Erwartung</th>${S.projOK ? '<th class="n">Proj.</th>' : ''}<th class="n">Ø 3 W.</th>${anyLive ? '<th class="n">Live</th>' : ''}<th></th></tr></thead><tbody>
      ${bench.sort((a,b) => val(b) - val(a)).map(p => `<tr><td>${playerCell(p)}</td><td class="n" style="font-weight:700">${f1(val(p))}</td>${S.projOK ? `<td class="n">${S.proj[p] != null ? f1(S.proj[p]) : '–'}</td>` : ''}<td class="n">${f1(lastN(p))}</td>${anyLive ? `<td class="n">${f1(livePts[p])}</td>` : ''}<td>${opt.set.has(p) ? '<span class="chip good">rein</span>' : ''}</td></tr>`).join('')}
      </tbody></table></div>
    </section>`;
  } else {
    out += `<div class="note">Der Live-Check ist nur während der laufenden Hauptrunde verfügbar. Unten siehst du den Saisonrückblick.</div>`;
  }
  // Rückblick
  const T = C.team[rid];
  const rows = C.weeks.map(w => ({w, ...(T.effW[w] || {})})).filter(r => r.optimal != null).reverse();
  out += `<section class="panel"><div class="panel-head"><h3>Rückblick: liegengelassene Punkte</h3><p>Effizienz ${pct(T.eff)} · insgesamt ${f1(T.left)} Punkte auf der Bank verschenkt.</p></div>
    ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Woche</th><th class="n">Ist</th><th class="n">Optimal</th><th class="n">Verschenkt</th><th>Größter Fehlgriff</th><th style="min-width:150px">Ergebnis</th></tr></thead><tbody>
    ${rows.map(r => { const o = C.opp[r.w][rid]; const me = C.scores[r.w][rid], op = o != null ? C.scores[r.w][o] : null;
      const res = op == null ? '' : me > op ? `<span class="chip good">Sieg</span>` : me < op ? (op < r.optimal ? `<span class="chip warn">Niederlage – optimal wäre Sieg</span>` : `<span class="chip bad">Niederlage</span>`) : '<span class="chip plain">Remis</span>';
      const bi = r.benchIn[0], so = r.startOut[0];
      return `<tr><td>W${r.w}</td><td class="n">${f1(r.actual)}</td><td class="n">${f1(r.optimal)}</td><td class="n" style="font-weight:700">${r.left > .05 ? f1(r.left) : '–'}</td>
      <td class="small" style="min-width:220px">${bi && r.left > .05 ? `${esc(pname(bi.pid))} (${f1(bi.pts)}) saß auf der Bank${so ? `, ${esc(pname(so.pid))} (${f1(so.pts)}) startete` : ''}` : '<span class="muted">optimal aufgestellt</span>'}</td><td>${res}</td></tr>`; }).join('')}
    </tbody></table></div>` : noWeeks()}</section>`;
  return out;
};

/* ---------- Players to Add ---------- */
VIEWS.adds = () => {
  const C = S.C, rid = S.myRid, r = S.teamByRid[rid].roster;
  if (!S.isLive) return head('Players to Add') + `<div class="note">Waiver-Empfehlungen gibt es nur für die laufende Saison.</div>`;
  if (!S.players) return head('Players to Add') + `<div class="err">Spielerdatenbank nicht geladen.</div>`;
  const rostered = new Set(S.rosters.flatMap(x => [...(x.players||[]), ...(x.reserve||[]), ...(x.taxi||[])]));
  const tr = Object.fromEntries((S.trending || []).map(t => [t.player_id, t.count]));
  const maxTr = Math.max(0, ...Object.values(tr));
  const useProj = S.projOK;
  const list = [];
  for (const [pid, p] of Object.entries(S.players)){
    if (rostered.has(pid)) continue;
    const pl = posList(pid).map(x => x === 'DE' || x === 'DT' ? 'DL' : x === 'CB' || x === 'S' ? 'DB' : x);
    const pp = pl.find(x => S.leaguePos.includes(x)); if (!pp) continue;
    if (!p.t && pp !== 'DEF') continue;
    if (p.act === false) continue;
    const hs = helperScore(pid), recent = hs.recent, proj = hs.proj, tc = hs.tc;
    if ((recent == null || recent <= 0) && !proj && !tc) continue;
    const injF = hs.injF, base = hs.base, trendB = hs.trendB;
    list.push({pid, pos:pp, recent, n: hs.n, proj, tc, injF, base, trendB, score: hs.score, val: (useProj ? (proj || 0) : (recent || 0)) * availF(pid)});
  }
  list.sort((a,b) => b.score - a.score);
  // Vergleich mit eigenem Kader
  const starters = (r.starters || []).slice(0, S.slots.length);
  const hidden = new Set([...(r.reserve||[]), ...(r.taxi||[])]);
  const bench = (r.players || []).filter(p => !starters.includes(p) && !hidden.has(p));
  const myVal = pid => (useProj ? (S.proj[pid] ?? 0) : (lastN(pid) ?? 0)) * availF(pid);
  const hint = a => {
    let worst = null;
    starters.forEach((p,i) => { if (!canPlayPos(a.pos, S.slots[i])) return; const v = (p && p !== '0') ? helperScore(p).score : -1; if (!worst || v < worst.v) worst = {p, v, slot:S.slots[i]}; });
    if (worst && a.score > worst.v + .5) return `<b>Stärker als dein ${esc(slotLabel(worst.slot))}</b>: ${worst.p && worst.p !== '0' ? `${esc(pname(worst.p))} (Score ${f1(worst.v)})` : 'leerer Slot'}`;
    const bp = bench.filter(p => posList(p).includes(a.pos)).sort((x,y) => helperScore(x).score - helperScore(y).score)[0];
    if (bp && a.score > helperScore(bp).score + .5) return `Upgrade für die Bank: besser als ${esc(pname(bp))} (Score ${f1(helperScore(bp).score)})`;
    if (!bench.some(p => posList(p).includes(a.pos)) && !starters.some(p => posList(p).includes(a.pos))) return `Du hast keinen ${esc(a.pos)} im Kader`;
    return '';
  };
  const f = S.addsPos || 'ALL';
  const nm = rosterNorm(), mc = posCount(rid, rosterIds(rid).filter(p => !hidden.has(p)));
  const sensible = a => { const p = normPos(a.pos); if ((mc[p] || 0) < nm.max[p]) return true;
    const same = rosterIds(rid).filter(x => !hidden.has(x) && normPos(pos1(x)) === p); return !same.length || a.score > Math.min(...same.map(x => helperScore(x).score)) + .5; };
  /* Echte Verbesserungen: der Zugang erhöht die erwarteten Punkte pro Woche der Aufstellung (Startelf + Bankwert), gemessen mit dem sinnvollsten Drop */
  const better = [];
  for (const a of list.filter(sensible).slice(0, 60)){
    const adv = dropAdvice(a.pid); if (adv && adv.gain > .15) better.push({a, adv});
  }
  better.sort((x,y) => y.adv.gain - x.adv.gain);
  const topBetter = better.slice(0, 8);
  const shown = list.filter(a => (f === 'ALL' || a.pos === f) && sensible(a)).slice(0, 25);
  S.after.push(() => document.querySelectorAll('[data-apos]').forEach(b => b.addEventListener('click', () => { S.addsPos = b.dataset.apos; renderView(); })));
  const weakPos = S.leaguePos.filter(p => C.depth.team[rid].per[p].valRank > S.teams.length - Math.ceil(S.teams.length/3));
  const scoreHelp = `<b>So entsteht der Score</b> (in Punkten deines Liga-Scorings)<code>${useProj ? 'Score = (0,55 × Projektion W' + S.projWeek + ' + 0,45 × Ø letzte 3 Wochen) × Verletzungsfaktor + Trend-Bonus (0–3)' : 'Score = Ø letzte 3 Wochen × Verletzungsfaktor + Trend-Bonus (0–3)'}</code>Verletzungsfaktor: Questionable 0,85 · Doubtful 0,55 · Out 0,25 · IR 0,1. Trend-Bonus: Adds auf Sleeper in den letzten 48 h, logarithmisch. <b>Drop-Vorschlag</b>: der Kaderspieler, dessen Abgang deine Aufstellung inklusive Bank am wenigsten kostet.${weakPos.length ? ` Deine schwächsten Positionen: <b>${weakPos.join(', ')}</b>.` : ''}`;
  return `
  ${head('Players to Add', `Free Agents deiner Liga · Woche ${S.projWeek}`, undefined, scoreHelp)}
  <p class="small muted"><b>Helper-Score</b> = von Sleeper Helper berechneter Wert, keine Sleeper-Zahl. Er wird für Free Agents und für deine eigenen Spieler gleich berechnet (Details beim „?“).</p>
  ${useProj ? '' : `<div class="note">Die Sleeper-Projektionen sind gerade nicht erreichbar. Die Empfehlung basiert nur auf den Ist-Punkten der letzten Wochen${S.trending.length ? ' und den Trending Adds' : ''}.</div>`}
  <section class="panel"><div class="panel-head"><h3>Verbesserungen für dein Team</h3>${qm(`Nur Free Agents, die deine erwarteten Punkte pro Woche spürbar erhöhen (mindestens +0,15 Pkt.): Berechnet wird die beste Aufstellung inklusive FLEX und Superflex plus Bankwert, jeweils mit dem sinnvollsten Drop. Der übliche Kader (z. B. ein Ersatz-QB) bleibt dabei erhalten.`)}</div>
    ${topBetter.length ? topBetter.map(({a, adv}, i) => `<div class="add-card">
      <div style="display:flex;gap:10px;align-items:flex-start;min-width:0"><span class="rank">${i+1}</span>${playerCell(a.pid)}</div>
      <div class="score" style="${tintF(Math.min(1, .5 + adv.gain / 8))}" title="Gewinn für dein Team in erwarteten Punkten pro Woche">+${f1(adv.gain)}<small>Pkt./Woche</small></div>
      <div class="parts"><span>Erwartung <b>${f1(expVal(a.pid))}</b> Pkt./Woche</span>${isBye(a.pid) ? '<span>diese Woche Bye</span>' : useProj ? `<span>Proj. W${S.projWeek}: <b>${f1(a.proj)}</b></span>` : ''}<span>Ø 3 Wochen: <b>${f1(a.recent)}</b>${a.n < 3 ? ` <span class="muted">(nur ${a.n} Einsatz${a.n === 1 ? '' : 'e'}, wird vorsichtiger bewertet)</span>` : ''}</span></div>
      ${(() => { const r = addRole(a.pid, adv.pid); const b = byeNote(a.pid, adv.pid); return `<div class="hintline">${roleChip(r)} ${esc(r.text)}</div>${b ? `<div class="hintline ${b.warn ? 'byewarn' : ''}"><span class="chip ${b.warn ? 'warn' : 'plain'}">Bye</span> ${esc(b.text)}</div>` : ''}`; })()}
      ${adv.free ? `<div class="hintline drop">Kaderplatz frei: <b class="ok">kein Drop nötig</b></div>` : `<div class="hintline drop"><b>Drop-Vorschlag:</b> ${esc(pname(adv.pid))} ${posChip(pos1(adv.pid))} <span class="muted">(${adv.starter ? 'Starter' : 'Bank'}, Erwartung ${f1(expVal(adv.pid))})</span></div>`}
    </div>`).join('') : `<div class="empty">Aktuell gibt es keinen Free Agent, der dein Team spürbar verbessert.</div>`}
  </section>
  <section class="panel"><div class="panel-head"><h3>Alle Free Agents nach Score</h3></div>
    <div class="filters">${['ALL', ...S.leaguePos].map(p => `<button class="seg" data-apos="${p}" aria-pressed="${f === p}">${p === 'ALL' ? 'Alle' : p}${weakPos.includes(p) ? ' <span class="need-dot" title="Bedarf: Diese Position ist bei dir im schwächsten Drittel der Liga"></span>' : ''}</button>`).join('')}</div>${weakPos.length ? `<p class="small muted" style="margin:8px 0 0"><span class="need-dot"></span> Bedarf: Position im schwächsten Drittel der Liga (Aufstellung und Kadertiefe zusammen)</p>` : ''}
    ${shown.length ? `<div>${shown.map((a,i) => `
      <div class="add-card">
        <div style="display:flex;gap:10px;align-items:flex-start;min-width:0"><span class="rank">${i+1}</span>${playerCell(a.pid)}</div>
        <div class="score" title="Helper-Score: von Sleeper Helper berechnet">${f1(a.score)}<small>Helper-Score</small></div>
        <div class="parts">${useProj ? `<span>Proj. W${S.projWeek}: <b>${f1(a.proj)}</b></span>` : ''}<span>Ø 3 Wochen: <b>${f1(a.recent)}</b>${a.n < 3 ? ` <span class="muted">(nur ${a.n} Einsatz${a.n === 1 ? '' : 'e'}, wird vorsichtiger bewertet)</span>` : ''}</span><span>Trending: <b>${a.tc ? f0(a.tc) + ' Adds' : '–'}</b></span>${a.injF < 1 ? `<span>Verletzungsfaktor ×${String(a.injF).replace('.',',')}</span>` : ''}</div>
        ${(() => { const r = addRole(a.pid, null); const b = byeNote(a.pid, null); return `<div class="hintline">${roleChip(r)} ${esc(r.text)}</div>${b ? `<div class="hintline ${b.warn ? 'byewarn' : ''}"><span class="chip ${b.warn ? 'warn' : 'plain'}">Bye</span> ${esc(b.text)}</div>` : ''}`; })()}
        ${(() => { const h = hint(a); return h ? `<div class="hintline">${h}</div>` : ''; })()}
        ${dropLine(a)}
      </div>`).join('')}</div>` : `<div class="empty">Keine passenden Free Agents gefunden.</div>`}
  </section>`;
};
function canPlayPos(pos, slot){ const e = elig(slot); return e.includes(pos) || (pos === 'DL' && (e.includes('DE') || e.includes('DT'))) || (pos === 'DB' && (e.includes('CB') || e.includes('S'))); }

/* ---------- Meine Draft-Bilanz ---------- */
VIEWS.mydraft = () => {
  const D = S.C.draft, rid = S.myRid;
  if (!D) return head('Meine Draft-Bilanz') + `<div class="empty">Für diese Saison gibt es keinen Draft mit Picks.</div>`;
  const g = D.grades[rid];
  if (!g) return head('Meine Draft-Bilanz') + `<div class="empty">Dein Team hat in diesem Draft keine Picks.</div>`;
  const T = S.C.team[rid];
  const rows = [...g.picks].sort((a,b) => a.no - b.no);
  const best = [...g.picks].sort((a,b) => b.delta - a.delta)[0], worst = [...g.picks].sort((a,b) => a.delta - b.delta)[0];
  return `
  ${head('Meine Draft-Bilanz', `${g.picks.length} Picks · Bewertung gegen ligainterne Vergleichspicks`)}
  <div class="kpis">
    ${kpi(g.grade, 'Draft-Note', `Rang ${g.rank} von ${Object.keys(D.grades).length}`, gradeTone(g.grade), g.rank)}
    ${kpi(sgn(g.score), 'Value pro Pick', 'Punkte über Erwartung, frühe Runden zählen mehr', numTone(g.score), g.rank)}
    <div class="kpi"><span class="l">Steals / Busts</span><span class="v"><span class="t-good">${g.steals}</span> / <span class="t-bad">${g.busts}</span></span><span class="s">Treffer / Fehlgriffe</span></div>
    ${kpi(f0(g.total), 'Punkte deiner Picks', `Tabelle: Platz ${T.place}`, '', 1 + Object.values(D.grades).filter(x => x.total > g.total).length)}
  </div>
  ${scaleKey()}
  ${D.hasData && best ? `<div class="grid2">
    <div class="panel pick-card"><span class="chip good" style="justify-self:start">Bester Pick</span><div><div class="pn">${esc(pname(best.pid))}</div><div class="pmeta">${posChip(pos1(best.pid))} ${esc(nflTeam(best.pid))} · Runde ${best.round}</div></div><div class="big"><b>${f1(best.pts)}</b> Punkte <span class="delta good">${sgn(best.delta)}</span> gegenüber vergleichbaren Picks</div><div class="pmeta">${ppg(best)}</div></div>
    <div class="panel pick-card"><span class="chip bad" style="justify-self:start">Schwächster Pick</span><div><div class="pn">${esc(pname(worst.pid))}</div><div class="pmeta">${posChip(pos1(worst.pid))} ${esc(nflTeam(worst.pid))} · Runde ${worst.round}</div></div><div class="big"><b>${f1(worst.pts)}</b> Punkte <span class="delta bad">${sgn(worst.delta)}</span> gegenüber vergleichbaren Picks</div><div class="pmeta">${ppg(worst)}</div></div>
  </div>` : ''}
  ${D.hasData && best ? (() => {
    const pg = g.picks.filter(x => x.dPpg != null && x.g >= 2), bA = [...pg].sort((a,b) => b.dPpg - a.dPpg)[0], wA = [...pg].sort((a,b) => a.dPpg - b.dPpg)[0];
    const card = (r, good) => `<div class="panel pick-card"><span class="chip ${good ? 'good' : 'bad'}" style="justify-self:start">${good ? 'Bester Schnitt' : 'Schwächster Schnitt'}</span><div><div class="pn">${esc(pname(r.pid))}</div><div class="pmeta">${posChip(pos1(r.pid))} ${esc(nflTeam(r.pid))} · Runde ${r.round}</div></div><div class="big"><b>${f1(r.ppg)}</b> Punkte pro Spiel <span class="delta ${good ? 'good' : 'bad'}">${sgn(r.dPpg)}</span> gegenüber vergleichbaren Picks</div><div class="pmeta">${r.g} gespielte Wochen · Gesamt ${f1(r.pts)} Punkte</div></div>`;
    return bA && wA ? `<div class="grid2">${card(bA, true)}${card(wA, false)}</div>` : '';
  })() : ''}
  <section class="panel"><div class="panel-head"><h3>Alle Picks</h3>${qm(`Erwartung = Ø-Punkte der Spieler gleicher Position, die ligaintern in ähnlicher Runde (±2) gezogen wurden. <b>Ø pro Spiel</b> = Punkte geteilt durch gespielte Wochen (Bye und Verletzung zählen nicht) und <b>Steal/Bust</b>: Innerhalb seiner Position wird jeder Spieler nach Leistung eingeordnet, nach Gesamtpunkten <b>und</b> nach Ø pro Spiel. Ein Steal ist, wer in beiden Rangfolgen deutlich früher hätte fallen müssen (mindestens eine dreiviertel Runde und 35 % des Pick-Werts), ein Bust das Gegenteil (mindestens 45 % später). Angezeigt werden höchstens die 20 deutlichsten Steals und die 20 deutlichsten Busts. Pick 1.01 kann nie ein Steal sein, Verletzte mit wenigen Einsätzen sind kein Bust. K und DEF zählen nicht. Beim Hover steht, ab wann der Spieler hätte gewählt werden können (Steal) bzw. bis wann man hätte warten können (Bust): Er wird innerhalb seiner Position nach Leistung eingeordnet und bekommt den Pick, den die Liga für diesen Rang auf der Position tatsächlich vergeben hat. Die Note beruht auf den Gesamtpunkten.`)}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Pick</th><th style="min-width:170px">Spieler</th><th class="n">Punkte</th><th class="n">Ø pro Spiel</th><th class="n">Erwartung</th><th class="n">Differenz</th><th class="n">Ø erwartet</th><th class="n">Ø Diff.</th><th>Urteil</th><th>Noch im Kader</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r.round}.${String(r.no - (r.round-1)*S.teams.length).padStart(2,'0')}<div class="pmeta">#${r.no}</div></td><td>${playerCell(r.pid)}</td><td class="n">${f1(r.pts)}</td><td class="n">${r.g ? f1(r.ppg) : '–'}<div class="pmeta">${r.g} Sp.</div></td><td class="n">${f1(r.exp)}</td><td class="n">${sgn(r.delta)}</td><td class="n">${r.expPpg != null ? f1(r.expPpg) : '–'}</td><td class="n">${r.dPpg != null ? sgn(r.dPpg) : '–'}</td><td>${r.verdict === 'steal' ? '<span class="chip good">Steal</span>' : r.verdict === 'bust' ? '<span class="chip bad">Bust</span>' : ''}${r.fairTxt ? `<div class="pmeta" title="${esc(r.fairTxt)}">${r.verdict === 'steal' ? 'ab ' : 'bis ca. '}${r.fairLbl}</div>` : ''}</td><td>${(S.teamByRid[rid].roster.players||[]).includes(r.pid) ? 'ja' : '<span class="muted">nein</span>'}</td></tr>`).join('')}
    </tbody></table></div></section>`;
};

   Ansichten: Liga
   ============================================================ */
VIEWS.league = () => {
  const C = S.C, L = S.league, st = L.settings || {}, sc = L.scoring_settings || {};
  const rec = sc.rec ?? 0;
  const scoring = rec >= 1 ? 'PPR' : rec >= .5 ? 'Half-PPR' : rec > 0 ? `${String(rec).replace('.',',')} PPR` : 'Standard';
  const pr = [...S.teams].sort((a,b) => C.team[a.rid].prRank - C.team[b.rid].prRank);
  if (C.weeks.length){
    lineChart('ch-league', {labels: C.weeks.map(w => 'W' + w), series: weeklySeries(), avgLine: C.weeks.map(w => avg(Object.values(C.scores[w])))});
    bindLegend();
  }
  return `
  ${head(L.name, `${L.season} · ${S.cfg.type} · ${S.cfg.teams} Teams · ${scoring}`, avatar(L.avatar, L.name, 'lg'))}
  <section class="panel">
    <div class="panel-head"><h3>Liga-Profil</h3>${qm(`Automatisch aus den Liga-Einstellungen erkannt. Alle Berechnungen nutzen genau dieses Scoring und diese Slots.`)}</div>
    <div class="profile">
      <span>Typ <b>${esc(S.cfg.type)}</b></span>
      <span>Scoring <b>${esc(scoring)}</b></span>
      <span>Pass-TD <b>${f0(sc.pass_td ?? 4)} Pkt.</b></span>
      ${sc.bonus_rec_te ? `<span>TE-Premium <b>+${String(sc.bonus_rec_te).replace('.',',')}</b></span>` : ''}
      <span>Playoffs <b>${S.cfg.playoffTeams || '–'} Teams ab Woche ${S.cfg.playoffStart || '–'}</b></span>
      ${S.cfg.faab != null ? `<span>FAAB <b>${S.cfg.faab} $</b></span>` : '<span>Waiver <b>Rolling</b></span>'}
      ${S.cfg.tradeDeadline ? `<span>Trade-Deadline <b>Woche ${S.cfg.tradeDeadline}</b></span>` : ''}
    </div>
    <div class="slots">${(L.roster_positions || []).filter(s => s !== 'BN').map(s => `<span class="slot">${esc(slotLabel(s))}</span>`).join('')}<span class="slot">${(L.roster_positions||[]).filter(s => s === 'BN').length}× Bank</span></div>
  </section>
  <div class="grid2 wide">
    <section class="panel"><div class="panel-head"><h3>Tabelle</h3></div>
      ${scaleKey()}
      <div class="tbl-wrap"><table><thead><tr><th></th><th>Team</th><th class="n">S–N</th><th class="n">Pkt. für</th><th class="n">Pkt. gegen</th><th class="n">Serie</th></tr></thead><tbody>
      ${C.standings.map((t,i) => `<tr class="${mineCls(t.rid)}"><td class="rank" style="${tint(i+1)}">${i+1}</td><td>${teamCell(t.rid)}</td><td class="n">${t.wins}–${t.losses}${t.ties ? '–'+t.ties : ''}</td><td class="n" style="${tint(C.team[t.rid].pfRank)}">${f1(t.pf)}</td><td class="n">${f1(t.pa)}</td><td class="n">${esc(t.streak || '')}</td></tr>`).join('')}
      </tbody></table></div></section>
    <section class="panel"><div class="panel-head"><h3>Power Rankings</h3>${qm('<b>Power</b> = 0,4 × Ø Punkte + 0,4 × Ø letzte 3 Wochen + 0,2 × (Ø − Standardabweichung)<br><b>Plätze vs. Tabelle</b>: wie viele Plätze ein Team im Power Ranking besser (▲) oder schlechter (▼) steht als in der echten Tabelle.')}</div>
      <div class="tbl-wrap"><table><thead><tr><th></th><th>Team</th><th class="n">Ø</th><th class="n">Ø 3 W.</th><th class="n">σ</th><th class="n">Power</th><th class="n">Plätze vs. Tabelle</th></tr></thead><tbody>
      ${pr.map(t => { const T = C.team[t.rid]; const d = T.place - T.prRank; return `<tr class="${mineCls(t.rid)}"><td class="rank">${T.prRank}</td><td>${teamCell(t.rid, false)}</td><td class="n" style="${tint(T.avgRank)}">${f1(T.avg)}</td><td class="n" style="${tint(T.l3Rank)}">${f1(T.l3)}</td><td class="n" style="${tint(T.sdRank)}">${f1(T.sd)}</td><td class="n" style="font-weight:700;${tint(T.prRank)}">${f1(T.pr)}</td><td class="n">${d > 0 ? `<span class="chip good">${d}</span>` : d < 0 ? `<span class="chip bad">${-d}</span>` : '<span class="chip plain">=</span>'}</td></tr>`; }).join('')}

  <section class="panel"><div class="panel-head"><h3>Wochenverlauf</h3>${qm(`Deine Punkte pro Woche gegen den Ligadurchschnitt. Klicke unten auf Teams, um ihre Linie einzublenden (bis zu 5). Fahre über das Diagramm für die Wochenwerte.`)}</div>
    ${C.weeks.length ? `<div class="chart" id="ch-league"></div>${chartLegend()}` : noWeeks()}</section>`;
