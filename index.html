      ${starters.map((p,i) => `<tr><td><span class="slot">${esc(slotLabel(S.slots[i]))}</span></td><td>${p && p !== '0' ? playerCell(p, nflHints(p, S.currentWeek)) : '<span class="muted">leer</span>'}</td><td class="n" style="font-weight:700">${p && p !== '0' ? f1(val(p)) : '–'}</td>${S.projOK ? `<td class="n">${p && S.proj[p] != null ? f1(S.proj[p]) : '–'}</td>` : ''}<td class="n">${f1(lastN(p))}</td>${anyLive ? `<td class="n">${f1(livePts[p])}</td>` : ''}<td>${p && p !== '0' && !opt.set.has(p) ? '<span class="chip bad">raus</span>' : p && p !== '0' ? '<span class="chip good">passt</span>' : ''}</td></tr>`).join('')}
      </tbody></table></div>
      <h3 style="margin-top:6px">Bank</h3>
      <div class="tbl-wrap"><table><thead><tr><th>Spieler</th><th class="n">Erwartung</th>${S.projOK ? '<th class="n">Proj.</th>' : ''}<th class="n">Ø 3 W.</th>${anyLive ? '<th class="n">Live</th>' : ''}<th></th></tr></thead><tbody>
      ${bench.sort((a,b) => val(b) - val(a)).map(p => `<tr><td>${playerCell(p, nflHints(p, S.currentWeek))}</td><td class="n" style="font-weight:700">${f1(val(p))}</td>${S.projOK ? `<td class="n">${S.proj[p] != null ? f1(S.proj[p]) : '–'}</td>` : ''}<td class="n">${f1(lastN(p))}</td>${anyLive ? `<td class="n">${f1(livePts[p])}</td>` : ''}<td>${opt.set.has(p) ? '<span class="chip good">rein</span>' : ''}</td></tr>`).join('')}
      </tbody></table></div>
    </section>`;
  } else {
    out += `<div class="note">Der Live-Check ist nur während der laufenden Hauptrunde verfügbar. Unten siehst du den Saisonrückblick.</div>`;
  }
  // Rückblick
  const T = C.team[rid];
  const rows = C.weeks.map(w => ({w, ...(T.effW[w] || {})})).filter(r => r.optimal != null).reverse();
  out += `<section class="panel"><div class="panel-head"><h3>Rückblick: liegengelassene Punkte</h3><p>Effizienz ${pct(T.eff)} · insgesamt ${f1(T.left)} Punkte auf der Bank verschenkt.</p></div>
    ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Woche</th><th class="n">Ist</th><th class="n">Optimal</th><th class="n">Verschenkt</th><th>Größter Fehlgriff</th><th style="min-width:150px">Ergebnis</th></tr></thead><tbody>
    ${rows.map(r => { const o = C.opp[r.w][rid]; const me = C.scores[r.w][rid], op = o != null ? C.scores[r.w][o] : null;
      const res = op == null ? '' : me > op ? `<span class="chip good">Sieg</span>` : me < op ? (op < r.optimal ? `<span class="chip warn">Niederlage – optimal wäre Sieg</span>` : `<span class="chip bad">Niederlage</span>`) : '<span class="chip plain">Remis</span>';
      const bi = r.benchIn[0], so = r.startOut[0];
      return `<tr><td>W${r.w}</td><td class="n">${f1(r.actual)}</td><td class="n">${f1(r.optimal)}</td><td class="n" style="font-weight:700">${r.left > .05 ? f1(r.left) : '–'}</td>
      <td class="small" style="min-width:220px">${bi && r.left > .05 ? `${esc(pname(bi.pid))} (${f1(bi.pts)}) saß auf der Bank${so ? `, ${esc(pname(so.pid))} (${f1(so.pts)}) startete` : ''}` : '<span class="muted">optimal aufgestellt</span>'}</td><td>${res}</td></tr>`; }).join('')}
    </tbody></table></div>` : noWeeks()}</section>`;
  return out;
};

/* ---------- Players to Add ---------- */
VIEWS.adds = () => {
  const C = S.C, rid = S.myRid, r = S.teamByRid[rid].roster;
  if (!S.isLive) return head('Players to Add') + `<div class="note">Waiver-Empfehlungen gibt es nur für die laufende Saison.</div>`;
  if (!S.players) return head('Players to Add') + `<div class="err">Spielerdatenbank nicht geladen.</div>`;
  const rostered = new Set(S.rosters.flatMap(x => [...(x.players||[]), ...(x.reserve||[]), ...(x.taxi||[])]));
  const tr = Object.fromEntries((S.trending || []).map(t => [t.player_id, t.count]));
  const maxTr = Math.max(0, ...Object.values(tr));
  const useProj = S.projOK;
  const list = [];
  for (const [pid, p] of Object.entries(S.players)){
    if (rostered.has(pid)) continue;
    const pl = posList(pid).map(x => x === 'DE' || x === 'DT' ? 'DL' : x === 'CB' || x === 'S' ? 'DB' : x);
    const pp = pl.find(x => S.leaguePos.includes(x)); if (!pp) continue;
    if (!p.t && pp !== 'DEF') continue;
    if (p.act === false) continue;
    const hs = helperScore(pid), recent = hs.recent, proj = hs.proj, tc = hs.tc;
    if ((recent == null || recent <= 0) && !proj && !tc) continue;
    const injF = hs.injF, base = hs.base, trendB = hs.trendB;
    list.push({pid, pos:pp, recent, n: hs.n, proj, tc, injF, base, trendB, score: hs.score, val: (useProj ? (proj || 0) : (recent || 0)) * availF(pid)});
  }
  list.sort((a,b) => b.score - a.score);
  // Vergleich mit eigenem Kader
  const starters = (r.starters || []).slice(0, S.slots.length);
  const hidden = new Set([...(r.reserve||[]), ...(r.taxi||[])]);
  const bench = (r.players || []).filter(p => !starters.includes(p) && !hidden.has(p));
  const myVal = pid => (useProj ? (S.proj[pid] ?? 0) : (lastN(pid) ?? 0)) * availF(pid);
  const hint = a => {
    let worst = null;
    starters.forEach((p,i) => { if (!canPlayPos(a.pos, S.slots[i])) return; const v = (p && p !== '0') ? helperScore(p).score : -1; if (!worst || v < worst.v) worst = {p, v, slot:S.slots[i]}; });
    if (worst && a.score > worst.v + .5) return `<b>Stärker als dein ${esc(slotLabel(worst.slot))}</b>: ${worst.p && worst.p !== '0' ? `${esc(pname(worst.p))} (Score ${f1(worst.v)})` : 'leerer Slot'}`;
    const bp = bench.filter(p => posList(p).includes(a.pos)).sort((x,y) => helperScore(x).score - helperScore(y).score)[0];
    if (bp && a.score > helperScore(bp).score + .5) return `Upgrade für die Bank: besser als ${esc(pname(bp))} (Score ${f1(helperScore(bp).score)})`;
    if (!bench.some(p => posList(p).includes(a.pos)) && !starters.some(p => posList(p).includes(a.pos))) return `Du hast keinen ${esc(a.pos)} im Kader`;
    return '';
  };
  const f = S.addsPos || 'ALL';
  const nm = rosterNorm(), mc = posCount(rid, rosterIds(rid).filter(p => !hidden.has(p)));
  const sensible = a => { const p = normPos(a.pos); if ((mc[p] || 0) < nm.max[p]) return true;
    const same = rosterIds(rid).filter(x => !hidden.has(x) && normPos(pos1(x)) === p); return !same.length || a.score > Math.min(...same.map(x => helperScore(x).score)) + .5; };
  /* Echte Verbesserungen: der Zugang erhöht die erwarteten Punkte pro Woche der Aufstellung (Startelf + Bankwert), gemessen mit dem sinnvollsten Drop */
  const better = [];
  for (const a of list.filter(sensible).slice(0, 60)){
    const adv = dropAdvice(a.pid); if (adv && adv.gain > .15) better.push({a, adv});
  }
  better.sort((x,y) => y.adv.gain - x.adv.gain);
  const topBetter = better.slice(0, 8);
  const shown = list.filter(a => (f === 'ALL' || a.pos === f) && sensible(a)).slice(0, 25);
  S.after.push(() => document.querySelectorAll('[data-apos]').forEach(b => b.addEventListener('click', () => { S.addsPos = b.dataset.apos; renderView(); })));
  const weakPos = S.leaguePos.filter(p => C.depth.team[rid].per[p].valRank > S.teams.length - Math.ceil(S.teams.length/3));
  const scoreHelp = `<b>So entsteht der Score</b> (in Punkten deines Liga-Scorings)<code>${useProj ? 'Score = (0,55 × Projektion W' + S.projWeek + ' + 0,45 × Ø letzte 3 Wochen) × Verletzungsfaktor + Trend-Bonus (0–3)' : 'Score = Ø letzte 3 Wochen × Verletzungsfaktor + Trend-Bonus (0–3)'}</code>Verletzungsfaktor: Questionable 0,85 · Doubtful 0,55 · Out 0,25 · IR 0,1. Trend-Bonus: Adds auf Sleeper in den letzten 48 h, logarithmisch. <b>Drop-Vorschlag</b>: der Kaderspieler, dessen Abgang deine Aufstellung inklusive Bank am wenigsten kostet.${weakPos.length ? ` Deine schwächsten Positionen: <b>${weakPos.join(', ')}</b>.` : ''}`;
  return `
  ${head('Players to Add', `Free Agents deiner Liga · Woche ${S.projWeek}`, undefined, scoreHelp)}
  <p class="small muted"><b>Helper-Score</b> = von Sleeper Helper berechneter Wert, keine Sleeper-Zahl. Er wird für Free Agents und für deine eigenen Spieler gleich berechnet (Details beim „?“).</p>
  ${useProj ? '' : `<div class="note">Die Sleeper-Projektionen sind gerade nicht erreichbar. Die Empfehlung basiert nur auf den Ist-Punkten der letzten Wochen${S.trending.length ? ' und den Trending Adds' : ''}.</div>`}
  <section class="panel"><div class="panel-head"><h3>Verbesserungen für dein Team</h3>${qm(`Nur Free Agents, die deine erwarteten Punkte pro Woche spürbar erhöhen (mindestens +0,15 Pkt.): Berechnet wird die beste Aufstellung inklusive FLEX und Superflex plus Bankwert, jeweils mit dem sinnvollsten Drop. Der übliche Kader (z. B. ein Ersatz-QB) bleibt dabei erhalten.`)}</div>
    ${topBetter.length ? topBetter.map(({a, adv}, i) => `<div class="add-card">
      <div style="display:flex;gap:10px;align-items:flex-start;min-width:0"><span class="rank">${i+1}</span>${playerCell(a.pid, nflHints(a.pid, S.projWeek))}</div>
      <div class="score" style="${tintF(Math.min(1, .5 + adv.gain / 8))}" title="Gewinn für dein Team in erwarteten Punkten pro Woche">+${f1(adv.gain)}<small>Pkt./Woche</small></div>
      <div class="parts"><span>Erwartung <b>${f1(expVal(a.pid))}</b> Pkt./Woche</span>${isBye(a.pid) ? '<span>diese Woche Bye</span>' : useProj ? `<span>Proj. W${S.projWeek}: <b>${f1(a.proj)}</b></span>` : ''}<span>Ø 3 Wochen: <b>${f1(a.recent)}</b>${a.n < 3 ? ` <span class="muted">(nur ${a.n} Einsatz${a.n === 1 ? '' : 'e'}, wird vorsichtiger bewertet)</span>` : ''}</span></div>
      ${(() => { const r = addRole(a.pid, adv.pid); const b = byeNote(a.pid, adv.pid); return `<div class="hintline">${roleChip(r)} ${esc(r.text)}</div>${b ? `<div class="hintline ${b.warn ? 'byewarn' : ''}"><span class="chip ${b.warn ? 'warn' : 'plain'}">Bye</span> ${esc(b.text)}</div>` : ''}`; })()}
      ${adv.free ? `<div class="hintline drop">Kaderplatz frei: <b class="ok">kein Drop nötig</b></div>` : `<div class="hintline drop"><b>Drop-Vorschlag:</b> ${esc(pname(adv.pid))} ${posChip(pos1(adv.pid))} <span class="muted">(${adv.starter ? 'Starter' : 'Bank'}, Erwartung ${f1(expVal(adv.pid))})</span></div>`}
    </div>`).join('') : `<div class="empty">Aktuell gibt es keinen Free Agent, der dein Team spürbar verbessert.</div>`}
  </section>
  <section class="panel"><div class="panel-head"><h3>Alle Free Agents nach Score</h3></div>
    <div class="filters">${['ALL', ...S.leaguePos].map(p => `<button class="seg" data-apos="${p}" aria-pressed="${f === p}">${p === 'ALL' ? 'Alle' : p}${weakPos.includes(p) ? ' <span class="need-dot" title="Bedarf: Diese Position ist bei dir im schwächsten Drittel der Liga"></span>' : ''}</button>`).join('')}</div>${weakPos.length ? `<p class="small muted" style="margin:8px 0 0"><span class="need-dot"></span> Bedarf: Position im schwächsten Drittel der Liga (Aufstellung und Kadertiefe zusammen)</p>` : ''}
    ${shown.length ? `<div>${shown.map((a,i) => `
      <div class="add-card">
        <div style="display:flex;gap:10px;align-items:flex-start;min-width:0"><span class="rank">${i+1}</span>${playerCell(a.pid, nflHints(a.pid, S.projWeek))}</div>
        <div class="score" title="Helper-Score: von Sleeper Helper berechnet">${f1(a.score)}<small>Helper-Score</small></div>
        <div class="parts">${useProj ? `<span>Proj. W${S.projWeek}: <b>${f1(a.proj)}</b></span>` : ''}<span>Ø 3 Wochen: <b>${f1(a.recent)}</b>${a.n < 3 ? ` <span class="muted">(nur ${a.n} Einsatz${a.n === 1 ? '' : 'e'}, wird vorsichtiger bewertet)</span>` : ''}</span><span>Trending: <b>${a.tc ? f0(a.tc) + ' Adds' : '–'}</b></span>${a.injF < 1 ? `<span>Verletzungsfaktor ×${String(a.injF).replace('.',',')}</span>` : ''}</div>
        ${(() => { const r = addRole(a.pid, null); const b = byeNote(a.pid, null); return `<div class="hintline">${roleChip(r)} ${esc(r.text)}</div>${b ? `<div class="hintline ${b.warn ? 'byewarn' : ''}"><span class="chip ${b.warn ? 'warn' : 'plain'}">Bye</span> ${esc(b.text)}</div>` : ''}`; })()}
        ${(() => { const h = hint(a); return h ? `<div class="hintline">${h}</div>` : ''; })()}
        ${dropLine(a)}
      </div>`).join('')}</div>` : `<div class="empty">Keine passenden Free Agents gefunden.</div>`}
  </section>`;
};
function canPlayPos(pos, slot){ const e = elig(slot); return e.includes(pos) || (pos === 'DL' && (e.includes('DE') || e.includes('DT'))) || (pos === 'DB' && (e.includes('CB') || e.includes('S'))); }

/* ---------- Meine Draft-Bilanz ---------- */
VIEWS.mydraft = () => {
  const D = S.C.draft, rid = S.myRid;
  if (!D) return head('Meine Draft-Bilanz') + `<div class="empty">Für diese Saison gibt es keinen Draft mit Picks.</div>`;
  const g = D.grades[rid];
  if (!g) return head('Meine Draft-Bilanz') + `<div class="empty">Dein Team hat in diesem Draft keine Picks.</div>`;
  const T = S.C.team[rid];
  const rows = [...g.picks].sort((a,b) => a.no - b.no);
  const best = [...g.picks].sort((a,b) => b.delta - a.delta)[0], worst = [...g.picks].sort((a,b) => a.delta - b.delta)[0];
  return `
  ${head('Meine Draft-Bilanz', `${g.picks.length} Picks · Bewertung gegen ligainterne Vergleichspicks`)}
  <div class="kpis">
    ${kpi(g.grade, 'Draft-Note', `Rang ${g.rank} von ${Object.keys(D.grades).length}`, gradeTone(g.grade), g.rank)}
    ${kpi(sgn(g.score), 'Value pro Pick', 'Punkte über Erwartung, frühe Runden zählen mehr', numTone(g.score), g.rank)}
    <div class="kpi"><span class="l">Steals / Busts</span><span class="v"><span class="t-good">${g.steals}</span> / <span class="t-bad">${g.busts}</span></span><span class="s">Treffer / Fehlgriffe</span></div>
    ${kpi(f0(g.total), 'Punkte deiner Picks', `Tabelle: Platz ${T.place}`, '', 1 + Object.values(D.grades).filter(x => x.total > g.total).length)}
  </div>
  ${scaleKey()}
  ${D.hasData && best ? `<div class="grid2">
    <div class="panel pick-card"><span class="chip good" style="justify-self:start">Bester Pick</span><div><div class="pn">${esc(pname(best.pid))}</div><div class="pmeta">${posChip(pos1(best.pid))} ${esc(nflTeam(best.pid))} · Runde ${best.round}</div></div><div class="big"><b>${f1(best.pts)}</b> Punkte <span class="delta good">${sgn(best.delta)}</span> gegenüber vergleichbaren Picks</div><div class="pmeta">${ppg(best)}</div></div>
    <div class="panel pick-card"><span class="chip bad" style="justify-self:start">Schwächster Pick</span><div><div class="pn">${esc(pname(worst.pid))}</div><div class="pmeta">${posChip(pos1(worst.pid))} ${esc(nflTeam(worst.pid))} · Runde ${worst.round}</div></div><div class="big"><b>${f1(worst.pts)}</b> Punkte <span class="delta bad">${sgn(worst.delta)}</span> gegenüber vergleichbaren Picks</div><div class="pmeta">${ppg(worst)}</div></div>
  </div>` : ''}
  ${D.hasData && best ? (() => {
    const pg = g.picks.filter(x => x.dPpg != null && x.g >= 2), bA = [...pg].sort((a,b) => b.dPpg - a.dPpg)[0], wA = [...pg].sort((a,b) => a.dPpg - b.dPpg)[0];
    const card = (r, good) => `<div class="panel pick-card"><span class="chip ${good ? 'good' : 'bad'}" style="justify-self:start">${good ? 'Bester Schnitt' : 'Schwächster Schnitt'}</span><div><div class="pn">${esc(pname(r.pid))}</div><div class="pmeta">${posChip(pos1(r.pid))} ${esc(nflTeam(r.pid))} · Runde ${r.round}</div></div><div class="big"><b>${f1(r.ppg)}</b> Punkte pro Spiel <span class="delta ${good ? 'good' : 'bad'}">${sgn(r.dPpg)}</span> gegenüber vergleichbaren Picks</div><div class="pmeta">${r.g} gespielte Wochen · Gesamt ${f1(r.pts)} Punkte</div></div>`;
    return bA && wA ? `<div class="grid2">${card(bA, true)}${card(wA, false)}</div>` : '';
  })() : ''}
  <section class="panel"><div class="panel-head"><h3>Alle Picks</h3>${qm(`Erwartung = Ø-Punkte der Spieler gleicher Position, die ligaintern in ähnlicher Runde (±2) gezogen wurden. <b>Ø pro Spiel</b> = Punkte geteilt durch gespielte Wochen (Bye und Verletzung zählen nicht) und <b>Steal/Bust</b>: Innerhalb seiner Position wird jeder Spieler nach Leistung eingeordnet, nach Gesamtpunkten <b>und</b> nach Ø pro Spiel. Ein Steal ist, wer in beiden Rangfolgen deutlich früher hätte fallen müssen (mindestens eine dreiviertel Runde und 35 % des Pick-Werts), ein Bust das Gegenteil (mindestens 45 % später). Angezeigt werden höchstens die 20 deutlichsten Steals und die 20 deutlichsten Busts. Pick 1.01 kann nie ein Steal sein, Verletzte mit wenigen Einsätzen sind kein Bust. K und DEF zählen nicht. Beim Hover steht, ab wann der Spieler hätte gewählt werden können (Steal) bzw. bis wann man hätte warten können (Bust): Er wird innerhalb seiner Position nach Leistung eingeordnet und bekommt den Pick, den die Liga für diesen Rang auf der Position tatsächlich vergeben hat. Die Note beruht auf den Gesamtpunkten.`)}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Pick</th><th style="min-width:170px">Spieler</th><th class="n">Punkte</th><th class="n">Ø pro Spiel</th><th class="n">Erwartung</th><th class="n">Differenz</th><th class="n">Ø erwartet</th><th class="n">Ø Diff.</th><th>Urteil</th><th>Noch im Kader</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td>${r.round}.${String(r.no - (r.round-1)*S.teams.length).padStart(2,'0')}<div class="pmeta">#${r.no}</div></td><td>${playerCell(r.pid)}</td><td class="n">${f1(r.pts)}</td><td class="n">${r.g ? f1(r.ppg) : '–'}<div class="pmeta">${r.g} Sp.</div></td><td class="n">${f1(r.exp)}</td><td class="n">${sgn(r.delta)}</td><td class="n">${r.expPpg != null ? f1(r.expPpg) : '–'}</td><td class="n">${r.dPpg != null ? sgn(r.dPpg) : '–'}</td><td>${r.verdict === 'steal' ? '<span class="chip good">Steal</span>' : r.verdict === 'bust' ? '<span class="chip bad">Bust</span>' : ''}${r.fairTxt ? `<div class="pmeta" title="${esc(r.fairTxt)}">${r.verdict === 'steal' ? 'ab ' : 'bis ca. '}${r.fairLbl}</div>` : ''}</td><td>${(S.teamByRid[rid].roster.players||[]).includes(r.pid) ? 'ja' : '<span class="muted">nein</span>'}</td></tr>`).join('')}
    </tbody></table></div></section>`;
};

/* ============================================================
   Ansichten: Liga
   ============================================================ */
VIEWS.league = () => {
  const C = S.C, L = S.league, st = L.settings || {}, sc = L.scoring_settings || {};
  const rec = sc.rec ?? 0;
  const scoring = rec >= 1 ? 'PPR' : rec >= .5 ? 'Half-PPR' : rec > 0 ? `${String(rec).replace('.',',')} PPR` : 'Standard';
  const pr = [...S.teams].sort((a,b) => C.team[a.rid].prRank - C.team[b.rid].prRank);
  if (C.weeks.length){
    lineChart('ch-league', {labels: C.weeks.map(w => 'W' + w), series: weeklySeries(), avgLine: C.weeks.map(w => avg(Object.values(C.scores[w])))});
    bindLegend();
  }
  return `
  ${head('Liga-Übersicht', `${L.name} · ${L.season} · ${S.cfg.type} · ${S.cfg.teams} Teams · ${scoring}`)}
  <section class="panel">
    <div class="panel-head"><h3>Liga-Profil</h3>${qm(`Automatisch aus den Liga-Einstellungen erkannt. Alle Berechnungen nutzen genau dieses Scoring und diese Slots.`)}</div>
    <div class="profile">
      <span>Typ <b>${esc(S.cfg.type)}</b></span>
      <span>Scoring <b>${esc(scoring)}</b></span>
      <span>Pass-TD <b>${f0(sc.pass_td ?? 4)} Pkt.</b></span>
      ${sc.bonus_rec_te ? `<span>TE-Premium <b>+${String(sc.bonus_rec_te).replace('.',',')}</b></span>` : ''}
      <span>Playoffs <b>${S.cfg.playoffTeams || '–'} Teams ab Woche ${S.cfg.playoffStart || '–'}</b></span>
      ${S.cfg.faab != null ? `<span>FAAB <b>${S.cfg.faab} $</b></span>` : '<span>Waiver <b>Rolling</b></span>'}
      ${S.cfg.tradeDeadline ? `<span>Trade-Deadline <b>Woche ${S.cfg.tradeDeadline}</b></span>` : ''}
    </div>
    <div class="slots">${(L.roster_positions || []).filter(s => s !== 'BN').map(s => `<span class="slot">${esc(slotLabel(s))}</span>`).join('')}<span class="slot">${(L.roster_positions||[]).filter(s => s === 'BN').length}× Bank</span></div>
  </section>
  <div class="grid2 wide">
    <section class="panel"><div class="panel-head"><h3>Tabelle</h3></div>
      ${scaleKey()}
      <div class="tbl-wrap"><table><thead><tr><th></th><th>Team</th><th class="n">S–N</th><th class="n">Pkt. für</th><th class="n">Pkt. gegen</th><th class="n">Serie</th></tr></thead><tbody>
      ${C.standings.map((t,i) => `<tr class="${mineCls(t.rid)}"><td class="rank" style="${tint(i+1)}">${i+1}</td><td>${teamCell(t.rid)}</td><td class="n">${t.wins}–${t.losses}${t.ties ? '–'+t.ties : ''}</td><td class="n" style="${tint(C.team[t.rid].pfRank)}">${f1(t.pf)}</td><td class="n">${f1(t.pa)}</td><td class="n">${esc(t.streak || '')}</td></tr>`).join('')}
      </tbody></table></div></section>
    <section class="panel"><div class="panel-head"><h3>Power Rankings</h3>${qm('<b>Power</b> = 0,4 × Ø Punkte + 0,4 × Ø letzte 3 Wochen + 0,2 × (Ø − Standardabweichung)<br><b>Plätze vs. Tabelle</b>: wie viele Plätze ein Team im Power Ranking besser (▲) oder schlechter (▼) steht als in der echten Tabelle.')}</div>
      <div class="tbl-wrap"><table><thead><tr><th></th><th>Team</th><th class="n">Ø</th><th class="n">Ø 3 W.</th><th class="n">σ</th><th class="n">Power</th><th class="n">Plätze vs. Tabelle</th></tr></thead><tbody>
      ${pr.map(t => { const T = C.team[t.rid]; const d = T.place - T.prRank; return `<tr class="${mineCls(t.rid)}"><td class="rank">${T.prRank}</td><td>${teamCell(t.rid, false)}</td><td class="n" style="${tint(T.avgRank)}">${f1(T.avg)}</td><td class="n" style="${tint(T.l3Rank)}">${f1(T.l3)}</td><td class="n" style="${tint(T.sdRank)}">${f1(T.sd)}</td><td class="n" style="font-weight:700;${tint(T.prRank)}">${f1(T.pr)}</td><td class="n">${d > 0 ? `<span class="chip good">${d}</span>` : d < 0 ? `<span class="chip bad">${-d}</span>` : '<span class="chip plain">=</span>'}</td></tr>`; }).join('')}
      </tbody></table></div></section>
  </div>
  <section class="panel"><div class="panel-head"><h3>Wochenverlauf</h3>${qm(`Deine Punkte pro Woche gegen den Ligadurchschnitt. Klicke unten auf Teams, um ihre Linie einzublenden (bis zu 5). Fahre über das Diagramm für die Wochenwerte.`)}</div>
    ${C.weeks.length ? `<div class="chart" id="ch-league"></div>${chartLegend()}` : noWeeks()}</section>`;
};

VIEWS.coaching = () => {
  const C = S.C; if (!C.weeks.length) return head('Coaching') + noWeeks();
  const me = S.myRid;
  const rows = [...S.teams].sort((a,b) => C.team[a.rid].effRank - C.team[b.rid].effRank);
  /* Erzielte gegen optimale Punkte: Diagramm für einen Manager, Tabelle für alle */
  const cRid = S.courseTeam != null && S.teamByRid[S.courseTeam] ? S.courseTeam : me, cr = ptsCourse(cRid);
  S.after.push(() => {
    const el = document.getElementById('crsTeam'); if (el) el.addEventListener('change', e => { S.courseTeam = +e.target.value; renderView(); });
    document.querySelectorAll('[data-crs]').forEach(tr => tr.addEventListener('click', () => { S.courseTeam = +tr.dataset.crs; renderView(); document.getElementById('crschart')?.scrollIntoView({block:'center', behavior:'smooth'}); }));
  });
  const cnt = (arr, k, v) => arr.filter(r => r[k] === v).length;
  const flips = cr.filter(r => r.flip), leftSum = sum(cr.map(r => r.left)), actSum = sum(cr.map(r => r.actual)), optSum = sum(cr.map(r => r.optimal));
  const closest = cr.filter(r => r.need != null).sort((a,b) => a.need - b.need)[0];
  const resChip = r => r.res == null ? '<span class="muted">–</span>' : `<span class="chip ${r.res === 'W' ? 'good' : r.res === 'T' ? 'plain' : 'bad'}">${r.res === 'W' ? 'Sieg' : r.res === 'T' ? 'Remis' : 'Niederlage'}</span>`;
  /* Tabelle, in der jeder Manager optimal gecoacht hätte: der Gegner bleibt bei seinen echten Punkten */
  const wif = S.teams.map(t => {
    const q = ptsCourse(t.rid), T = C.team[t.rid];
    return {t, q, w:q.filter(r => r.res === 'W').length, l:q.filter(r => r.res === 'L').length, ti:q.filter(r => r.res === 'T').length,
      ow:q.filter(r => r.optRes === 'W').length, ol:q.filter(r => r.optRes === 'L').length, oti:q.filter(r => r.optRes === 'T').length,
      flips:q.filter(r => r.flip).length, left:sum(q.map(r => r.left)), pts:sum(T.pts || []), optPts:sum(q.map(r => r.optimal))};
  });
  const place = (arr, kw, kt, kp) => { const o = [...arr].sort((a,b) => (b[kw] + b[kt]/2) - (a[kw] + a[kt]/2) || b[kp] - a[kp]); const m = {}; o.forEach((x,i) => m[x.t.rid] = i + 1); return m; };
  const pReal = place(wif, 'w', 'ti', 'pts'), pOpt = place(wif, 'ow', 'oti', 'optPts');
  wif.forEach(x => { x.pr = pReal[x.t.rid]; x.po = pOpt[x.t.rid]; x.dp = x.pr - x.po; });
  wif.sort((a,b) => a.po - b.po);

  const lr = [...S.teams].sort((a,b) => C.team[b.rid].luck - C.team[a.rid].luck);
  const maxL = Math.max(.5, ...lr.map(t => Math.abs(C.team[t.rid].luck)));
  return `
  ${head('Coaching-Analyse', `${C.weeks.length} Wochen Hauptrunde`)}
  ${scaleKey()}
  <section class="panel half"><div class="panel-head"><h3>Coaching-Effizienz</h3>${qm(`Jede Woche wird aus dem vollen Kader die bestmögliche Aufstellung berechnet, mit FLEX und Superflex nach euren Slots. Effizienz = echte Punkte ÷ optimale Punkte.`)}</div>
    ${barRows(rows.map(t => ({label:t.name, v:C.team[t.rid].eff, mine:t.rid === S.myRid})), {fmt:pct})}
    <div class="tbl-wrap"><table><thead><tr><th></th><th>Team</th><th class="n">Effizienz</th><th class="n">Verschenkt gesamt</th><th class="n">Ø pro Woche</th><th class="n">Perfekte Wochen</th></tr></thead><tbody>
    ${rows.map(t => { const T = C.team[t.rid]; const ws = Object.values(T.effW); return `<tr class="${mineCls(t.rid)}"><td class="rank">${T.effRank}</td><td>${teamCell(t.rid)}</td><td class="n" style="${tint(T.effRank)}">${pct(T.eff)}</td><td class="n" style="${tint(T.leftRank)}">${f1(T.left)}</td><td class="n">${f1(ws.length ? T.left / ws.length : null)}</td><td class="n">${ws.filter(x => x.left < .05).length}</td></tr>`; }).join('')}
    </tbody></table></div></section>
  <section class="panel half"><div class="panel-head"><h3>All-Play &amp; Glücks-Index</h3>${qm(`<b>All-Play</b>: jede Woche gegen alle anderen Teams gewertet. <b>Glück</b> = echte Siege minus erwartete Siege aus der All-Play-Quote. Grün: mehr Siege, als die Punkte hergeben. Rot: weniger Siege als verdient.`)}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Team</th><th class="n">Echte Bilanz</th><th class="n">All-Play</th><th class="n">All-Play %</th><th class="n">Erwartete Siege</th><th style="min-width:180px">Glück</th></tr></thead><tbody>
    ${lr.map(t => { const T = C.team[t.rid]; const w = 50 * Math.abs(T.luck) / maxL; return `<tr class="${mineCls(t.rid)}"><td>${teamCell(t.rid)}</td><td class="n">${T.w}–${T.l}${T.t ? '–'+T.t : ''}</td><td class="n">${T.apW}–${T.apL}${T.apT ? '–'+T.apT : ''}</td><td class="n" style="${tint(T.apRank)}">${pct(T.apPct)}</td><td class="n">${f1(T.expW)}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><div style="position:relative;flex:1;height:10px;background:var(--sunken);border-radius:2px"><span style="position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)"></span><span style="position:absolute;top:0;bottom:0;${T.luck >= 0 ? `left:50%;width:${w}%;background:var(--good);border-radius:0 4px 4px 0` : `right:50%;width:${w}%;background:var(--bad);border-radius:4px 0 0 4px`}"></span></div><b style="width:44px;text-align:right">${sgn(T.luck)}</b></div></td></tr>`; }).join('')}
    </tbody></table></div></section>
  <section class="panel"><div class="panel-head"><h3>Erzielte gegen optimale Punkte</h3>
    <div class="filters"><span class="muted small">Manager</span><select class="sel" id="crsTeam" aria-label="Manager">${S.teams.map(x => `<option value="${x.rid}" ${x.rid === cRid ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
    ${qm(`Durchgezogen die Punkte, die wirklich auf dem Feld standen, gestrichelt die bestmögliche Aufstellung aus demselben Kader. Der Strich in jeder Woche ist die Punktzahl des Gegners, also die Marke, die zum Sieg nötig war. Die Feldfarbe zeigt den Ausgang: grün gewonnen, rot verloren, gelb verloren, obwohl die optimale Aufstellung gereicht hätte. Gerechnet wird nur die eigene Aufstellung, der Gegner bleibt bei seinen tatsächlichen Punkten.`)}</div>
    ${cr.length ? `<div class="kpis">
      ${kpi(`${cnt(cr,'res','W')}–${cnt(cr,'res','L')}${cnt(cr,'res','T') ? '–' + cnt(cr,'res','T') : ''}`, 'Bilanz', 'mit den Punkten, die aufgestellt waren')}
      ${kpi(`${cnt(cr,'optRes','W')}–${cnt(cr,'optRes','L')}${cnt(cr,'optRes','T') ? '–' + cnt(cr,'optRes','T') : ''}`, 'Mit optimaler Aufstellung', flips.length ? `${flips.length} ${flips.length === 1 ? 'Sieg' : 'Siege'} mehr: ${flips.map(r => 'W' + r.w).join(', ')}` : 'kein Spiel wäre anders ausgegangen', flips.length ? 'good' : '')}
      ${kpi(f1(leftSum), 'Verschenkte Punkte', `Ø ${f1(leftSum / cr.length)} pro Woche · Effizienz ${f0(optSum ? actSum / optSum * 100 : 100)} %`, leftSum > 0 ? 'bad' : '')}
      ${kpi(closest ? '+' + f1(closest.need) : '–', 'Knappste Niederlage', closest ? `Woche ${closest.w} gegen ${esc((S.teamByRid[closest.oppRid] || {}).name || 'unbekannt')}` : 'keine Niederlage')}
    </div>
    <div class="chart" id="crschart"></div>
    <p class="clegend small muted"><span><i class="ln"></i>Erzielt</span><span><i class="ln dash"></i>Optimal</span><span><i class="ln opp"></i>Gegner</span><span><i class="bx"></i>Sieg</span><span><i class="bx warn"></i>Sieg verschenkt</span><span><i class="bx bad"></i>Niederlage</span></p>
    <div class="tbl-wrap"><table><thead><tr><th>Woche</th><th>Gegner</th><th class="n">Erzielt</th><th class="n">Optimal</th><th class="n">Verschenkt</th><th class="n">Punkte Gegner</th><th class="n">Zum Sieg fehlten</th><th>Ergebnis</th></tr></thead><tbody>
      ${cr.map(r => `<tr><td>W${r.w}</td><td>${r.oppRid != null ? esc((S.teamByRid[r.oppRid] || {}).name || 'unbekannt') : '<span class="muted">spielfrei</span>'}</td>
        <td class="n">${f1(r.actual)}</td><td class="n">${f1(r.optimal)}</td><td class="n">${r.left > .05 ? `<span class="bad">${f1(r.left)}</span>` : '<span class="muted">0,0</span>'}</td>
        <td class="n">${r.opp != null ? f1(r.opp) : '–'}</td><td class="n">${r.need != null ? `${f1(r.need)}<div class="pmeta">nötig: ${f1(r.opp)}</div>` : '<span class="muted">–</span>'}</td>
        <td>${resChip(r)}${r.flip ? `<div class="pmeta warnline">${isM() ? 'Sieg war drin' : 'optimal hätte gereicht'}</div>` : r.res === 'W' && r.left > .05 ? '<div class="pmeta">auch optimal ein Sieg</div>' : ''}</td></tr>`).join('')}
    </tbody></table></div>` : noWeeks()}</section>
  <section class="panel"><div class="panel-head"><h3>Was optimales Coaching gebracht hätte</h3>${qm(`Für jeden Manager wird jede Woche die bestmögliche Aufstellung aus seinem eigenen Kader gegen die Punkte gerechnet, die sein Gegner wirklich erzielt hat. So entsteht die Bilanz, die mit perfektem Coaching möglich gewesen wäre. Gerechnet ist das immer nur für einen Manager, die Gegner bleiben bei ihren echten Punkten, sonst würden sich die Ergebnisse gegenseitig aufheben. Ein Klick auf eine Zeile zeigt den Verlauf dieses Managers im Diagramm darüber.`)}</div>
    <div class="tbl-wrap"><table><thead><tr><th class="n">Platz optimal</th><th>Team</th><th class="n">Echte Bilanz</th><th class="n">Platz</th><th class="n">Optimale Bilanz</th><th class="n">Plätze</th><th class="n">Verschenkte Siege</th><th class="n">Verschenkte Punkte</th><th class="n">Effizienz</th></tr></thead><tbody>
    ${wif.map(x => `<tr class="${mineCls(x.t.rid)} ${x.t.rid === cRid ? 'is-sel' : ''}" data-crs="${x.t.rid}" style="cursor:pointer"><td class="rank">${x.po}</td><td>${teamCell(x.t.rid)}</td>
      <td class="n">${x.w}–${x.l}${x.ti ? '–' + x.ti : ''}</td><td class="n">${x.pr}</td>
      <td class="n" style="font-weight:700">${x.ow}–${x.ol}${x.oti ? '–' + x.oti : ''}</td>
      <td class="n">${x.dp > 0 ? `<span class="good">▲ ${x.dp}</span>` : x.dp < 0 ? `<span class="bad">▼ ${-x.dp}</span>` : '<span class="muted">–</span>'}</td>
      <td class="n">${x.flips ? `<span class="warnline">${x.flips}</span>` : '<span class="muted">0</span>'}</td>
      <td class="n">${f1(x.left)}</td><td class="n" style="${tint(C.team[x.t.rid].effRank)}">${pct(C.team[x.t.rid].eff)}</td></tr>`).join('')}
    </tbody></table></div></section>
  
  ${(() => { if (cr.length) courseChart('crschart', cr); return ''; })()}`;
};

VIEWS.draft = () => {
  const D = S.C.draft; if (!D) return head('Draft') + `<div class="empty">Für diese Saison gibt es keinen Draft mit Picks.</div>`;
  const nT = (S.draft && S.draft.settings && S.draft.settings.teams) || S.teams.length;
  const slotToRid = (S.draft && S.draft.slot_to_roster_id) || {};
  const ridOfSlot = s => slotToRid[s] ?? D.rows.find(r => r.slot === s)?.rid;
  const grades = Object.entries(D.grades).sort((a,b) => a[1].rank - b[1].rank);
  const totRk = {}; Object.entries(D.grades).sort((a,b) => b[1].total - a[1].total).forEach(([rid],i) => totRk[rid] = i + 1);
  const flt = S.draftFilter || 'all', bm = S.boardMode || 'tot';
  S.after.push(() => document.querySelectorAll('[data-bmode]').forEach(b => b.addEventListener('click', () => { S.boardMode = b.dataset.bmode; renderView(); })));
  S.after.push(() => document.querySelectorAll('[data-dflt]').forEach(b => b.addEventListener('click', () => { S.draftFilter = b.dataset.dflt; renderView(); })));
  const cells = [];
  for (let s = 1; s <= nT; s++){ const rid = ridOfSlot(s); cells.push(`<div class="cell hd ${rid === S.myRid ? 'is-mine' : ''}" style="grid-column:${s};grid-row:1" title="${esc(S.teamByRid[rid]?.name || '')}">${esc(S.teamByRid[rid]?.name || 'Slot ' + s)}</div>`); }
  for (const r of D.rows){
    const dim = flt !== 'all' && r.verdict !== flt;
    cells.push(`<div class="cell ${r.verdict} ${r.rid === S.myRid ? 'mine-col' : ''} ${dim ? 'dim' : ''}" style="grid-column:${r.slot};grid-row:${r.round + 1}" ${r.verdict ? `data-tip="${esc(r.verdict === 'steal' ? `Gewählt bei ${r.pickLbl}. Leistung wie ein Pick ab ${r.fairLbl}.` : `Gewählt bei ${r.pickLbl}. Leistung wie ein Pick um ${r.fairLbl}.`)}"` : ''}>
      <span class="no">${r.round}.${String(r.no - (r.round-1)*nT).padStart(2,'0')}</span>${r.verdict ? `<span class="vd">${r.verdict === 'steal' ? 'STEAL' : 'BUST'}</span>` : ''}
      <span class="pn">${esc(r.name)}</span><span>${posChip(r.pos)} <span class="pmeta">${esc(r.team || '')}</span></span>
      ${D.hasData ? (() => { const t = `<span class="pv">${f1(r.pts)} Pkt.</span>`, a = r.g ? `<span class="pv">Ø ${f1(r.ppg)} pro Spiel</span>` : `<span class="pmeta">kein Einsatz</span>`; return bm === 'avg' ? a : t; })() : ''}</div>`);
  }
  return `
  ${head('Draft-Analyse', `${S.draft && S.draft.type ? (S.draft.type === 'snake' ? 'Snake' : S.draft.type === 'auction' ? 'Auktion' : S.draft.type) : ''} · ${D.rows.length} Picks · ${D.rounds} Runden`)}
  ${!D.hasData ? `<div class="note">Noch keine gespielten Wochen: Bewertungen erscheinen nach dem ersten Spieltag.</div>` : ''}
  ${scaleKey()}
  <section class="panel"><div class="panel-head"><h3>Draft-Noten</h3>${qm(`Value pro Pick = Punkte über bzw. unter dem Schnitt vergleichbarer Picks (gleiche Position, ähnliche Runde), frühe Runden stärker gewichtet. Die Note ergibt sich aus dem Abstand zum Liga-Schnitt. <b>Steal/Bust</b>: Rangfolge innerhalb der Position nach Gesamtpunkten und nach Ø pro Spiel müssen beide deutlich früher (Steal) bzw. später (Bust) passen als der echte Pick, mindestens eine dreiviertel Runde.`)}</div>
    <div class="tbl-wrap"><table><thead><tr><th></th><th>Team</th><th class="n">Note</th><th class="n">Value / Pick</th><th class="n">Steals</th><th class="n">Busts</th><th class="n">Punkte gesamt</th></tr></thead><tbody>
    ${grades.map(([rid,g]) => `<tr class="${mineCls(+rid)}"><td class="rank">${g.rank}</td><td>${teamCell(+rid)}</td><td class="n grade ${gradeTone(g.grade)}" style="font-weight:700;font-size:1.25rem">${g.grade}</td><td class="n ${numTone(g.score) ? 't-' + numTone(g.score) : ''}" style="${tint(g.rank, grades.length)}">${sgn(g.score)}</td><td class="n">${g.steals}</td><td class="n">${g.busts}</td><td class="n" style="${tint(totRk[rid], grades.length)}">${f0(g.total)}</td></tr>`).join('')}
    </tbody></table></div></section>
  <section class="panel"><div class="panel-head"><h3>Draft-Board</h3>
    <div class="filters">${D.hasData ? `<span role="group" aria-label="Anzeige" style="display:contents">${[['tot','Gesamtpunkte'],['avg','Ø pro Spiel']].map(([k,l]) => `<button class="seg" data-bmode="${k}" aria-pressed="${bm === k}">${l}</button>`).join('')}</span><span class="vsep" aria-hidden="true"></span>` : ''}${[['all','Alle'],['steal','Steals'],['bust','Busts']].map(([k,l]) => `<button class="seg" data-dflt="${k}" aria-pressed="${flt === k}">${l}</button>`).join('')}</div></div>
    <div class="tbl-wrap"><div class="board" style="grid-template-columns:repeat(${nT},minmax(0,1fr))">${cells.join('')}</div></div>
  </section>`;
};

VIEWS.positions = () => {
  const C = S.C; if (!C.weeks.length) return head('Positionsstärke') + noWeeks();
  const P = S.leaguePos, sel = S.posSel && P.includes(S.posSel) ? S.posSel : P[0], n = S.teams.length;
  S.after.push(() => document.querySelectorAll('[data-psel]').forEach(b => b.addEventListener('click', () => { S.posSel = b.dataset.psel; renderView(); })));
  const shade = r => tint(r, n);
  const rows = [...S.teams].sort((a,b) => C.posStr[b.rid][sel] - C.posStr[a.rid][sel]);
  return `
  ${head('Positionsstärke', 'Ø Punkte der Starter pro Woche, aufgeteilt nach Position')}
  <section class="panel"><div class="panel-head"><h3>Übersicht</h3>${qm(`Zahl = Ø Starterpunkte pro Woche, darunter der Rang. Grün = vorne in der Liga, Rot = hinten.`)}</div>
    <div class="tbl-wrap"><table class="heat keep"><thead><tr><th>Team</th>${P.map(p => `<th class="n" style="text-align:center">${p}</th>`).join('')}<th class="n">Gesamt</th></tr></thead><tbody>
    ${[...S.teams].sort((a,b) => C.team[b.rid].avg - C.team[a.rid].avg).map(t => `<tr class="${mineCls(t.rid)}"><td>${teamCell(t.rid, false)}</td>${P.map(p => { const r = C.posRank[t.rid][p]; return `<td class="h" style="${shade(r)}">${f1(C.posStr[t.rid][p])}<small>#${r}</small></td>`; }).join('')}<td class="n tot" style="font-weight:700">${f1(C.team[t.rid].avg)}</td></tr>`).join('')}
    </tbody></table></div></section>
  <section class="panel"><div class="panel-head"><h3>Ranking pro Position</h3><div class="filters">${P.map(p => `<button class="seg" data-psel="${p}" aria-pressed="${p === sel}">${p}</button>`).join('')}</div>${qm('Der senkrechte Strich zeigt den Liga-Schnitt.')}</div>
    ${barRows(rows.map(t => ({label:t.name, v:C.posStr[t.rid][sel], mine:t.rid === S.myRid})), {mark: avg(rows.map(t => C.posStr[t.rid][sel]))})}</section>`;
};

VIEWS.compare = () => {
  const C = S.C;
  const a = S.cmpA ?? S.myRid;
  let b = S.cmpB;
  if (b == null || b === a){ const o = C.weeks.length ? C.opp[S.currentWeek]?.[a] ?? C.opp[C.weeks[C.weeks.length-1]]?.[a] : null; b = o ?? S.teams.find(t => t.rid !== a).rid; }
  S.after.push(() => {
    document.getElementById('cmpA').addEventListener('change', e => { S.cmpA = +e.target.value; renderView(); });
    document.getElementById('cmpB').addEventListener('change', e => { S.cmpB = +e.target.value; renderView(); });
  });
  const opts = sel => S.teams.map(t => `<option value="${t.rid}" ${t.rid === sel ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
  const col = rid => {
    const r = S.teamByRid[rid].roster; const startSet = new Set(r.starters || []);
    const pl = (r.players || []).map(pid => ({pid, pos:pos1(pid), sp:seasonPts(pid), l3:lastN(pid)})).sort((x,y) => (POS_ORDER.indexOf(x.pos) - POS_ORDER.indexOf(y.pos)) || (y.sp.t - x.sp.t));

/* ---------- Saisonverlauf: Platz nach jeder Woche ---------- */
/* Tabellenplatz: Bilanz, bei Gleichstand die Punkte, genau wie Sleeper sortiert. Wochen-Rang: Platz nach den Punkten dieser einen Woche. */
function rankHistory(mode){
  const C = S.C, rids = S.teams.map(t => t.rid), out = {}, acc = {};
  rids.forEach(r => { out[r] = []; acc[r] = {w:0, pf:0}; });
  for (const w of C.weeks){
    for (const r of rids){
      const me = C.scores[w][r]; if (me == null) continue;
      const o = C.opp[w][r], op = o != null ? C.scores[w][o] : null;
      if (op != null) acc[r].w += me > op ? 1 : me === op ? .5 : 0;
      acc[r].pf += me;
    }
    const order = mode === 'week'
      ? [...rids].sort((a,b) => (C.scores[w][b] ?? -1e9) - (C.scores[w][a] ?? -1e9))
      : [...rids].sort((a,b) => acc[b].w - acc[a].w || acc[b].pf - acc[a].pf);
    order.forEach((r,i) => out[r].push(i + 1));
  }
  return out;
}
/* Längster Lauf nach oben (oder unten) in der Saison: größter Abstand zwischen einer frühen und einer späteren Woche */
function bestRun(vals, weeks, down){
  let best = null;
  for (let i = 0; i < vals.length; i++) for (let j = i + 1; j < vals.length; j++){
    const d = down ? vals[j] - vals[i] : vals[i] - vals[j];
    if (d > 0 && (!best || d > best.d || (d === best.d && j - i < best.len))) best = {d, from:weeks[i], to:weeks[j], len:j - i};
  }
  return best;
}
/* Platz-Diagramm: Platz 1 oben, eine Linie pro Team */

/* ---------- Erzielte gegen optimale Punkte, Woche für Woche ---------- */
function ptsCourse(rid){
  const C = S.C, E = (C.team[rid] || {}).effW || {}, out = [];
  for (const w of C.weeks){
    const me = C.scores[w][rid]; if (me == null) continue;
    const e = E[w], actual = e ? e.actual : me, optimal = e ? Math.max(e.optimal, actual) : actual;
    const o = C.opp[w][rid], opp = o != null ? C.scores[w][o] : null;
    const res = opp == null ? null : actual > opp ? 'W' : actual < opp ? 'L' : 'T';
    const optRes = opp == null ? null : optimal > opp ? 'W' : optimal < opp ? 'L' : 'T';
    out.push({w, actual, optimal, left: optimal - actual, opp, oppRid:o, res, optRes,
      need: opp == null || res === 'W' ? null : opp - actual, flip: res !== 'W' && optRes === 'W'});
  }
  return out;
}
/* Verlaufsdiagramm: durchgezogen die erzielten, gestrichelt die optimalen Punkte, dazu der Ausgang je Woche als Feldfarbe */
function courseChart(id, rows){
  const compact = isM();
  const draw = () => {
    const host = document.getElementById(id); if (!host) return;
    if (!rows.length){ host.innerHTML = noWeeks(); return; }
    const W = Math.max(compact ? 260 : 320, host.clientWidth || 700), H = compact ? 250 : 300, ml = compact ? 34 : 44, mr = compact ? 10 : 16, mt = 14, mb = 28;
    const vals = rows.flatMap(r => [r.actual, r.optimal, r.opp].filter(v => v != null));
    const lo = Math.max(0, Math.min(...vals) - 12), hi = Math.max(...vals) + 10;
    const x = i => ml + (rows.length === 1 ? (W - ml - mr) / 2 : i * (W - ml - mr) / (rows.length - 1));
    const y = v => mt + (hi - v) * (H - mt - mb) / Math.max(1, hi - lo);
    const half = rows.length > 1 ? (x(1) - x(0)) / 2 : (W - ml - mr) / 2;
    const path = (key, dash) => `<path d="${rows.map((r,i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).join('')}" fill="none" stroke="${dash ? 'var(--accent-t)' : `url(#${id}-gs)`}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"${dash ? ' stroke-dasharray="6 4"' : ''}/>`;
    let g = '';
    rows.forEach((r,i) => {                                  /* Felder zuerst, damit die Linien darüber liegen */
      const c = r.res == null ? null : r.res === 'W' ? 'var(--good-soft)' : r.flip ? 'var(--warn-soft)' : 'var(--bad-soft)';
      if (!c) return;
      const a = Math.max(ml, x(i) - half), b2 = Math.min(W - mr, x(i) + half);
      g += `<rect x="${a.toFixed(1)}" y="${mt}" width="${(b2-a).toFixed(1)}" height="${H-mt-mb}" fill="${c}" opacity=".6"/>`;
    });
    const step = Math.max(10, Math.round((hi - lo) / 5 / 10) * 10);
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step){
      g += `<line x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${ml-7}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
    }
    rows.forEach((r,i) => { if (rows.length <= (compact ? 8 : 16) || i % 2 === 0 || i === rows.length - 1) g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">W${r.w}</text>`; });
    rows.forEach((r,i) => { if (r.opp != null) g += `<line x1="${(x(i)-9).toFixed(1)}" x2="${(x(i)+9).toFixed(1)}" y1="${y(r.opp)}" y2="${y(r.opp)}" stroke="var(--muted)" stroke-width="2.2" stroke-linecap="round"/>`; });
    g += path('optimal', true) + CK.area(id, rows.map((r,i) => [x(i), y(r.actual)]), H - mb) + path('actual', false);
    rows.forEach((r,i) => { g += `<circle cx="${x(i)}" cy="${y(r.actual)}" r="3.6" fill="var(--mine)" stroke="var(--surface)" stroke-width="2"/>`; });
    CK.mount(host, id, {W, H, ml, mr, mt, mb, n:rows.length, x, g, label:'Erzielte und optimale Punkte pro Woche', svgClickToo:true, tipHtml: i => {
      const r = rows[i];
      return `<div style="font-weight:700;margin-bottom:4px">Woche ${r.w}</div>`
        + `<div class="tr me"><span>Erzielt</span><span>${f1(r.actual)}</span></div>`
        + `<div class="tr"><span>Optimal</span><span>${f1(r.optimal)}</span></div>`
        + (r.opp != null ? `<div class="tr"><span>Gegner${r.oppRid != null ? ' · ' + esc((S.teamByRid[r.oppRid] || {}).name || '') : ''}</span><span>${f1(r.opp)}</span></div>` : '')
        + (r.res ? `<div class="tr"><span>${r.res === 'W' ? 'Sieg' : r.res === 'T' ? 'Unentschieden' : 'Niederlage'}${r.flip ? ', optimal hätte gereicht' : ''}</span><span>${r.need != null ? '+' + f1(r.need) + ' nötig' : '–'}</span></div>` : '');
    }});
  };
  S.after.push(draw); S.charts.push(draw);
}

async function loadHistory(){
  const seasons = [], owners = {};
  let id = S.league.league_id, guard = 0;
  const myOwner = S.teamByRid[S.myRid].ownerId;
  while (id && id !== '0' && guard++ < 15){
    const [L, users, rosters, bracket] = await Promise.all([api('/league/' + id), api(`/league/${id}/users`), api(`/league/${id}/rosters`), api(`/league/${id}/winners_bracket`).catch(() => null)]);
    if (!L) break;
    const ub = Object.fromEntries((users || []).map(u => [u.user_id, u]));
    const teams = (rosters || []).map(r => { const u = ub[r.owner_id] || {}; const s = r.settings || {}; return {rid:r.roster_id, owner:r.owner_id, name:(u.metadata && u.metadata.team_name) || u.display_name || `Team ${r.roster_id}`, manager:u.display_name || 'unbekannt', w:s.wins||0, l:s.losses||0, pf:(s.fpts||0)+(s.fpts_decimal||0)/100}; });
    const sorted = [...teams].sort((a,b) => b.w - a.w || b.pf - a.pf);
    sorted.forEach((t,i) => t.place = i+1);
    const fin = (bracket || []).find(m => m.p === 1 && m.w);
    const champ = fin ? teams.find(t => t.rid === fin.w) : null;
    const live = L.status !== 'complete';
    seasons.push({season:L.season, live, champ, best:sorted[0] || {name:'–',w:0,l:0}, most:[...teams].sort((a,b) => b.pf - a.pf)[0] || {name:'–',pf:0}, mine: teams.find(t => t.owner === myOwner)});
    for (const t of teams){ if (!t.owner) continue; const o = owners[t.owner] = owners[t.owner] || {owner:t.owner, manager:t.manager, seasons:0, titles:0, w:0, l:0, pf:0}; o.seasons++; o.w += t.w; o.l += t.l; o.pf += t.pf; if (champ && champ.owner === t.owner) o.titles++; }
    id = L.previous_league_id;
  }
  return {seasons, owners};
}

function shortName(pid){ const n = pname(pid); if (isTeamCode(pid) || !n.includes(' ')) return n; const p = n.split(' '); return p[0][0] + '. ' + p.slice(1).join(' '); }
function slotLabels(){ const cnt = {}, tot = {}; S.slots.forEach(s => tot[s] = (tot[s] || 0) + 1); return S.slots.map(s => { cnt[s] = (cnt[s] || 0) + 1; return slotLabel(s) + (tot[s] > 1 ? ' ' + cnt[s] : ''); }); }
/* Jeder Startplatz, jede Woche: Punkte + Spieler. Farbe = Rang dieses Slots unter allen Teams der Woche. */
const isFlexSlot = sl => !['QB','RB','WR','TE','K','DEF','DL','LB','DB'].includes(sl);
function slotGridHTML(rid){
  const C = S.C, ws = C.weeks, labs = slotLabels(), ns = S.slots.length;
  const lg = {};
  for (const w of ws){ lg[w] = S.slots.map(() => ({})); for (const m of S.matchups[w] || []) (m.starters || []).slice(0, ns).forEach((pid,i) => { lg[w][i][m.roster_id] = (m.starters_points || [])[i] || 0; }); }
  const tn = (o, id) => { const v = o[id]; if (v == null) return ''; const vals = Object.values(o); return tint(1 + vals.filter(x => x > v + 1e-9).length, vals.length); };
  const myM = {}; for (const w of ws) myM[w] = (S.matchups[w] || []).find(x => x.roster_id === rid);
  const rows = S.slots.map((s,i) => {
    const avgs = {}; for (const t of S.teams){ const v = ws.map(w => lg[w][i][t.rid]).filter(x => x != null); if (v.length) avgs[t.rid] = avg(v); }
    const cells = ws.map(w => {
      const m = myM[w], pid = m && (m.starters || [])[i], has = pid && pid !== '0';
      if (!has) return `<td class="pl" style="${tn(lg[w][i], rid)}"><div class="sp">–</div><div class="sn">leer</div></td>`;
      const v = (m.starters_points || [])[i] || 0, played = didPlay(w, pid, v), pp = normPos(pos1(pid)).toLowerCase();
      return `<td class="pl" style="${tn(lg[w][i], rid)}" title="${esc(pname(pid))}${played ? '' : ' (kein Einsatz)'}"><div class="sp ${played ? '' : 'dnp'}">${f1(v)}</div><div class="sn">${isFlexSlot(s) ? `<span class="sp-pos">${esc(normPos(pos1(pid)))}</span> ` : ''}${esc(shortName(pid))}</div>${played ? '' : `<div class="sn flag">${isBye(pid, w) ? 'Bye' : 'kein Einsatz'}</div>`}</td>`;
    }).join('');
    return `<tr><td class="sl"><b>${esc(labs[i])}</b></td>${cells}<td class="n" style="font-weight:700;${tn(avgs, rid)}">${f1(avgs[rid])}</td></tr>`;
  }).join('');
  const tot = `<tr class="tot-row"><td class="sl"><b>Gesamt</b></td>${ws.map(w => `<td class="n" style="font-weight:700;${tn(C.scores[w], rid)}">${f1(C.scores[w][rid])}</td>`).join('')}<td class="n" style="font-weight:700;${tint(C.team[rid].pfRank)}">${f1(C.team[rid].avg)}</td></tr>`;
  return `<div class="tbl-wrap"><table class="slotgrid keep"><thead><tr><th>Slot</th>${ws.map(w => `<th class="n">W${w}</th>`).join('')}<th class="n">Ø</th></tr></thead><tbody>${rows}${tot}</tbody></table></div>`;
}
function slotGridPanel(rid){
  return `<section class="panel"><div class="panel-head"><h3>Positionen Woche für Woche</h3>${qm(`Jeder Startplatz mit seinen Punkten und dem Spieler, der in der Woche dort stand. Grün = dieser Platz gehörte in der Woche zum besten Drittel aller Teams, rot = zum schwächsten Drittel.`)}</div>${slotGridHTML(rid)}</section>`;

VIEWS.depth = () => {
  const C = S.C, D = C.depth, n = S.teams.length, P = S.leaguePos;
  if (!C.weeks.length) return head('Kadertiefe') + noWeeks();
  const sel = S.depthPos && P.includes(S.depthPos) ? S.depthPos : P[0];
  S.after.push(() => document.querySelectorAll('[data-dpos]').forEach(b => b.addEventListener('click', () => { S.depthPos = b.dataset.dpos; renderView(); })));
  const me = D.team[S.myRid];
  const order = [...S.teams].sort((a,b) => D.team[a.rid].bonusRank - D.team[b.rid].bonusRank);
  const lg = {ir:0, out:0, bye:0}; S.teams.forEach(t => P.forEach(p => { const o = D.team[t.rid].per[p]; lg.ir += o.ir; lg.out += o.out; lg.bye += o.bye; }));
  const rows = [...S.teams].sort((a,b) => D.team[b.rid].per[sel].val - D.team[a.rid].per[sel].val);
  const totRank = rankTie(S.teams.map(t => t.rid), rid => D.team[rid].total);
  const costRank = rankTie(S.teams.map(t => t.rid), rid => C.dnp[rid].cost, true);
  const pear = (a, b) => { const ma = avg(a), mb = avg(b); let sxy = 0, sx = 0, sy = 0; a.forEach((x,i) => { sxy += (x - ma) * (b[i] - mb); sx += (x - ma) ** 2; sy += (b[i] - mb) ** 2; }); return sx && sy ? sxy / Math.sqrt(sx * sy) : null; };
  const r = pear(S.teams.map(t => D.team[t.rid].bonus), S.teams.map(t => C.team[t.rid].avg));
  const rTxt = r == null ? 'nicht berechenbar' : Math.abs(r) < .2 ? 'kein erkennbarer Zusammenhang' : `${Math.abs(r) < .5 ? 'leichter' : Math.abs(r) < .75 ? 'deutlicher' : 'starker'} ${r > 0 ? 'positiver' : 'negativer'} Zusammenhang`;
  const missChips = o => [o.ir ? `<span class="chip warn" title="IR-Slot">${o.ir} IR</span>` : '', o.out ? `<span class="chip warn" title="Out/IR/PUP/Suspendiert">${o.out} Out</span>` : '', o.bye ? `<span class="chip plain" title="Bye diese Woche">${o.bye} Bye</span>` : ''].join(' ');
  const unav = me.info.filter(x => x.st !== 'ok').sort((a,b) => POS_ORDER.indexOf(a.pos) - POS_ORDER.indexOf(b.pos));
  const depthHelp = `<b>Nur einsatzfähige Spieler zählen.</b> Nicht eingerechnet: Spieler im IR-Slot, mit Out/IR/PUP/Suspendiert${S.isLive ? ', mit Bye diese Woche' : ''} und Taxi-Squad (ligaweit aktuell ${lg.ir} IR, ${lg.out} Out${S.isLive ? `, ${lg.bye} Bye` : ''}).${S.isLive ? '' : ' Außerhalb der laufenden Saison wirken nur IR-Slots.'}<code>Gesamtwert = Ø Starterpunkte + 0,3 × Backup-Wert</code><code>Verlust bei Ausfall = Punkte pro Woche, die das Team verliert, wenn der beste Starter der Position ausfällt</code><code>Backup-Wert = Wert des Spielers, der dann am Ende der Kette einsteigt</code><b>Der ganze Kader wird betrachtet:</b> Die Aufstellung wird bei einem Ausfall komplett neu berechnet, inklusive FLEX und Superflex. Steht dein zweiter TE im FLEX-Slot und ein RB oder WR kann den FLEX übernehmen, ist die TE-Tiefe kein Problem. Wert eines Spielers = erwartete Wochenpunkte (60 % letzte 3 Einsätze, 40 % Saisonschnitt, mit Projektion gemischt). Wochen ohne Einsatz zählen nicht in den Schnitt, bei den Starterpunkten werden sie mit dem Positionsschnitt ersetzt. K und DEF haben keinen Backup-Wert, weil sie jede Woche frei wechselbar sind.`;
  return `

  <section class="panel"><div class="panel-head"><h3>Kadertiefe pro Position</h3>${qm(`Zahl = einsatzfähige Spieler der Position. Darunter: Punkte pro Woche, die du verlierst, wenn dein bester Starter dort ausfällt. Die ganze Aufstellung wird neu berechnet, FLEX und Superflex inklusive. Grün = kaum Verlust, rot = hoher Verlust.`)}</div>
    <div class="tbl-wrap"><table class="heat keep"><thead><tr><th>Team</th>${P.map(p => `<th class="n" style="text-align:center">${p}</th>`).join('')}<th class="n">Backup-Wert</th><th class="n">Aufstellung gesamt</th></tr></thead><tbody>
    ${order.map(t => `<tr class="${mineCls(t.rid)}"><td>${teamCell(t.rid, false)}</td>${P.map(p => { const o = D.team[t.rid].per[p]; return `<td class="h" style="${tint(o.lossRank)}"${o.miss ? ` title="${o.miss} Spieler nicht eingerechnet (IR, Out oder Bye)"` : ''}>${o.ok}<small>${o.loss > .05 ? '−' + f1(o.loss) : '±0'} bei Ausfall</small></td>`; }).join('')}<td class="n" style="font-weight:700;${tint(D.team[t.rid].bonusRank)}">${f1(D.team[t.rid].bonus)}</td><td class="n" style="font-weight:700;${tint(totRank[t.rid])}">${f1(D.team[t.rid].total)}</td></tr>`).join('')}
    </tbody></table></div></section>
  ${byePanel(D, order)}
  <section class="panel"><div class="panel-head"><h3>Ranking pro Position</h3><div class="filters">${P.map(p => `<button class="seg" data-dpos="${p}" aria-pressed="${p === sel}">${p}</button>`).join('')}</div></div>
    <div class="tbl-wrap"><table><thead><tr><th></th><th>Team</th><th>Einsatzfähig</th><th class="n">Lineup / Bank</th><th>Springt bei Ausfall ein</th><th class="n">Verlust bei Ausfall</th><th class="n">Ø Starter-punkte</th><th class="n">Backup-Wert</th><th class="n">Gesamtwert</th></tr></thead><tbody>

  <section class="panel"><div class="panel-head"><h3>Tiefe und Punkte im Vergleich</h3>${qm(`<b>Backup-Wert</b>: Summe der Ersatzwerte aller Positionen. <b>Ausfälle Starter</b>: Slot-Wochen, in denen ein Starter nicht gespielt hat (Bye, inaktiv, verletzt). <b>Verlust</b>: Punkte pro Woche, die das ohne Ersatz gekostet hat.`)}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Team</th><th class="n">Ø Punkte</th><th class="n">Backup-Wert</th><th class="n">Ausfälle Starter (Slot-Wochen)</th><th class="n">Verlust durch Ausfälle (Pkt./Wo.)</th></tr></thead><tbody>

/* Fairere Varianten für einen bereits gebauten Trade: Zusatz, Weglassen oder Tausch eines Spielers */
function fairVariants(e){
  const me = S.myRid, mine = rosterIds(me), theirs = rosterIds(e.rid), seen = new Set(), out = [];
  const topN = (ids, n) => ids.map(pid => ({pid, v:vor(pid)})).sort((a,b) => b.v - a.v).slice(0, n).map(x => x.pid);
  const push = (g, r, note) => {
    if (!g.length || !r.length) return;
    const key = [...g].sort().join(',') + '>' + [...r].sort().join(','); if (seen.has(key)) return; seen.add(key);
    const x = evalTrade(e.rid, g, r); x.note = note; out.push(x);
  };
  const base = [...e.give].sort().join(',') + '>' + [...e.get].sort().join(','); seen.add(base);
  mine.filter(p => !e.give.includes(p)).forEach(p => push(e.give.concat(p), e.get, `Du gibst zusätzlich ${pname(p)}`));
  theirs.filter(p => !e.get.includes(p)).forEach(p => push(e.give, e.get.concat(p), `Du bekommst zusätzlich ${pname(p)}`));
  if (e.give.length > 1) e.give.forEach(p => push(e.give.filter(x => x !== p), e.get, `Ohne ${pname(p)} auf deiner Seite`));
  if (e.get.length > 1) e.get.forEach(p => push(e.give, e.get.filter(x => x !== p), `Ohne ${pname(p)} auf seiner Seite`));
  e.give.forEach(g => topN(mine.filter(p => !e.give.includes(p)), 8).forEach(p => push(e.give.map(x => x === g ? p : x), e.get, `${pname(p)} statt ${pname(g)} von dir`)));
  e.get.forEach(g => topN(theirs.filter(p => !e.get.includes(p)), 8).forEach(p => push(e.give, e.get.map(x => x === g ? p : x), `${pname(p)} statt ${pname(g)} von ihm`)));

}

  <section class="panel"><div class="panel-head"><h3>Vorschläge für dich</h3><div class="filters"><select class="sel" id="trPartner" aria-label="Handelspartner"><option value="all" ${partner === 'all' ? 'selected' : ''}>Alle Teams</option>${others.map(t => `<option value="${t.rid}" ${+partner === t.rid ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select><button class="seg" id="trEven" aria-pressed="${!!S.tradeEven}" title="Nur Trades mit gleich vielen Spielern auf beiden Seiten">${isM() ? 'Gleiche Anzahl' : 'Gleich viele Spieler'}</button></div></div>
    ${shown.length ? shown.map(x => tradeCard(x)).join('') : `<div class="empty">Keine Deals gefunden, bei denen beide Seiten gewinnen.</div>`}</section>`;
}

/* ---------- Transaktionen eines Managers ---------- */
/* Kaderverlauf: wer stand in welcher Woche im Kader, in der Startelf oder auf der Bank */
function rosterTimeline(rid){
  const ws = S.completed || [], rows = {};
  const mark = (pid, k, st) => { (rows[pid] = rows[pid] || {pid, cells:{}}).cells[k] = st ? 's' : 'b'; };
  for (const w of ws){
    const m = (S.matchups[w] || []).find(x => x.roster_id === rid); if (!m) continue;
    const st = new Set((m.starters || []).filter(x => x && x !== '0'));
    new Set([...(m.players || []), ...st]).forEach(pid => mark(pid, w, st.has(pid)));
  }
  const rr = S.teamByRid[rid].roster, cst = new Set((rr.starters || []).filter(x => x && x !== '0'));
  (rr.players || []).forEach(pid => mark(pid, 'now', cst.has(pid)));
  return {cols:[...ws, 'now'], rows:Object.values(rows)};
}
VIEWS.transactions = () => {
  const n = S.teams.length;
  const rid = S.txTeam != null && S.teamByRid[S.txTeam] ? S.txTeam : S.myRid, t = S.teamByRid[rid];
  const flt = S.txFlt || 'all', full = !!S.txFull;
  S.after.push(() => {
    const el = document.getElementById('txTeam'); if (el) el.addEventListener('change', e => { S.txTeam = +e.target.value; renderView(); });
    document.querySelectorAll('[data-txf]').forEach(b => b.addEventListener('click', () => { S.txFlt = b.dataset.txf; renderView(); }));
    const fb = document.getElementById('txFull'); if (fb) fb.addEventListener('click', () => { S.txFull = !S.txFull; renderView(); });
  });
  const D = txOf(rid), sm = D.sum, allS = S.teams.map(x => txOf(x.rid).sum);
  const rk = key => 1 + allS.filter(x => x[key] > sm[key] + 1e-9).length;
  const anyTrade = allS.some(x => x.nTrades > 0), anyAdd = allS.some(x => x.nAdds > 0);
  const best = [...D.adds].sort((a,b) => b.eff - a.eff)[0];
  const isStream = pid => ['K','DEF'].includes(normPos(pos1(pid)));
  const avgTxt = (tot, g) => g ? `Ø ${f1(tot / g)} pro Spiel · ${g} ${g === 1 ? 'Spiel' : 'Spiele'}` : 'kein Einsatz';
  const perTxt = x => x.effW ? `Ø ${sgn(x.eff / x.effW)} pro Woche · ${x.effW} ${x.effW === 1 ? 'Woche' : 'Wochen'}` : 'noch keine Woche';
  const vKey = a => a.open ? 'open' : a.effPer > .75 ? 'good' : a.effPer < -.75 ? 'bad' : 'plain';
  const vChip = a => { const k = vKey(a); return k === 'open' ? '<span class="chip plain">Noch offen</span>' : k === 'good' ? '<span class="chip good">Verstärkung</span>' : k === 'bad' ? '<span class="chip bad">Fehlgriff</span>' : `<span class="chip plain">${a.st.g ? 'Lückenfüller' : 'Nur Kadertiefe'}</span>`; };
  /* --- Kaderverlauf --- */
  const TL = rosterTimeline(rid), ws = S.completed || [];
  const colLbl = c => c === 'now' ? 'Jetzt' : 'W' + c;
  const posOrd = p => { const i = ['QB','RB','WR','TE'].indexOf(normPos(pos1(p))); return i < 0 ? 9 : i; };
  const firstIdx = r => TL.cols.findIndex(c => r.cells[c]), lastIdx = r => { let k = -1; TL.cols.forEach((c,i) => { if (r.cells[c]) k = i; }); return k; };
  const addOf = pid => D.adds.find(a => a.pid === pid), trIn = pid => D.trades.find(x => x.recv.some(r => r.pid === pid)), trOut = pid => D.trades.find(x => x.sent.some(r => r.pid === pid));
  const players = TL.rows.filter(r => !isStream(r.pid)).map(r => {
    const fi = firstIdx(r), li = lastIdx(r), moved = fi > 0 || li < TL.cols.length - 1;
    const a = addOf(r.pid), ti = trIn(r.pid), to = trOut(r.pid);

    const outTxt = li < TL.cols.length - 1 ? `▼ nach ${colLbl(TL.cols[li])} ${to ? 'getradet' : 'gedroppt'}` : '';
    return {...r, fi, li, moved, inTxt, outTxt};
  }).filter(r => full || r.moved).sort((a,b) => posOrd(a.pid) - posOrd(b.pid) || a.fi - b.fi || b.li - a.li);
  const lane = pos => { const cells = TL.cols.map(c => { const hs = TL.rows.filter(r => normPos(pos1(r.pid)) === pos && r.cells[c]); const h = hs.find(r => r.cells[c] === 's') || hs[0]; return h ? {st:h.cells[c], lbl: pos === 'DEF' ? h.pid : (nflTeam(h.pid) || pname(h.pid).split(' ').pop().slice(0,4)), name:pname(h.pid)} : null; }); return cells.some(Boolean) ? cells : null; };

      ${a.drop ? `<div class="tx-side out"><div class="tx-k">dafür gedroppt</div><div class="tx-n">${posChip(pos1(a.drop))} <b>${esc(pname(a.drop))}</b> <span class="pmeta">${esc(nflTeam(a.drop) || '')}</span></div><div class="tx-d">${f1(a.dropPot)} Pkt.${a.dropG ? ` · Ø ${f1(a.dropPot / a.dropG)}` : ''} seitdem</div></div>` : `<div class="tx-side none"><div class="tx-k">ohne Drop</div><div class="tx-d">freier Kaderplatz genutzt</div></div>`}
      <div class="tx-res"><div class="tx-v ${a.open ? '' : numTone(a.eff)}">${a.open ? '–' : sgn(a.eff)}</div><div class="tx-d">${a.open ? 'noch keine Woche' : 'Startelf-Plus · ' + esc(perTxt(a)).replace(/ · .*/, '')}</div>${vChip(a)}</div>

        <tr><td><b>Summe</b></td><td class="n"><b>${f1(sum(x.rows.map(r => r.A)))}</b></td><td class="n">${f1(sum(x.rows.map(r => r.B)))}</td><td class="n"><b class="${numTone(x.eff)}">${sgn(x.eff)}</b></td><td></td><td></td></tr>

    <div class="tbl-wrap"><table><thead><tr><th>Woche</th><th>Spieler</th><th class="n">Punkte seither</th><th class="n">Hätte gebracht</th></tr></thead><tbody>${drops.map(d => `<tr><td>W${d.w}</td><td>${playerCell(d.pid)}</td><td class="n">${f1(d.after)}<div class="pmeta">${esc(avgTxt(d.after, d.g))}</div></td><td class="n" style="font-weight:700"><span class="${d.cost > .5 ? 'bad' : 'muted'}">${f1(Math.max(0, d.cost))}</span></td></tr>`).join('')}</tbody></table></div></section>` : ''}`;

function detectDevice(){
  let forced = null; try { forced = sessionStorage.getItem('sh-device'); } catch(e){}
  if (forced === 'mobile' || forced === 'desktop') return forced;
  const uad = navigator.userAgentData;
  const uaMobile = uad && typeof uad.mobile === 'boolean' ? uad.mobile : /Android|iPhone|iPod|Windows Phone|IEMobile|Mobile|Opera Mini/i.test(navigator.userAgent || '');
  const coarse = window.matchMedia('(pointer: coarse)').matches;
  const smallScreen = Math.min(screen.width || 9999, screen.height || 9999) < 600;
  return (MQ.matches || (uaMobile && coarse && smallScreen)) ? 'mobile' : 'desktop';
}

function mChartKey(){
  const opts = S.teams.filter(t => t.rid !== S.myRid && focusIdx(t.rid) < 0).map(t => `<option value="${t.rid}">${esc(t.name)}</option>`).join('');
  S.after.push(() => {

    document.querySelectorAll('[data-fx]').forEach(b => b.addEventListener('click', () => { S.focus = S.focus.filter(x => x !== +b.dataset.fx); renderView(); }));
  });
  const chips = (S.focus || []).filter(r => r !== S.myRid).map((rid,k) => `<button class="m-fchip" data-fx="${rid}" style="border-color:${FOCUS_COL[k % FOCUS_COL.length]}" aria-label="Team ausblenden"><i style="background:${FOCUS_COL[k % FOCUS_COL.length]}"></i>${esc((S.teamByRid[rid]?.name || '').slice(0, 14))} ✕</button>`).join('');

function scoringLabel(){ const rec = (S.league.scoring_settings || {}).rec ?? 0; return rec >= 1 ? 'PPR' : rec >= .5 ? 'Half-PPR' : rec > 0 ? `${String(rec).replace('.',',')} PPR` : 'Standard'; }
function pointSources(rid){
  const src = {draft:0, waiver:0, trade:0, bestand:0}, by = {};
  for (const w of S.C.weeks){
    const m = (S.matchups[w] || []).find(x => x.roster_id === rid); if (!m) continue;
    (m.starters || []).forEach((pid,i) => { if (!pid || pid === '0') return; const v = (m.starters_points || [])[i] || 0; const ty = acqType(rid, pid, w); src[ty] += v; const b = by[pid] = by[pid] || {pts:0, g:0, type:ty}; b.pts += v; b.g++; b.type = ty; });
  }
  return {src, top: Object.entries(by).sort((a,b) => b[1].pts - a[1].pts)};
}
/* „Keeper“ und „Vorsaison“ nur in Keeper-/Dynasty-Ligen; in Redraft-Ligen heißt der Rest neutral „Sonstige“ */
function srcLabels(){ return {draft:'Draft', waiver:'Waiver/FA', trade:'Trade', bestand: S.cfg.type === 'Keeper' ? 'Keeper' : S.cfg.type === 'Dynasty' ? 'Bestand (Vorsaison)' : 'Sonstige'}; }
const srcL = k => srcLabels()[k];

    <div class="m-list">${eff.map(t => { const T = C.team[t.rid]; return mRow(T.effRank, mTeam(t.rid, `${f1(T.left)} Pkt. verschenkt`), `<b class="tinted" style="${tint(T.effRank)}">${pct(T.eff)}</b>`, mineCls(t.rid)); }).join('')}</div>
  </section>
  <section class="panel"><div class="panel-head"><h3>All-Play &amp; Glück</h3>${qm(`Glück = echte Siege minus erwartete Siege aus der All-Play-Quote.`)}</div>
    <div class="m-list">${lr.map((t,i) => { const T = C.team[t.rid];
      return mRow(i+1, mTeam(t.rid, `Echt ${T.w}–${T.l} · All-Play ${T.apW}–${T.apL} (${pct(T.apPct)})`), `<b class="${T.luck > .25 ? 'pos-v' : T.luck < -.25 ? 'neg-v' : ''}">${sgn(T.luck)}</b><small>${T.luck > .25 ? 'Glück' : T.luck < -.25 ? 'Pech' : 'im Soll'}</small>`, mineCls(t.rid)); }).join('')}</div>
  </section>`;
};

VIEWS_M.draft = () => {
  const D = S.C.draft; if (!D) return mHead('Draft') + `<div class="empty">Für diese Saison gibt es keinen Draft mit Picks.</div>`;
  const nT = (S.draft && S.draft.settings && S.draft.settings.teams) || S.teams.length;
  const flt = S.draftFilter || 'all', round = Math.min(S.mRound || 1, D.rounds);
  S.after.push(() => {
    document.querySelectorAll('[data-dflt]').forEach(b => b.addEventListener('click', () => { S.draftFilter = b.dataset.dflt; renderView(); }));
    document.querySelectorAll('[data-rnd]').forEach(b => b.addEventListener('click', () => { S.mRound = +b.dataset.rnd; S.draftFilter = 'all'; renderView(); }));
    const cur = document.querySelector('[data-rnd][aria-pressed="true"]'); if (cur) cur.scrollIntoView({block:'nearest', inline:'center'});
  });
  const grades = Object.entries(D.grades).sort((a,b) => a[1].rank - b[1].rank);
  let picks = flt === 'all' ? D.rows.filter(r => r.round === round) : flt === 'mine' ? D.rows.filter(r => r.rid === S.myRid) : D.rows.filter(r => r.verdict === flt);
  picks = [...picks].sort((a,b) => a.no - b.no);
  return `${mHead('Draft', `${D.rows.length} Picks · ${D.rounds} Runden`)}
  ${scaleKey()}
  ${!D.hasData ? `<div class="note">Bewertungen erscheinen nach dem ersten Spieltag.</div>` : ''}
  <section class="panel"><div class="panel-head"><h3>Draft-Noten</h3>${qm(`Punkte über bzw. unter vergleichbaren Picks (gleiche Position, ähnliche Runde).`)}</div>
    <div class="m-list">${grades.map(([rid,g]) => mRow(g.rank, mTeam(+rid, `<span class="tinted" style="${tint(g.rank, grades.length)}">Value ${sgn(g.score)}/Pick</span> · ${g.steals} Steals · ${g.busts} Busts`), `<b class="grade ${gradeTone(g.grade)}">${g.grade}</b>`, mineCls(+rid))).join('')}</div>
  </section>
  <section class="panel"><h3>Picks</h3>
    <div class="filters">${[['all','Nach Runde'],['mine','Meine'],['steal','Steals'],['bust','Busts']].map(([k,l]) => `<button class="seg" data-dflt="${k}" aria-pressed="${flt === k}">${l}</button>`).join('')}</div>
    ${flt === 'all' ? `<div class="filters">${Array.from({length:D.rounds}, (_,i) => `<button class="seg" data-rnd="${i+1}" aria-pressed="${round === i+1}">R${i+1}</button>`).join('')}</div>` : ''}
    ${picks.length ? `<div class="m-list">${picks.map(r => mRow(`<span class="pk">${r.round}.${String(r.no - (r.round-1)*nT).padStart(2,'0')}</span>`,
      `<div class="pname">${esc(r.name)}</div><div class="pmeta">${posChip(r.pos)} ${esc(r.team || '')} · ${esc(S.teamByRid[r.rid]?.name || '')}</div>`,
      D.hasData ? `<b>${f1(r.pts)}</b><small>${r.verdict === 'steal' ? '<span class="chip good">Steal</span>' : r.verdict === 'bust' ? '<span class="chip bad">Bust</span>' : 'Erw. ' + f1(r.exp)}${r.g ? ` · Ø ${f1(r.ppg)}/Sp.` : ''}</small>` : '',
      mineCls(r.rid))).join('')}</div>` : `<div class="empty">Keine Picks in dieser Auswahl.</div>`}
  </section>`;
};

/* ---------- Start ---------- */
(function init(){
  applyDevice();
  const onMQ = () => { if (applyDevice() && S.C && S.myRid != null && document.getElementById('view')) renderApp(); };
  if (MQ.addEventListener) MQ.addEventListener('change', onMQ); else if (MQ.addListener) MQ.addListener(onMQ);
  document.addEventListener('touchstart', e => { if (!e.target.closest('.chart')) document.querySelectorAll('.chart .tip').forEach(t => t.hidden = true); }, {passive:true});
  let id = null;
  try { const u = new URL(location.href); id = u.searchParams.get('league'); } catch(e){}
  if (!id && /^#?\d{8,}$/.test(location.hash.replace('#',''))) id = location.hash.replace('#','');
  if (!id){ const ls = lastSel(); if (ls && ls.league) id = ls.league; }
  if (id) loadLeague(id); else renderStart();
})();
</script>
