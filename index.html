VIEWS.coaching = () => {
  const C = S.C; if (!C.weeks.length) return head('Coaching') + noWeeks();
  const rows = [...S.teams].sort((a,b) => C.team[a.rid].effRank - C.team[b.rid].effRank);
  const lr = [...S.teams].sort((a,b) => C.team[b.rid].luck - C.team[a.rid].luck);
  const maxL = Math.max(.5, ...lr.map(t => Math.abs(C.team[t.rid].luck)));
  return `
  ${head('Coaching-Analyse', `${C.weeks.length} Wochen Hauptrunde`)}
  ${scaleKey()}
  <section class="panel"><div class="panel-head"><h3>Coaching-Effizienz</h3>${qm(`Jede Woche wird aus dem vollen Kader die bestmögliche Aufstellung berechnet, mit FLEX und Superflex nach euren Slots. Effizienz = echte Punkte ÷ optimale Punkte.`)}</div>
    ${barRows(rows.map(t => ({label:t.name, v:C.team[t.rid].eff, mine:t.rid === S.myRid})), {fmt:pct})}
    <div class="tbl-wrap"><table><thead><tr><th></th><th>Team</th><th class="n">Effizienz</th><th class="n">Verschenkt gesamt</th><th class="n">Ø pro Woche</th><th class="n">Perfekte Wochen</th></tr></thead><tbody>
    ${rows.map(t => { const T = C.team[t.rid]; const ws = Object.values(T.effW); return `<tr class="${mineCls(t.rid)}"><td class="rank">${T.effRank}</td><td>${teamCell(t.rid)}</td><td class="n" style="${tint(T.effRank)}">${pct(T.eff)}</td><td class="n" style="${tint(T.leftRank)}">${f1(T.left)}</td><td class="n">${f1(ws.length ? T.left / ws.length : null)}</td><td class="n">${ws.filter(x => x.left < .05).length}</td></tr>`; }).join('')}
    </tbody></table></div></section>
  <section class="panel"><div class="panel-head"><h3>All-Play &amp; Glücks-Index</h3>${qm(`<b>All-Play</b>: jede Woche gegen alle anderen Teams gewertet. <b>Glück</b> = echte Siege minus erwartete Siege aus der All-Play-Quote. Grün: mehr Siege, als die Punkte hergeben. Rot: weniger Siege als verdient.`)}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Team</th><th class="n">Echte Bilanz</th><th class="n">All-Play</th><th class="n">All-Play %</th><th class="n">Erwartete Siege</th><th style="min-width:180px">Glück</th></tr></thead><tbody>
    ${lr.map(t => { const T = C.team[t.rid]; const w = 50 * Math.abs(T.luck) / maxL; return `<tr class="${mineCls(t.rid)}"><td>${teamCell(t.rid)}</td><td class="n">${T.w}–${T.l}${T.t ? '–'+T.t : ''}</td><td class="n">${T.apW}–${T.apL}${T.apT ? '–'+T.apT : ''}</td><td class="n" style="${tint(T.apRank)}">${pct(T.apPct)}</td><td class="n">${f1(T.expW)}</td>
      <td><div style="display:flex;align-items:center;gap:8px"><div style="position:relative;flex:1;height:10px;background:var(--sunken);border-radius:2px"><span style="position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)"></span><span style="position:absolute;top:0;bottom:0;${T.luck >= 0 ? `left:50%;width:${w}%;background:var(--good);border-radius:0 4px 4px 0` : `right:50%;width:${w}%;background:var(--bad);border-radius:4px 0 0 4px`}"></span></div><b style="width:44px;text-align:right">${sgn(T.luck)}</b></div></td></tr>`; }).join('')}
    </tbody></table></div></section>`;
};

VIEWS.draft = () => {
  const D = S.C.draft; if (!D) return head('Draft') + `<div class="empty">Für diese Saison gibt es keinen Draft mit Picks.</div>`;
  const nT = (S.draft && S.draft.settings && S.draft.settings.teams) || S.teams.length;
  const slotToRid = (S.draft && S.draft.slot_to_roster_id) || {};
  const ridOfSlot = s => slotToRid[s] ?? D.rows.find(r => r.slot === s)?.rid;
  const grades = Object.entries(D.grades).sort((a,b) => a[1].rank - b[1].rank);
  const totRk = {}; Object.entries(D.grades).sort((a,b) => b[1].total - a[1].total).forEach(([rid],i) => totRk[rid] = i + 1);
  const flt = S.draftFilter || 'all', bm = S.boardMode || 'tot';
  S.after.push(() => document.querySelectorAll('[data-bmode]').forEach(b => b.addEventListener('click', () => { S.boardMode = b.dataset.bmode; renderView(); })));
  S.after.push(() => document.querySelectorAll('[data-dflt]').forEach(b => b.addEventListener('click', () => { S.draftFilter = b.dataset.dflt; renderView(); })));
  const cells = [];
  for (let s = 1; s <= nT; s++){ const rid = ridOfSlot(s); cells.push(`<div class="cell hd ${rid === S.myRid ? 'is-mine' : ''}" style="grid-column:${s};grid-row:1" title="${esc(S.teamByRid[rid]?.name || '')}">${esc(S.teamByRid[rid]?.name || 'Slot ' + s)}</div>`); }
  for (const r of D.rows){
    const dim = flt !== 'all' && r.verdict !== flt;
    cells.push(`<div class="cell ${r.verdict} ${r.rid === S.myRid ? 'mine-col' : ''} ${dim ? 'dim' : ''}" style="grid-column:${r.slot};grid-row:${r.round + 1}" ${r.verdict ? `data-tip="${esc(r.verdict === 'steal' ? `Gewählt bei ${r.pickLbl}. Leistung wie ein Pick ab ${r.fairLbl}.` : `Gewählt bei ${r.pickLbl}. Leistung wie ein Pick um ${r.fairLbl}.`)}"` : ''}>
      <span class="no">${r.round}.${String(r.no - (r.round-1)*nT).padStart(2,'0')}</span>${r.verdict ? `<span class="vd">${r.verdict === 'steal' ? 'STEAL' : 'BUST'}</span>` : ''}
      <span class="pn">${esc(r.name)}</span><span>${posChip(r.pos)} <span class="pmeta">${esc(r.team || '')}</span></span>
      ${D.hasData ? (() => { const t = `<span class="pv">${f1(r.pts)} Pkt.</span>`, a = r.g ? `<span class="pv">Ø ${f1(r.ppg)} pro Spiel</span>` : `<span class="pmeta">kein Einsatz</span>`; return bm === 'avg' ? a : t; })() : ''}</div>`);
  }
  return `
  ${head('Draft-Analyse', `${S.draft && S.draft.type ? (S.draft.type === 'snake' ? 'Snake' : S.draft.type === 'auction' ? 'Auktion' : S.draft.type) : ''} · ${D.rows.length} Picks · ${D.rounds} Runden`)}
  ${!D.hasData ? `<div class="note">Noch keine gespielten Wochen: Bewertungen erscheinen nach dem ersten Spieltag.</div>` : ''}
  ${scaleKey()}
  <section class="panel"><div class="panel-head"><h3>Draft-Noten</h3>${qm(`Value pro Pick = Punkte über bzw. unter dem Schnitt vergleichbarer Picks (gleiche Position, ähnliche Runde), frühe Runden stärker gewichtet. Die Note ergibt sich aus dem Abstand zum Liga-Schnitt. <b>Steal/Bust</b>: Rangfolge innerhalb der Position nach Gesamtpunkten und nach Ø pro Spiel müssen beide deutlich früher (Steal) bzw. später (Bust) passen als der echte Pick, mindestens eine dreiviertel Runde.`)}</div>
    <div class="tbl-wrap"><table><thead><tr><th></th><th>Team</th><th class="n">Note</th><th class="n">Value / Pick</th><th class="n">Steals</th><th class="n">Busts</th><th class="n">Punkte gesamt</th></tr></thead><tbody>
    ${grades.map(([rid,g]) => `<tr class="${mineCls(+rid)}"><td class="rank">${g.rank}</td><td>${teamCell(+rid)}</td><td class="n grade ${gradeTone(g.grade)}" style="font-weight:700;font-size:1.25rem">${g.grade}</td><td class="n ${numTone(g.score) ? 't-' + numTone(g.score) : ''}" style="${tint(g.rank, grades.length)}">${sgn(g.score)}</td><td class="n">${g.steals}</td><td class="n">${g.busts}</td><td class="n" style="${tint(totRk[rid], grades.length)}">${f0(g.total)}</td></tr>`).join('')}
    </tbody></table></div></section>
  <section class="panel"><div class="panel-head"><h3>Draft-Board</h3>
    <div class="filters">${D.hasData ? `<span role="group" aria-label="Anzeige" style="display:contents">${[['tot','Gesamtpunkte'],['avg','Ø pro Spiel']].map(([k,l]) => `<button class="seg" data-bmode="${k}" aria-pressed="${bm === k}">${l}</button>`).join('')}</span><span class="vsep" aria-hidden="true"></span>` : ''}${[['all','Alle'],['steal','Steals'],['bust','Busts']].map(([k,l]) => `<button class="seg" data-dflt="${k}" aria-pressed="${flt === k}">${l}</button>`).join('')}</div></div>
    <div class="tbl-wrap"><div class="board" style="grid-template-columns:repeat(${nT},minmax(0,1fr))">${cells.join('')}</div></div>
  </section>`;
};

VIEWS.positions = () => {
  const C = S.C; if (!C.weeks.length) return head('Positionsstärke') + noWeeks();
  const P = S.leaguePos, sel = S.posSel && P.includes(S.posSel) ? S.posSel : P[0], n = S.teams.length;
  S.after.push(() => document.querySelectorAll('[data-psel]').forEach(b => b.addEventListener('click', () => { S.posSel = b.dataset.psel; renderView(); })));
  const shade = r => tint(r, n);
  const rows = [...S.teams].sort((a,b) => C.posStr[b.rid][sel] - C.posStr[a.rid][sel]);
  return `
  ${head('Positionsstärke', 'Ø Punkte der Starter pro Woche, aufgeteilt nach Position')}
  <section class="panel"><div class="panel-head"><h3>Übersicht</h3>${qm(`Zahl = Ø Starterpunkte pro Woche, darunter der Rang. Grün = vorne in der Liga, Rot = hinten.`)}</div>
    <div class="tbl-wrap"><table class="heat keep"><thead><tr><th>Team</th>${P.map(p => `<th class="n" style="text-align:center">${p}</th>`).join('')}<th class="n">Gesamt</th></tr></thead><tbody>
    ${[...S.teams].sort((a,b) => C.team[b.rid].avg - C.team[a.rid].avg).map(t => `<tr class="${mineCls(t.rid)}"><td>${teamCell(t.rid, false)}</td>${P.map(p => { const r = C.posRank[t.rid][p]; return `<td class="h" style="${shade(r)}">${f1(C.posStr[t.rid][p])}<small>#${r}</small></td>`; }).join('')}<td class="n tot" style="font-weight:700">${f1(C.team[t.rid].avg)}</td></tr>`).join('')}
    </tbody></table></div></section>
  <section class="panel"><div class="panel-head"><h3>Ranking pro Position</h3><div class="filters">${P.map(p => `<button class="seg" data-psel="${p}" aria-pressed="${p === sel}">${p}</button>`).join('')}</div>${qm('Der senkrechte Strich zeigt den Liga-Schnitt.')}</div>
    ${barRows(rows.map(t => ({label:t.name, v:C.posStr[t.rid][sel], mine:t.rid === S.myRid})), {mark: avg(rows.map(t => C.posStr[t.rid][sel]))})}</section>`;
};

VIEWS.compare = () => {

  let b = S.cmpB;
  if (b == null || b === a){ const o = C.weeks.length ? C.opp[S.currentWeek]?.[a] ?? C.opp[C.weeks[C.weeks.length-1]]?.[a] : null; b = o ?? S.teams.find(t => t.rid !== a).rid; }
  S.after.push(() => {
    document.getElementById('cmpA').addEventListener('change', e => { S.cmpA = +e.target.value; renderView(); });
    document.getElementById('cmpB').addEventListener('change', e => { S.cmpB = +e.target.value; renderView(); });
  });
  const opts = sel => S.teams.map(t => `<option value="${t.rid}" ${t.rid === sel ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
  const col = rid => {
    const r = S.teamByRid[rid].roster; const startSet = new Set(r.starters || []);
    const pl = (r.players || []).map(pid => ({pid, pos:pos1(pid), sp:seasonPts(pid), l3:lastN(pid)})).sort((x,y) => (POS_ORDER.indexOf(x.pos) - POS_ORDER.indexOf(y.pos)) || (y.sp.t - x.sp.t));
    return `<section class="panel"><div class="panel-head">${teamCell(rid)}<span class="muted small">${S.teamByRid[rid].wins}–${S.teamByRid[rid].losses} · Ø ${f1(C.team[rid].avg)}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Spieler</th><th class="n">Saison</th><th class="n">Ø</th><th class="n">Ø 3 W.</th></tr></thead><tbody>
      ${pl.map(x => `<tr><td>${playerCell(x.pid, startSet.has(x.pid) ? ' · Starter' : '')}</td><td class="n">${f1(x.sp.t)}</td><td class="n">${f1(x.sp.g ? x.sp.t / x.sp.g : null)}</td><td class="n">${f1(x.l3)}</td></tr>`).join('')}
      </tbody></table></div></section>`;
  };
  return `
  ${head('Kader-Vergleich', 'Zwei Teams nebeneinander')}
  ${scaleKey()}
  <div class="filters"><select class="sel" id="cmpA" aria-label="Team links">${opts(a)}</select><span class="muted">gegen</span><select class="sel" id="cmpB" aria-label="Team rechts">${opts(b)}</select></div>
  ${C.weeks.length ? `<section class="panel"><div class="panel-head"><h3>Positionen direkt</h3>${qm(`Ø Starterpunkte pro Woche`)}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Position</th><th class="n">${esc(S.teamByRid[a].name)}</th><th class="n">${esc(S.teamByRid[b].name)}</th><th class="n">Vorteil</th></tr></thead><tbody>
    ${S.leaguePos.map(p => { const va = C.posStr[a][p], vb = C.posStr[b][p], d = va - vb; return `<tr><td>${posChip(p)}</td><td class="n" style="${tint(C.posRank[a][p])}">${f1(va)}</td><td class="n" style="${tint(C.posRank[b][p])}">${f1(vb)}</td><td class="n">${Math.abs(d) < .05 ? '=' : `<span class="chip plain">${esc((d > 0 ? S.teamByRid[a] : S.teamByRid[b]).name)} ${sgn(Math.abs(d))}</span>`}</td></tr>`; }).join('')}
    </tbody></table></div></section>` : ''}
  <div class="grid2">${col(a)}${col(b)}</div>`;
};

VIEWS.consistency = () => {
  const C = S.C; if (!C.weeks.length) return head('Spieler-Konstanz') + noWeeks();
  const tf = S.consTeam ?? S.myRid, pf = S.consPos || 'ALL', sort = S.consSort || 'avg';
  S.after.push(() => {
    document.getElementById('consTeam').addEventListener('change', e => { S.consTeam = e.target.value === 'all' ? 'all' : +e.target.value; renderView(); });
    document.getElementById('consSort').addEventListener('change', e => { S.consSort = e.target.value; renderView(); });
    document.querySelectorAll('[data-cpos]').forEach(b => b.addEventListener('click', () => { S.consPos = b.dataset.cpos; renderView(); }));
  });
  const owner = {}; S.rosters.forEach(r => (r.players || []).forEach(p => owner[p] = r.roster_id));
  const rowOf = pid => {
    const vals = C.weeks.map(w => weekPts(pid, w));
    const played = vals.filter((v, i) => v != null && didPlay(C.weeks[i], pid, v));
    const pos = pos1(pid);
    const boom = played.filter(v => v >= (BOOM[pos] ?? 15)).length, bust = played.filter(v => v < (BUST[pos] ?? 5)).length;
    return {pid, pos, vals, g:played.length, avg:avg(played), sd:sd(played), boom: played.length ? boom/played.length : null, bust: played.length ? bust/played.length : null};
  };
  const allRows = Object.keys(owner).map(rowOf).filter(r => r.g >= 2);
  const rows = allRows.filter(r => (tf === 'all' || owner[r.pid] === tf) && (pf === 'ALL' || r.pos === pf));
  /* Farbe: Platz unter allen Spielern derselben Position, die in der Liga im Kader stehen */
  const tc = (r, k, asc) => { const pool = allRows.filter(x => x.pos === r.pos && x[k] != null); if (pool.length < 4 || r[k] == null) return ''; return tintF(pool.filter(x => asc ? x[k] > r[k] + 1e-9 : x[k] < r[k] - 1e-9).length / (pool.length - 1)); };
  const key = {avg:r => -(r.avg ?? 0), boom:r => -(r.boom ?? 0), bust:r => -(r.bust ?? 0), sd:r => (r.sd ?? 99)}[sort];
  rows.sort((a,b) => key(a) - key(b));
  const maxV = Math.max(10, ...rows.flatMap(r => r.vals.filter(v => v != null)));
  return `
  ${head('Spieler-Konstanz', 'Boom- und Bust-Quote über die Saison')}
  <p class="scale-key small muted"><span>Farbe = Platz unter allen Spielern der Position in der Liga</span><span>hinten</span><i aria-hidden="true"></i><span>vorne</span></p>
  <section class="panel">
    <div class="panel-head"><h3>Boom und Bust pro Spieler</h3>${qm(`<b>Boom</b>: Woche über der Positionsschwelle (QB ${BOOM.QB}, RB/WR ${BOOM.RB}, TE ${BOOM.TE}). <b>Bust</b>: darunter (QB ${BUST.QB}, RB/WR ${BUST.RB}, TE ${BUST.TE}). Gewertet werden nur Wochen mit Einsatz.`)}</div>
    <div class="filters">
      <select class="sel" id="consTeam" aria-label="Team"><option value="all" ${tf === 'all' ? 'selected' : ''}>Alle Teams</option>${S.teams.map(t => `<option value="${t.rid}" ${t.rid === tf ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>
      <select class="sel" id="consSort" aria-label="Sortierung">${[['avg','nach Ø Punkten'],['boom','nach Boom-Quote'],['bust','nach Bust-Quote'],['sd','am konstantesten']].map(([k,l]) => `<option value="${k}" ${sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      ${['ALL', ...S.leaguePos].map(p => `<button class="seg" data-cpos="${p}" aria-pressed="${pf === p}">${p === 'ALL' ? 'Alle' : p}</button>`).join('')}
    </div>
    ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Spieler</th>${tf === 'all' ? '<th>Team</th>' : ''}<th class="n">Spiele</th><th class="n">Ø</th><th class="n">σ</th><th class="n">Boom</th><th class="n">Bust</th><th>Wochen</th></tr></thead><tbody>
    ${rows.slice(0, isM() ? 40 : 80).map(r => `<tr class="${tf === 'all' ? mineCls(owner[r.pid]) : ''}"><td>${playerCell(r.pid)}</td>${tf === 'all' ? `<td class="small">${esc(S.teamByRid[owner[r.pid]]?.name || '')}</td>` : ''}<td class="n">${r.g}</td><td class="n" style="${tc(r,'avg')}">${f1(r.avg)}</td><td class="n" style="${tc(r,'sd',true)}">${f1(r.sd)}</td><td class="n" style="${tc(r,'boom')}">${pct(r.boom)}</td><td class="n" style="${tc(r,'bust',true)}">${pct(r.bust)}</td>
      <td><span class="spark" title="${r.vals.map((v,i) => `W${C.weeks[i]}: ${v == null ? '–' : f1(v)}`).join(' · ')}">${r.vals.map(v => v == null ? `<i style="height:2px;opacity:.3"></i>` : `<i class="${v >= (BOOM[r.pos] ?? 15) ? 'b' : v < (BUST[r.pos] ?? 5) ? 'x' : ''}" style="height:${Math.max(2, 26 * Math.max(0,v) / maxV)}px"></i>`).join('')}</span></td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">Keine Spieler mit mindestens zwei Einsätzen.</div>`}
  </section>`;
};

VIEWS.history = () => {
  if (!S.history){
    S.history = 'loading';
    loadHistory().then(h => { S.history = h; if (S.view === 'history') renderView(); }).catch(e => { S.history = {error:e.message}; if (S.view === 'history') renderView(); });
  }
  if (S.history === 'loading') return head('Historie', 'Vorsaisons werden geladen …') + `<div class="loading"><div class="spin"></div><div>Folge der Liga-Kette zurück …</div></div>`;
  if (S.history.error) return head('Historie') + `<div class="err">${esc(S.history.error)}</div>`;
  const H = S.history; const myOwner = S.teamByRid[S.myRid].ownerId;
  if (!H.seasons.length) return head('Historie') + `<div class="empty">Diese Liga hat keine Vorsaisons auf Sleeper.</div>`;
  const all = Object.values(H.owners).sort((a,b) => b.titles - a.titles || (b.w/(b.w+b.l||1)) - (a.w/(a.w+a.l||1)));
  const rkBy = f => { const m = new Map(); [...all].sort((a,b) => f(b) - f(a)).forEach((o,i) => m.set(o, i+1)); return m; };
  const rkWin = rkBy(o => o.w / Math.max(1, o.w + o.l)), rkPf = rkBy(o => o.pf);
  return `

  <section class="panel"><div class="panel-head"><h3>Saison für Saison</h3></div>
    <div class="tbl-wrap"><table><thead><tr><th>Saison</th><th>Meister</th><th>Beste Hauptrunde</th><th>Meiste Punkte</th><th>Dein Manager</th></tr></thead><tbody>

    </tbody></table></div></section>
  ${scaleKey()}
  <section class="panel"><div class="panel-head"><h3>Ewige Tabelle</h3>${qm(`Hauptrunde aller Saisons, zugeordnet über den Sleeper-Account.`)}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Manager</th><th class="n">Saisons</th><th class="n">Titel</th><th class="n">S–N</th><th class="n">Sieg %</th><th class="n">Punkte</th></tr></thead><tbody>
    ${all.map(o => `<tr class="${o.owner === myOwner ? 'is-mine' : ''}"><td><b>${esc(o.manager)}</b></td><td class="n">${o.seasons}</td><td class="n">${o.titles ? '★'.repeat(Math.min(o.titles,5)) : '–'}</td><td class="n">${o.w}–${o.l}</td><td class="n" style="${tint(rkWin.get(o), all.length)}">${pct(o.w / Math.max(1, o.w + o.l))}</td><td class="n" style="${tint(rkPf.get(o), all.length)}">${f0(o.pf)}</td></tr>`).join('')}
    </tbody></table></div></section>`;
};

async function loadHistory(){
  const seasons = [], owners = {};
  let id = S.league.league_id, guard = 0;
  const myOwner = S.teamByRid[S.myRid].ownerId;
  while (id && id !== '0' && guard++ < 15){
    const [L, users, rosters, bracket] = await Promise.all([api('/league/' + id), api(`/league/${id}/users`), api(`/league/${id}/rosters`), api(`/league/${id}/winners_bracket`).catch(() => null)]);
    if (!L) break;
    const ub = Object.fromEntries((users || []).map(u => [u.user_id, u]));
    const teams = (rosters || []).map(r => { const u = ub[r.owner_id] || {}; const s = r.settings || {}; return {rid:r.roster_id, owner:r.owner_id, name:(u.metadata && u.metadata.team_name) || u.display_name || `Team ${r.roster_id}`, manager:u.display_name || 'unbekannt', w:s.wins||0, l:s.losses||0, pf:(s.fpts||0)+(s.fpts_decimal||0)/100}; });
    const sorted = [...teams].sort((a,b) => b.w - a.w || b.pf - a.pf);
    sorted.forEach((t,i) => t.place = i+1);
    const fin = (bracket || []).find(m => m.p === 1 && m.w);
    const champ = fin ? teams.find(t => t.rid === fin.w) : null;
    const live = L.status !== 'complete';
    seasons.push({season:L.season, live, champ, best:sorted[0] || {name:'–',w:0,l:0}, most:[...teams].sort((a,b) => b.pf - a.pf)[0] || {name:'–',pf:0}, mine: teams.find(t => t.owner === myOwner)});
    for (const t of teams){ if (!t.owner) continue; const o = owners[t.owner] = owners[t.owner] || {owner:t.owner, manager:t.manager, seasons:0, titles:0, w:0, l:0, pf:0}; o.seasons++; o.w += t.w; o.l += t.l; o.pf += t.pf; if (champ && champ.owner === t.owner) o.titles++; }
    id = L.previous_league_id;
  }
  return {seasons, owners};
}

function shortName(pid){ const n = pname(pid); if (isTeamCode(pid) || !n.includes(' ')) return n; const p = n.split(' '); return p[0][0] + '. ' + p.slice(1).join(' '); }
function slotLabels(){ const cnt = {}, tot = {}; S.slots.forEach(s => tot[s] = (tot[s] || 0) + 1); return S.slots.map(s => { cnt[s] = (cnt[s] || 0) + 1; return slotLabel(s) + (tot[s] > 1 ? ' ' + cnt[s] : ''); }); }
/* Jeder Startplatz, jede Woche: Punkte + Spieler. Farbe = Rang dieses Slots unter allen Teams der Woche. */
const isFlexSlot = sl => !['QB','RB','WR','TE','K','DEF','DL','LB','DB'].includes(sl);
function slotGridHTML(rid){
  const C = S.C, ws = C.weeks, labs = slotLabels(), ns = S.slots.length;
  const lg = {};
  for (const w of ws){ lg[w] = S.slots.map(() => ({})); for (const m of S.matchups[w] || []) (m.starters || []).slice(0, ns).forEach((pid,i) => { lg[w][i][m.roster_id] = (m.starters_points || [])[i] || 0; }); }
  const tn = (o, id) => { const v = o[id]; if (v == null) return ''; const vals = Object.values(o); return tint(1 + vals.filter(x => x > v + 1e-9).length, vals.length); };
  const myM = {}; for (const w of ws) myM[w] = (S.matchups[w] || []).find(x => x.roster_id === rid);
  const rows = S.slots.map((s,i) => {
    const avgs = {}; for (const t of S.teams){ const v = ws.map(w => lg[w][i][t.rid]).filter(x => x != null); if (v.length) avgs[t.rid] = avg(v); }
    const cells = ws.map(w => {
      const m = myM[w], pid = m && (m.starters || [])[i], has = pid && pid !== '0';
      if (!has) return `<td class="pl" style="${tn(lg[w][i], rid)}"><div class="sp">–</div><div class="sn">leer</div></td>`;
      const v = (m.starters_points || [])[i] || 0, played = didPlay(w, pid, v), pp = normPos(pos1(pid)).toLowerCase();
      return `<td class="pl" style="${tn(lg[w][i], rid)}" title="${esc(pname(pid))}${played ? '' : ' (kein Einsatz)'}"><div class="sp ${played ? '' : 'dnp'}">${f1(v)}</div><div class="sn">${isFlexSlot(s) ? `<span class="sp-pos">${esc(normPos(pos1(pid)))}</span> ` : ''}${esc(shortName(pid))}</div>${played ? '' : `<div class="sn flag">${isBye(pid, w) ? 'Bye' : 'kein Einsatz'}</div>`}</td>`;
    }).join('');
    return `<tr><td class="sl"><b>${esc(labs[i])}</b></td>${cells}<td class="n" style="font-weight:700;${tn(avgs, rid)}">${f1(avgs[rid])}</td></tr>`;
  }).join('');
  const tot = `<tr class="tot-row"><td class="sl"><b>Gesamt</b></td>${ws.map(w => `<td class="n" style="font-weight:700;${tn(C.scores[w], rid)}">${f1(C.scores[w][rid])}</td>`).join('')}<td class="n" style="font-weight:700;${tint(C.team[rid].pfRank)}">${f1(C.team[rid].avg)}</td></tr>`;
  return `<div class="tbl-wrap"><table class="slotgrid keep"><thead><tr><th>Slot</th>${ws.map(w => `<th class="n">W${w}</th>`).join('')}<th class="n">Ø</th></tr></thead><tbody>${rows}${tot}</tbody></table></div>`;
}
function slotGridPanel(rid){
  return `<section class="panel"><div class="panel-head"><h3>Positionen Woche für Woche</h3>${qm(`Jeder Startplatz mit seinen Punkten und dem Spieler, der in der Woche dort stand. Grün = dieser Platz gehörte in der Woche zum besten Drittel aller Teams, rot = zum schwächsten Drittel.`)}</div>${slotGridHTML(rid)}</section>`;

/* Bye-Wochen: sollten nicht alle in derselben Woche liegen */
function byePanel(D, order){
  const live = S.isLive, any = S.teams.some(t => D.team[t.rid].bye && D.team[t.rid].bye.weeks.length);
  if (!live || !any) return '';
  const worstRank = rankTie(S.teams.map(t => t.rid), rid => D.team[rid].bye.worst ? D.team[rid].bye.worst.loss : 0, true);
  const rows = [...S.teams].sort((a,b) => (D.team[a.rid].bye.worst?.loss ?? 0) - (D.team[b.rid].bye.worst?.loss ?? 0));
  const names = w => w.gone.slice(0, 4).map(pid => `${esc(pname(pid))} <span class="muted">${esc(normPos(pos1(pid)))}</span>`).join(', ') + (w.gone.length > 4 ? ` +${w.gone.length - 4}` : '');
  return `<section class="panel"><div class="panel-head"><h3>Bye-Wochen im Kader</h3>${qm(`Pro kommender Bye-Woche wird die komplette Aufstellung ohne die Spieler mit Bye neu berechnet. <b>Verlust</b> = erwartete Punkte, die in dieser Woche fehlen. Liegen viele Bye-Wochen von Startern in derselben Woche, ist der Verlust dort groß. Der Spielplan kommt von Sleeper${S.sched ? '' : ' (aktuell nicht erreichbar: bekannt sind nur bereits laufende oder vergangene Bye-Wochen)'}.`)}</div>

/* ---------- Kadertiefe ---------- */
VIEWS.depth = () => {
  const C = S.C, D = C.depth, n = S.teams.length, P = S.leaguePos;
  if (!C.weeks.length) return head('Kadertiefe') + noWeeks();
  const sel = S.depthPos && P.includes(S.depthPos) ? S.depthPos : P[0];
  S.after.push(() => document.querySelectorAll('[data-dpos]').forEach(b => b.addEventListener('click', () => { S.depthPos = b.dataset.dpos; renderView(); })));
  const me = D.team[S.myRid];
  const order = [...S.teams].sort((a,b) => D.team[a.rid].bonusRank - D.team[b.rid].bonusRank);
  const lg = {ir:0, out:0, bye:0}; S.teams.forEach(t => P.forEach(p => { const o = D.team[t.rid].per[p]; lg.ir += o.ir; lg.out += o.out; lg.bye += o.bye; }));
  const rows = [...S.teams].sort((a,b) => D.team[b.rid].per[sel].val - D.team[a.rid].per[sel].val);
  const totRank = rankTie(S.teams.map(t => t.rid), rid => D.team[rid].total);
  const costRank = rankTie(S.teams.map(t => t.rid), rid => C.dnp[rid].cost, true);
  const pear = (a, b) => { const ma = avg(a), mb = avg(b); let sxy = 0, sx = 0, sy = 0; a.forEach((x,i) => { sxy += (x - ma) * (b[i] - mb); sx += (x - ma) ** 2; sy += (b[i] - mb) ** 2; }); return sx && sy ? sxy / Math.sqrt(sx * sy) : null; };
  const r = pear(S.teams.map(t => D.team[t.rid].bonus), S.teams.map(t => C.team[t.rid].avg));
  const rTxt = r == null ? 'nicht berechenbar' : Math.abs(r) < .2 ? 'kein erkennbarer Zusammenhang' : `${Math.abs(r) < .5 ? 'leichter' : Math.abs(r) < .75 ? 'deutlicher' : 'starker'} ${r > 0 ? 'positiver' : 'negativer'} Zusammenhang`;
  const missChips = o => [o.ir ? `<span class="chip warn" title="IR-Slot">${o.ir} IR</span>` : '', o.out ? `<span class="chip warn" title="Out/IR/PUP/Suspendiert">${o.out} Out</span>` : '', o.bye ? `<span class="chip plain" title="Bye diese Woche">${o.bye} Bye</span>` : ''].join(' ');
  const unav = me.info.filter(x => x.st !== 'ok').sort((a,b) => POS_ORDER.indexOf(a.pos) - POS_ORDER.indexOf(b.pos));
  const depthHelp = `<b>Nur einsatzfähige Spieler zählen.</b> Nicht eingerechnet: Spieler im IR-Slot, mit Out/IR/PUP/Suspendiert${S.isLive ? ', mit Bye diese Woche' : ''} und Taxi-Squad (ligaweit aktuell ${lg.ir} IR, ${lg.out} Out${S.isLive ? `, ${lg.bye} Bye` : ''}).${S.isLive ? '' : ' Außerhalb der laufenden Saison wirken nur IR-Slots.'}<code>Gesamtwert = Ø Starterpunkte + 0,3 × Backup-Wert</code><code>Verlust bei Ausfall = Punkte pro Woche, die das Team verliert, wenn der beste Starter der Position ausfällt</code><code>Backup-Wert = Wert des Spielers, der dann am Ende der Kette einsteigt</code><b>Der ganze Kader wird betrachtet:</b> Die Aufstellung wird bei einem Ausfall komplett neu berechnet, inklusive FLEX und Superflex. Steht dein zweiter TE im FLEX-Slot und ein RB oder WR kann den FLEX übernehmen, ist die TE-Tiefe kein Problem. Wert eines Spielers = erwartete Wochenpunkte (60 % letzte 3 Einsätze, 40 % Saisonschnitt, mit Projektion gemischt). Wochen ohne Einsatz zählen nicht in den Schnitt, bei den Starterpunkten werden sie mit dem Positionsschnitt ersetzt. K und DEF haben keinen Backup-Wert, weil sie jede Woche frei wechselbar sind.`;
  return `
  ${head('Kadertiefe', 'Wie viele einsatzfähige Spieler pro Position, und was passiert bei einem Ausfall?', undefined, depthHelp)}
  ${scaleKey()}
  <section class="panel"><div class="panel-head"><h3>Kadertiefe pro Position</h3>${qm(`Zahl = einsatzfähige Spieler der Position. Darunter: Punkte pro Woche, die du verlierst, wenn dein bester Starter dort ausfällt. Die ganze Aufstellung wird neu berechnet, FLEX und Superflex inklusive. Grün = kaum Verlust, rot = hoher Verlust.`)}</div>
    <div class="tbl-wrap"><table class="heat keep"><thead><tr><th>Team</th>${P.map(p => `<th class="n" style="text-align:center">${p}</th>`).join('')}<th class="n">Backup-Wert</th><th class="n">Aufstellung gesamt</th></tr></thead><tbody>
    ${order.map(t => `<tr class="${mineCls(t.rid)}"><td>${teamCell(t.rid, false)}</td>${P.map(p => { const o = D.team[t.rid].per[p]; return `<td class="h" style="${tint(o.lossRank)}"${o.miss ? ` title="${o.miss} Spieler nicht eingerechnet (IR, Out oder Bye)"` : ''}>${o.ok}<small>${o.loss > .05 ? '−' + f1(o.loss) : '±0'} bei Ausfall</small></td>`; }).join('')}<td class="n" style="font-weight:700;${tint(D.team[t.rid].bonusRank)}">${f1(D.team[t.rid].bonus)}</td><td class="n" style="font-weight:700;${tint(totRank[t.rid])}">${f1(D.team[t.rid].total)}</td></tr>`).join('')}
    </tbody></table></div></section>
  ${byePanel(D, order)}
  <section class="panel"><div class="panel-head"><h3>Ranking pro Position</h3><div class="filters">${P.map(p => `<button class="seg" data-dpos="${p}" aria-pressed="${p === sel}">${p}</button>`).join('')}</div></div>
    <div class="tbl-wrap"><table><thead><tr><th></th><th>Team</th><th>Einsatzfähig</th><th class="n">Lineup / Bank</th><th>Springt bei Ausfall ein</th><th class="n">Verlust bei Ausfall</th><th class="n">Ø Starter-punkte</th><th class="n">Backup-Wert</th><th class="n">Gesamtwert</th></tr></thead><tbody>
    ${rows.map(t => { const o = D.team[t.rid].per[sel]; return `<tr class="${mineCls(t.rid)}"><td class="rank">${o.valRank}</td><td>${teamCell(t.rid, false)}</td><td>${o.ok} von ${o.all - o.taxi}<div class="chips-row">${missChips(o)}</div><div class="pmeta">Üblich: ${normTxt(sel)}</div></td><td class="n">${o.starters} / ${o.bench}</td><td>${entrant(o) ? `<div title="${esc(chainText(o))}">${esc(pname(entrant(o).step.pid))} ${posChip(pos1(entrant(o).step.pid))}</div><div class="pmeta">${chainShort(o)}</div>${o.clash ? `<div><span class="chip warn" title="Starter und Ersatz haben in derselben Woche Bye: der Ersatz hilft dann nicht">gleiche Bye W${o.clashWeek}</span></div>` : ''}` : `<span class="muted" title="${['K','DEF'].includes(sel) ? 'Auf K und DEF hält man üblicherweise keinen Ersatz' : 'Kein einsatzfähiger Ersatz im Kader'}">${['K','DEF'].includes(sel) ? 'kein Ersatz üblich' : 'kein Ersatz'}</span>`}</td><td class="n" style="${tint(o.lossRank)}">${o.loss > .05 ? '−' + f1(o.loss) : '±0'}</td><td class="n">${f1(o.str)}</td><td class="n" style="${tint(o.backupRank)}">${f1(o.backup)}</td><td class="n" style="font-weight:700;${tint(o.valRank)}">${f1(o.val)}</td></tr>`; }).join('')}
    </tbody></table></div></section>
  <section class="panel"><div class="panel-head"><h3>Tiefe und Punkte im Vergleich</h3>${qm(`<b>Backup-Wert</b>: Summe der Ersatzwerte aller Positionen. <b>Ausfälle Starter</b>: Slot-Wochen, in denen ein Starter nicht gespielt hat (Bye, inaktiv, verletzt). <b>Verlust</b>: Punkte pro Woche, die das ohne Ersatz gekostet hat.`)}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Team</th><th class="n">Ø Punkte</th><th class="n">Backup-Wert</th><th class="n">Ausfälle Starter (Slot-Wochen)</th><th class="n">Verlust durch Ausfälle (Pkt./Wo.)</th></tr></thead><tbody>
    ${[...S.teams].sort((a,b) => C.team[b.rid].avg - C.team[a.rid].avg).map(t => `<tr class="${mineCls(t.rid)}"><td>${teamCell(t.rid, false)}</td><td class="n" style="${tint(C.team[t.rid].avgRank)}">${f1(C.team[t.rid].avg)}</td><td class="n" style="${tint(D.team[t.rid].bonusRank)}">${sgn(D.team[t.rid].bonus)}</td><td class="n">${C.dnp[t.rid].slotWeeks}</td><td class="n" style="${tint(costRank[t.rid])}">${C.dnp[t.rid].cost > .05 ? '−' + f1(C.dnp[t.rid].cost) : '–'}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="small muted">In deiner Liga: ${rTxt} zwischen Backup-Wert und Ø Punkten${r != null ? ` (r = ${String(r.toFixed(2)).replace('.', ',')})` : ''}. Bei ${n} Teams ist das nur eine Tendenz.</p></section>
  <section class="panel"><div class="panel-head"><h3>Bei dir nicht eingerechnet</h3>${qm(`Diese Spieler zählen in deiner Auswertung nicht mit.`)}</div>
    ${unav.length ? `<div class="tbl-wrap"><table><thead><tr><th>Spieler</th><th>Grund</th><th class="n">Ø Wert</th></tr></thead><tbody>${unav.map(x => `<tr><td>${playerCell(x.pid)}</td><td><span class="chip ${x.st === 'bye' || x.st === 'taxi' ? 'plain' : 'warn'}">${ST_LABEL[x.st]}</span></td><td class="n">${f1(x.v)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Alle deine Spieler sind einsatzfähig.</div>`}
  </section>`;
};

/* ---------- Players to Add: Untermenü Free Agents / Trades ---------- */
function dropLine(a){
  const adv = dropAdvice(a.pid); if (!adv) return `<div class="hintline drop muted">Kein sinnvoller Drop: Alle anderen Spieler werden für eine übliche Kaderstruktur gebraucht.</div>`;
  if (adv.free) return `<div class="hintline drop">Kaderplatz frei: <b class="ok">kein Drop nötig</b>${adv.gain > .05 ? ` · ${sgn(adv.gain)} Pkt./Woche` : ''}</div>`;
  if (adv.gain > .05) return `<div class="hintline drop"><b>Drop-Vorschlag:</b> ${esc(pname(adv.pid))} ${posChip(pos1(adv.pid))} <span class="muted">(${adv.starter ? 'Starter' : 'Bank'}, Score ${f1(helperScore(adv.pid).score)})</span> · ${sgn(adv.gain)} Pkt./Woche</div>`;
  return `<div class="hintline drop muted">Keine messbare Verbesserung deiner Aufstellung (Startelf und Bank) bei einem sinnvollen Drop.</div>`;
}
/* Trade-Vorschläge sind ein eigenes Menü (viewTrades) */
VIEWS.trades = () => viewTrades();
const tPlayer = pid => `<div class="tp"><div>${playerCell(pid)}</div><div class="tp-v">Ø ${f1(expVal(pid))}<small>Wert ${f1(vor(pid))}</small></div></div>`;
function tradeMetrics(e){
  const tn = v => numTone(v) ? 't-' + numTone(v) : '';
  const m = isM();
  return `<div class="tr-metrics"><span>${m ? 'Du' : 'Dein Gewinn'} <b class="${tn(e.dMe)}">${sgn(e.dMe)}</b> Pkt./Wo.</span><span>${m ? 'Er' : 'Sein Gewinn'} <b class="${tn(e.dThem)}">${sgn(e.dThem)}</b></span><span>${m ? 'Balance' : 'Marktwert-Balance'} <b>${f0(e.balance * 100)} %</b></span></div>`;
}
/* Bester Free Agent je Position (nach erwarteten Punkten) */
function faTop(pos){
  if (!S.isLive || !S.players) return null;

/* Fairere Varianten für einen bereits gebauten Trade: Zusatz, Weglassen oder Tausch eines Spielers */
function fairVariants(e){
  const me = S.myRid, mine = rosterIds(me), theirs = rosterIds(e.rid), seen = new Set(), out = [];
  const topN = (ids, n) => ids.map(pid => ({pid, v:vor(pid)})).sort((a,b) => b.v - a.v).slice(0, n).map(x => x.pid);
  const push = (g, r, note) => {
    if (!g.length || !r.length) return;

    const x = evalTrade(e.rid, g, r); x.note = note; out.push(x);

  const base = [...e.give].sort().join(',') + '>' + [...e.get].sort().join(','); seen.add(base);
  mine.filter(p => !e.give.includes(p)).forEach(p => push(e.give.concat(p), e.get, `Du gibst zusätzlich ${pname(p)}`));
  theirs.filter(p => !e.get.includes(p)).forEach(p => push(e.give, e.get.concat(p), `Du bekommst zusätzlich ${pname(p)}`));
  if (e.give.length > 1) e.give.forEach(p => push(e.give.filter(x => x !== p), e.get, `Ohne ${pname(p)} auf deiner Seite`));
  if (e.get.length > 1) e.get.forEach(p => push(e.give, e.get.filter(x => x !== p), `Ohne ${pname(p)} auf seiner Seite`));
  e.give.forEach(g => topN(mine.filter(p => !e.give.includes(p)), 8).forEach(p => push(e.give.map(x => x === g ? p : x), e.get, `${pname(p)} statt ${pname(g)} von dir`)));
  e.get.forEach(g => topN(theirs.filter(p => !e.get.includes(p)), 8).forEach(p => push(e.give, e.get.map(x => x === g ? p : x), `${pname(p)} statt ${pname(g)} von ihm`)));

function searchTrades(give, get, want, partner){

      <div class="tr-sides"><div class="tr-side"><span class="tag">Erhalten</span>${x.recv.map(r => `<div class="tp"><div>${playerCell(r.pid)}</div><div class="tp-v">${f1(r.pts)}<small>${f1(r.st.t)} als Starter</small></div></div>`).join('')}${picks(x.picksIn)}</div><div class="tr-arrow" aria-hidden="true">⇄</div><div class="tr-side"><span class="tag">Abgegeben</span>${x.sent.map(r => `<div class="tp"><div>${playerCell(r.pid)}</div><div class="tp-v">${f1(r.pts)}<small>seit Trade</small></div></div>`).join('')}${picks(x.picksOut)}</div></div></div>`).join('') : `<div class="empty">Keine Trades in dieser Saison.</div>`}</section>

const MQ = window.matchMedia('(max-width: 760px)');
function detectDevice(){
  let forced = null; try { forced = sessionStorage.getItem('sh-device'); } catch(e){}
  if (forced === 'mobile' || forced === 'desktop') return forced;
  const uad = navigator.userAgentData;
  const uaMobile = uad && typeof uad.mobile === 'boolean' ? uad.mobile : /Android|iPhone|iPod|Windows Phone|IEMobile|Mobile|Opera Mini/i.test(navigator.userAgent || '');
  const coarse = window.matchMedia('(pointer: coarse)').matches;
  const smallScreen = Math.min(screen.width || 9999, screen.height || 9999) < 600;
  return (MQ.matches || (uaMobile && coarse && smallScreen)) ? 'mobile' : 'desktop';
}
function applyDevice(){ const d = detectDevice(); const ch = d !== S.device; S.device = d; document.documentElement.dataset.device = d; return ch; }
const isM = () => S.device === 'mobile';
function setDevice(d){ try { sessionStorage.setItem('sh-device', d); } catch(e){} applyDevice(); if (S.C && S.myRid != null) renderApp(); }

/* Tabellen werden am Handy zu Karten: Spaltenkopf wandert als Label in jede Zelle */
function cardify(root){
  root.querySelectorAll('table:not(.keep)').forEach(t => {
    const hs = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td,i) => td.setAttribute('data-label', hs[i] || '')));

  });
}

const mRow = (lead, main, trail, cls='') => `<div class="m-row ${cls}"><div class="m-lead">${lead || ''}</div><div class="m-main">${main}</div><div class="m-trail">${trail || ''}</div></div>`;
function mHead(title, sub, av, help){ return `<div class="m-head">${av || ''}<div style="min-width:0"><h2>${esc(title)}</h2>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>${help ? qm(help) : ''}</div>`; }

function mChartKey(){
  const opts = S.teams.filter(t => t.rid !== S.myRid && focusIdx(t.rid) < 0).map(t => `<option value="${t.rid}">${esc(t.name)}</option>`).join('');
  S.after.push(() => {
    const sl = document.getElementById('mFocus'); if (sl) sl.addEventListener('change', e => { if (!e.target.value) return; S.focus = [...(S.focus || []), +e.target.value].slice(-5); renderView(); });
    document.querySelectorAll('[data-fx]').forEach(b => b.addEventListener('click', () => { S.focus = S.focus.filter(x => x !== +b.dataset.fx); renderView(); }));
  });
  const chips = (S.focus || []).filter(r => r !== S.myRid).map((rid,k) => `<button class="m-fchip" data-fx="${rid}" style="border-color:${FOCUS_COL[k % FOCUS_COL.length]}" aria-label="Team ausblenden"><i style="background:${FOCUS_COL[k % FOCUS_COL.length]}"></i>${esc((S.teamByRid[rid]?.name || '').slice(0, 14))} ✕</button>`).join('');
  return `<div class="m-key"><span><i class="k"></i>Du</span><span><i class="k dash"></i>Ø Liga</span>${chips}<label><select id="mFocus" class="sel" aria-label="Team einblenden"><option value="">Team einblenden …</option>${opts}</select></label></div>`;
}
function scoringLabel(){ const rec = (S.league.scoring_settings || {}).rec ?? 0; return rec >= 1 ? 'PPR' : rec >= .5 ? 'Half-PPR' : rec > 0 ? `${String(rec).replace('.',',')} PPR` : 'Standard'; }
function pointSources(rid){
  const src = {draft:0, waiver:0, trade:0, bestand:0}, by = {};
  for (const w of S.C.weeks){
    const m = (S.matchups[w] || []).find(x => x.roster_id === rid); if (!m) continue;
    (m.starters || []).forEach((pid,i) => { if (!pid || pid === '0') return; const v = (m.starters_points || [])[i] || 0; const ty = acqType(rid, pid, w); src[ty] += v; const b = by[pid] = by[pid] || {pts:0, g:0, type:ty}; b.pts += v; b.g++; b.type = ty; });
  }
  return {src, top: Object.entries(by).sort((a,b) => b[1].pts - a[1].pts)};
}
/* „Keeper“ und „Vorsaison“ nur in Keeper-/Dynasty-Ligen; in Redraft-Ligen heißt der Rest neutral „Sonstige“ */
function srcLabels(){ return {draft:'Draft', waiver:'Waiver/FA', trade:'Trade', bestand: S.cfg.type === 'Keeper' ? 'Keeper' : S.cfg.type === 'Dynasty' ? 'Bestand (Vorsaison)' : 'Sonstige'}; }
const srcL = k => srcLabels()[k];
function rankChip(r, n){ const th = Math.ceil(n/3), st = tint(r, n); return r <= th ? `<span class="chip good" style="${st}">#${r}</span>` : r > n - th ? `<span class="chip bad" style="${st}">#${r}</span>` : `<span class="chip plain" style="${st}">#${r}</span>`; }

    ${rows.length ? `<div class="m-list">${rows.map(r => {
      const o = C.opp[r.w][rid], me = C.scores[r.w][rid], op = o != null ? C.scores[r.w][o] : null;
      const res = op == null ? '' : me > op ? '<span class="chip good">Sieg</span>' : me < op ? (op < r.optimal ? '<span class="chip warn">Niederlage, optimal ein Sieg</span>' : '<span class="chip bad">Niederlage</span>') : '<span class="chip plain">Remis</span>';
      const bi = r.benchIn[0], so = r.startOut[0];
      const txt = bi && r.left > .05 ? `${esc(pname(bi.pid))} (${f1(bi.pts)}) auf der Bank${so ? `, ${esc(pname(so.pid))} (${f1(so.pts)}) gestartet` : ''}` : 'optimal aufgestellt';
      return mRow(`W${r.w}`, `<div class="small">${txt}</div><div style="margin-top:4px">${res}</div>`, `<b>${r.left > .05 ? f1(r.left) : '–'}</b><small>von ${f1(r.optimal)}</small>`);
    }).join('')}</div>` : noWeeks()}</section>`;
  return out;
};

/* ---------- Liga ---------- */
VIEWS_M.league = () => {
  const C = S.C, L = S.league, sc = L.scoring_settings || {};
  const pr = [...S.teams].sort((a,b) => C.team[a.rid].prRank - C.team[b.rid].prRank);
  if (C.weeks.length) lineChart('ch-league', {labels: C.weeks.map(w => 'W' + w), series: weeklySeries(), avgLine: C.weeks.map(w => avg(Object.values(C.scores[w])))});
  return `${mHead(L.name, `${L.season} · ${S.cfg.type} · ${S.cfg.teams} Teams · ${scoringLabel()}`, avatar(L.avatar, L.name, 'lg'))}
  ${scaleKey()}
  <details class="panel m-det"><summary><h3>Liga-Profil</h3></summary>
    <div class="profile">
      <span>Scoring <b>${esc(scoringLabel())}</b></span><span>Pass-TD <b>${f0(sc.pass_td ?? 4)}</b></span>
      ${sc.bonus_rec_te ? `<span>TE-Premium <b>+${String(sc.bonus_rec_te).replace('.',',')}</b></span>` : ''}
      <span>Playoffs <b>${S.cfg.playoffTeams || '–'} Teams ab W${S.cfg.playoffStart || '–'}</b></span>
      ${S.cfg.faab != null ? `<span>FAAB <b>${S.cfg.faab} $</b></span>` : ''}
      ${S.cfg.tradeDeadline ? `<span>Trade-Deadline <b>W${S.cfg.tradeDeadline}</b></span>` : ''}
    </div>
    <div class="slots">${(L.roster_positions || []).filter(s => s !== 'BN').map(s => `<span class="slot">${esc(slotLabel(s))}</span>`).join('')}<span class="slot">${(L.roster_positions || []).filter(s => s === 'BN').length}× Bank</span></div>
  </details>
  <section class="panel"><h3>Tabelle</h3>
    <div class="m-list">${C.standings.map((t,i) => mRow(i+1, mTeam(t.rid, esc(t.manager) + (t.streak ? ' · ' + esc(t.streak) : '')), `<b class="tinted" style="${tint(i+1)}">${t.wins}–${t.losses}${t.ties ? '–' + t.ties : ''}</b><small>${f1(t.pf)} Pkt.</small>`, mineCls(t.rid))).join('')}</div>
  </section>
  <section class="panel"><div class="panel-head"><h3>Power Rankings</h3>${qm('<b>Power</b> = 0,4 × Ø Punkte + 0,4 × Ø letzte 3 Wochen + 0,2 × (Ø − Standardabweichung)<br>Die Zahl darunter zeigt, wie viele Plätze das Team besser (▲) oder schlechter (▼) steht als in der echten Tabelle.')}</div>
    <div class="m-list">${pr.map(t => { const T = C.team[t.rid], d = T.place - T.prRank;
      return mRow(T.prRank, mTeam(t.rid, `Ø ${f1(T.avg)} · Ø3 ${f1(T.l3)} · σ ${f1(T.sd)}`), `<b class="tinted" style="${tint(T.prRank)}">${f1(T.pr)}</b><small>${d > 0 ? `<span class="chip good">${d}</span>` : d < 0 ? `<span class="chip bad">${-d}</span>` : 'wie Tabelle'}</small>`, mineCls(t.rid)); }).join('')}</div>
  </section>
  <section class="panel"><div class="panel-head"><h3>Wochenverlauf</h3>${qm('Tippe ins Diagramm für die Wochenwerte. Über „Team einblenden“ vergleichst du dich mit anderen Teams.')}</div>${C.weeks.length ? `<div class="chart" id="ch-league"></div>${mChartKey()}` : noWeeks()}</section>`;
};

VIEWS_M.coaching = () => {
  const C = S.C; if (!C.weeks.length) return mHead('Coaching') + noWeeks();
  const eff = [...S.teams].sort((a,b) => C.team[a.rid].effRank - C.team[b.rid].effRank);
  const lr = [...S.teams].sort((a,b) => C.team[b.rid].luck - C.team[a.rid].luck);
  return `${mHead('Coaching', `${C.weeks.length} Wochen Hauptrunde`)}
  ${scaleKey()}
  <section class="panel"><div class="panel-head"><h3>Coaching-Effizienz</h3>${qm(`Echte Punkte ÷ bestmögliche Aufstellung aus dem eigenen Kader.`)}</div>
    <div class="m-list">${eff.map(t => { const T = C.team[t.rid]; return mRow(T.effRank, mTeam(t.rid, `${f1(T.left)} Pkt. verschenkt`), `<b class="tinted" style="${tint(T.effRank)}">${pct(T.eff)}</b>`, mineCls(t.rid)); }).join('')}</div>
  </section>
  <section class="panel"><div class="panel-head"><h3>All-Play &amp; Glück</h3>${qm(`Glück = echte Siege minus erwartete Siege aus der All-Play-Quote.`)}</div>
    <div class="m-list">${lr.map((t,i) => { const T = C.team[t.rid];
      return mRow(i+1, mTeam(t.rid, `Echt ${T.w}–${T.l} · All-Play ${T.apW}–${T.apL} (${pct(T.apPct)})`), `<b class="${T.luck > .25 ? 'pos-v' : T.luck < -.25 ? 'neg-v' : ''}">${sgn(T.luck)}</b><small>${T.luck > .25 ? 'Glück' : T.luck < -.25 ? 'Pech' : 'im Soll'}</small>`, mineCls(t.rid)); }).join('')}</div>
  </section>`;
};

VIEWS_M.draft = () => {
  const D = S.C.draft; if (!D) return mHead('Draft') + `<div class="empty">Für diese Saison gibt es keinen Draft mit Picks.</div>`;
  const nT = (S.draft && S.draft.settings && S.draft.settings.teams) || S.teams.length;
  const flt = S.draftFilter || 'all', round = Math.min(S.mRound || 1, D.rounds);
  S.after.push(() => {
    document.querySelectorAll('[data-dflt]').forEach(b => b.addEventListener('click', () => { S.draftFilter = b.dataset.dflt; renderView(); }));
    document.querySelectorAll('[data-rnd]').forEach(b => b.addEventListener('click', () => { S.mRound = +b.dataset.rnd; S.draftFilter = 'all'; renderView(); }));
    const cur = document.querySelector('[data-rnd][aria-pressed="true"]'); if (cur) cur.scrollIntoView({block:'nearest', inline:'center'});
  });
  const grades = Object.entries(D.grades).sort((a,b) => a[1].rank - b[1].rank);
  let picks = flt === 'all' ? D.rows.filter(r => r.round === round) : flt === 'mine' ? D.rows.filter(r => r.rid === S.myRid) : D.rows.filter(r => r.verdict === flt);
  picks = [...picks].sort((a,b) => a.no - b.no);
  return `${mHead('Draft', `${D.rows.length} Picks · ${D.rounds} Runden`)}
  ${scaleKey()}
  ${!D.hasData ? `<div class="note">Bewertungen erscheinen nach dem ersten Spieltag.</div>` : ''}
  <section class="panel"><div class="panel-head"><h3>Draft-Noten</h3>${qm(`Punkte über bzw. unter vergleichbaren Picks (gleiche Position, ähnliche Runde).`)}</div>
    <div class="m-list">${grades.map(([rid,g]) => mRow(g.rank, mTeam(+rid, `<span class="tinted" style="${tint(g.rank, grades.length)}">Value ${sgn(g.score)}/Pick</span> · ${g.steals} Steals · ${g.busts} Busts`), `<b class="grade ${gradeTone(g.grade)}">${g.grade}</b>`, mineCls(+rid))).join('')}</div>
  </section>
  <section class="panel"><h3>Picks</h3>
    <div class="filters">${[['all','Nach Runde'],['mine','Meine'],['steal','Steals'],['bust','Busts']].map(([k,l]) => `<button class="seg" data-dflt="${k}" aria-pressed="${flt === k}">${l}</button>`).join('')}</div>
    ${flt === 'all' ? `<div class="filters">${Array.from({length:D.rounds}, (_,i) => `<button class="seg" data-rnd="${i+1}" aria-pressed="${round === i+1}">R${i+1}</button>`).join('')}</div>` : ''}
    ${picks.length ? `<div class="m-list">${picks.map(r => mRow(`<span class="pk">${r.round}.${String(r.no - (r.round-1)*nT).padStart(2,'0')}</span>`,
      `<div class="pname">${esc(r.name)}</div><div class="pmeta">${posChip(r.pos)} ${esc(r.team || '')} · ${esc(S.teamByRid[r.rid]?.name || '')}</div>`,
      D.hasData ? `<b>${f1(r.pts)}</b><small>${r.verdict === 'steal' ? '<span class="chip good">Steal</span>' : r.verdict === 'bust' ? '<span class="chip bad">Bust</span>' : 'Erw. ' + f1(r.exp)}${r.g ? ` · Ø ${f1(r.ppg)}/Sp.` : ''}</small>` : '',
      mineCls(r.rid))).join('')}</div>` : `<div class="empty">Keine Picks in dieser Auswahl.</div>`}
  </section>`;
};

/* ---------- Start ---------- */
(function init(){
  applyDevice();
  const onMQ = () => { if (applyDevice() && S.C && S.myRid != null && document.getElementById('view')) renderApp(); };
  if (MQ.addEventListener) MQ.addEventListener('change', onMQ); else if (MQ.addListener) MQ.addListener(onMQ);
  document.addEventListener('touchstart', e => { if (!e.target.closest('.chart')) document.querySelectorAll('.chart .tip').forEach(t => t.hidden = true); }, {passive:true});
  let id = null;
  try { const u = new URL(location.href); id = u.searchParams.get('league'); } catch(e){}
  if (!id && /^#?\d{8,}$/.test(location.hash.replace('#',''))) id = location.hash.replace('#','');
  if (id) loadLeague(id); else renderStart();
})();
</script>
