# Lädt jeden Tag die offenen nflverse-Daten, rechnet sie zu kleinen JSON-Dateien zusammen
# und legt sie im Ordner data/ ab. Die Webseite lädt diese Dateien von der eigenen Adresse.
name: NFL-Daten aktualisieren

on:
  schedule:
    - cron: '40 10 * * *'   # täglich 10:40 UTC, nach den nächtlichen nflverse-Updates
  workflow_dispatch:         # von Hand starten: Reiter "Actions" > "Run workflow"

# Standard: nur lesen. Schreiben darf allein der Job unten, und nur Inhalte.
permissions:
  contents: read

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # um data/ einzuchecken
      pages: write      # um danach einen Pages-Neubau anzustoßen
    steps:
      # Auf einen festen Commit gepinnt (actions/checkout v4.3.1), damit kein fremder Code nachrutscht
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: true

      - name: Daten bauen (nur Python-Standardbibliothek)
        run: python3 scripts/build_data.py --out data

      - name: Änderungen einchecken
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
            echo "changed=false" >> "$GITHUB_ENV"
          else
            git commit -m "NFL-Daten aktualisiert"
            git push
            echo "changed=true" >> "$GITHUB_ENV"
          fi

      - name: Pages neu bauen
        if: env.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" --silent
